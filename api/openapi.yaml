      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        authorizationCode:
          type: string
          description: "Autorização da devolução. Até 20 letras e dígitos (guardado\
            \ em maiúsculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dí\
            gitos tem cara de número de cartão e é recusada (400 `PAYMENT_INVALID`).\
            \ Não existe no dinheiro."
          maxLength: 20
          nullable: true
        nsu:
          type: string
          description: "NSU da devolução. Até 20 letras e dígitos (guardado em maiú\
            sculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dígitos tem\
            \ cara de número de cartão e é recusada (400 `PAYMENT_INVALID`). Não existe\
            \ no dinheiro."
          maxLength: 20
          nullable: true
        reason:
          type: string
          description: Motivo (até 200 caracteres).
          example: Cancelamento dentro da política
          maxLength: 200
          minLength: 0
          nullable: true
      required:
