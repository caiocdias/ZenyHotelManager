          example: "10.5"
          nullable: true
          pattern: "\\d{1,14}(\\.\\d{1,4})?"
        unlimited:
          type: boolean
          description: Sem teto.
      required:
      - key
      - unlimited
    LimitValueResponse:
      type: object
      description: "O limite efetivo de uma chave: sem teto ou o teto."
      properties:
        key:
          type: string
