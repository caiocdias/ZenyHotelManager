      description: "Exige `staff.employees.manage`. Nada é apagado: o cadastro, o\
        \ vínculo e o histórico ficam; as entradas de trabalho (turno e troca) a partir\
        \ da data operacional saem da escala, e a geração deixa de escalá-lo. Desativar\
        \ de novo não muda nada."
