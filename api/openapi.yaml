        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um turno
      tags:
      - staff
  /api/v1/shifts/{id}:
    get:
      description: "Exige `staff.employees.read`. Inexistente: 404 `SHIFT_NOT_FOUND`."
