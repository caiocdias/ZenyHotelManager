        passwordChangeRequired:
          type: boolean
          description: Se o usuário precisa trocar a senha antes de usar a API.
        refreshToken:
          type: string
          description: "Refresh token opaco da sessão. Vale uma vez: use o novo de\
            \ cada resposta. Guarde-o só no armazenamento seguro do dispositivo."
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Até quando a sessão renova sem uso (30 dias depois do último
            refresh).
        sessionId:
          type: string
          format: uuid
        tokenType:
          type: string
          description: "Tipo do access token, para o cabeçalho Authorization."
          example: Bearer
        userId:
          type: string
          format: uuid
      required:
      - accessToken
      - accessTokenExpiresAt
      - passwordChangeRequired
      - refreshToken
      - refreshTokenExpiresAt
      - sessionId
      - tokenType
      - userId
    UpdateChecklistTemplateRequest:
      type: object
      description: O nome (vale na hora) e o rascunho inteiro de um modelo (vale na
        próxima publicação).
      properties:
        applicability:
          type: array
          description: "Regras de aplicabilidade (RF-CHK-04); vale qualquer uma. Vazio:\
            \ o modelo geral do contexto."
          items:
            $ref: "#/components/schemas/ApplicabilityRuleDto"
          maxItems: 20
          minItems: 0
        name:
          type: string
          description: Até 120 caracteres.
          example: Limpeza de saída
        sections:
          type: array
          description: "As seções, na ordem de exibição (de 1 a 30)."
          items:
            $ref: "#/components/schemas/ChecklistSectionDto"
          maxItems: 30
          minItems: 0
      required:
      - applicability
      - name
      - sections
    UpdateShiftRequest:
      type: object
      description: Nome e horários de um turno.
      properties:
        end:
          type: string
          format: time-local
          description: "Fim, no fuso do hotel; antes do início, termina no dia seguinte."
          example: 19:00:00
        name:
          type: string
          maxLength: 60
          minLength: 0
        start:
          type: string
          format: time-local
          description: "Início, no fuso do hotel."
          example: 07:00:00
      required:
      - end
      - name
      - start
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - name
    UserResponse:
      type: object
      description: Um usuário do sistema. Senha e PIN nunca saem.
      properties:
        active:
          type: boolean
        administrator:
          type: boolean
          description: Se o usuário tem a role de sistema Administrador.
        createdAt:
          type: string
          format: date-time
        hasPin:
          type: boolean
          description: Se o usuário tem PIN de aprovação.
        id:
          type: string
          format: uuid
        lockedUntil:
          type: string
          format: date-time
          description: Até quando o login está bloqueado por tentativas erradas.
          nullable: true
        login:
          type: string
          description: Login normalizado (minúsculo).
        name:
          type: string
        passwordChangeRequired:
          type: boolean
          description: Se o usuário precisa trocar a senha no próximo login.
        roles:
          type: array
          description: "Roles atribuídas, ativas ou não, em ordem de nome."
          items:
            $ref: "#/components/schemas/UserRoleResponse"
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - administrator
      - createdAt
      - hasPin
      - id
      - login
      - name
      - passwordChangeRequired
      - roles
      - updatedAt
    UserRoleResponse:
      type: object
      description: Uma role atribuída a um usuário.
      properties:
        active:
          type: boolean
          description: Role inativa não concede nada.
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - active
      - id
      - name
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token JWT (RS256) de `POST /api/v1/auth/login` ou `POST\
        \ /api/v1/auth/refresh`, válido por 15 min. Enquanto a troca de senha estiver\
        \ pendente, só `POST /api/v1/auth/password` e `POST /api/v1/auth/logout` respondem;\
        \ o resto devolve 403 `PASSWORD_CHANGE_REQUIRED`."
      scheme: bearer
      type: http
