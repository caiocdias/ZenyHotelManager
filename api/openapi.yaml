    ReceivePaymentRequest:
      type: object
      description: "Um recebimento na conta, registrado manualmente (RF-PAG-03). **Nunca**\
        \ envie o número do cartão nem o CVV (PCI-DSS, RNF-10): só a bandeira e os\
        \ 4 últimos dígitos, além do NSU e da autorização da maquininha."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        authorizationCode:
          type: string
          description: "Código de autorização. Até 20 letras e dígitos (guardado em\
            \ maiúsculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dígitos\
            \ tem cara de número de cartão e é recusada (400 `PAYMENT_INVALID`). Nã\
            o existe no dinheiro."
          example: A1B2C3
          maxLength: 20
          nullable: true
        cardBrand:
          type: string
          description: "Só no cartão: a bandeira (só letras e espaços, até 20)."
          example: VISA
          maxLength: 20
          nullable: true
        cardLast4:
          type: string
          description: "Só no cartão: exatamente os 4 últimos dígitos (nunca o nú\
            mero completo)."
          example: "1234"
          nullable: true
          pattern: "^[0-9]{4}$"
        deposit:
          type: boolean
          description: "Marca o pagamento como depósito (sinal antes da chegada, RF-CTA-07)."
        method:
          type: string
          description: "Forma de pagamento. `CITY_LEDGER` (faturado) ainda não está\
            \ disponível: 422 `PAYMENT_METHOD_NOT_AVAILABLE`."
          enum:
          - CASH
          - DEBIT_CARD
          - CREDIT_CARD
          - PIX
          - BANK_TRANSFER
          - OTHER
          - CITY_LEDGER
          nullable: true
        nsu:
          type: string
          description: "NSU da transação. Até 20 letras e dígitos (guardado em maiú\
            sculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dígitos tem\
            \ cara de número de cartão e é recusada (400 `PAYMENT_INVALID`). Não existe\
            \ no dinheiro."
          example: "004512"
          maxLength: 20
          nullable: true
        tendered:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
      required:
      - amount
      - deposit
      - method
