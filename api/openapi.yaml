      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageUserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar usuários
      tags:
      - iam
    post:
      description: "Exige `iam.users.manage`. A senha é provisória: o usuário a troca\
        \ no primeiro login. O PIN (4 a 8 dígitos) é opcional. Login já usado, sem\
        \ diferenciar maiúsculas: 409 `LOGIN_ALREADY_IN_USE`. As roles seguem as regras\
        \ de `PUT /users/{id}/roles`."
      operationId: createUser
      parameters:
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Usuário criado.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um usuário
      tags:
      - iam
  /api/v1/users/{id}:
    get:
      description: "Exige `iam.users.read`. O `ETag` vai no `If-Match` das edições.\
        \ Inexistente: 404 `USER_NOT_FOUND`."
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um usuário
      tags:
      - iam
    put:
      description: "Troca o nome (o login não muda). Exige `iam.users.manage` e o\
        \ `If-Match` (ausente: 428; versão diferente: 412). Um administrador só é\
        \ editado por outro administrador (403 `ADMINISTRATOR_REQUIRED`)."
      operationId: updateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
