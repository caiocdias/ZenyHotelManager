              $ref: "#/components/schemas/HousekeepingObservationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingObservationResponse"
          description: Observação registrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
