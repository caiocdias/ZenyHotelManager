        \ inexistente: 400 `UNKNOWN_EMPLOYEE`/`UNKNOWN_SHIFT`; colaborador desativado:\
        \ 422 `EMPLOYEE_INACTIVE`; outro padrão ativo do colaborador no período: 409\
