      tags:
      - billing
    post:
      description: "Na data operacional, com número `C-<ano>-<sequência>`. Exige `billing.folios.manage`.\
        \ Dono sem id (fora da avulsa): 400 `FOLIO_OWNER_INVALID`; empresa (dona ou\
        \ pagadora) inexistente: 400 `UNKNOWN_COMPANY`; desativada: 422 `COMPANY_INACTIVE`;\
        \ limite negativo: 400 `BILLING_DATA_INVALID`."
      operationId: openFolio
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolioOpenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolioResponse"
          description: Conta aberta.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Abrir uma conta
      tags:
      - billing
  /api/v1/folios/{id}:
    get:
      description: "Com o saldo; o `ETag` muda a cada lançamento. Exige `billing.folios.read`.\
        \ Inexistente: 404 `FOLIO_NOT_FOUND`."
      operationId: getFolio
      parameters:
      - in: path
        name: id
        required: true
