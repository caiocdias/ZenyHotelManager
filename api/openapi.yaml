          - OCCUPIED
      - description: Só as UHs com este status de governança.
        in: query
        name: housekeepingStatus
        required: false
        schema:
          type: string
          enum:
          - DIRTY
          - CLEAN
          - INSPECTED
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
