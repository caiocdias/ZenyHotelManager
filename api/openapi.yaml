  /api/v1/folios/{folioId}/payments/{paymentId}/refund:
    post:
      description: "Devolução vinculada ao recebimento, na mesma forma (no dinheiro,\
        \ sai da gaveta), com motivo, no turno de caixa aberto do próprio usuário\
        \ (sem turno: 422 `CASHIER_SHIFT_REQUIRED`), que a tira do esperado do turno.\
        \ Exige antes `billing.folios.read` (sem ela, 403 `PERMISSION_DENIED`). Até\
        \ o reembolsável (o pago menos os reembolsos anteriores; acima: 422 `REFUND_EXCEEDS_REFUNDABLE`);\
        \ reembolso de um reembolso: 422 `PAYMENT_NOT_REFUNDABLE`; inexistente nesta\
        \ conta: 404 `PAYMENT_NOT_FOUND`; conta encerrada: 409 `FOLIO_CLOSED`. Essas\
        \ regras vêm antes da aprovação. Ação **sensível** com o limite `maxAmount`\
        \ sobre o total reembolsado do pagamento (os anteriores mais este): sem `billing.payments.refund`,\
        \ ou acima do limite, 403 `APPROVAL_REQUIRED` (com `action`, `permission`,\
        \ `resourceRef` e `limit`); repita com o `X-Approval-Token` de `POST /api/v1/auth/approvals`\
        \ e **outra** `Idempotency-Key`."
      operationId: refundPayment
      parameters:
      - in: path
        name: folioId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundPaymentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: Reembolsado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
