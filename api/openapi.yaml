        key:
          type: string
          description: Chave estável dos oito códigos pré-carregados; nula nos criados
            pela API.
          enum:
          - ROOM_CHARGE
          - CANCELLATION_FEE
          - NO_SHOW_FEE
          - SERVICE_CHARGE
          - FOOD_BEVERAGE
          - LAUNDRY
          - TOURISM_FEE
          - MISCELLANEOUS
          nullable: true
        kind:
          type: string
          enum:
          - CHARGE
          - PENALTY
          - SERVICE_CHARGE
          - TAX
          - CREDIT
        name:
          type: string
        passThrough:
          type: boolean
          description: "Se o grupo de receita é **repasse**, não receita do hotel\
            \ (RN-10): só `SERVICE_CHARGE`, a taxa de serviço repassada aos empregados."
        revenueGroup:
          type: string
          enum:
          - ROOM
          - FOOD_BEVERAGE
          - SERVICE_CHARGE
          - FEES
          - TAXES
          - LAUNDRY
          - OTHER
        serviceChargeApplies:
          type: boolean
        serviceChargeRate:
          type: string
          format: decimal
          description: "Percentual em pontos (12.5 = 12,5%), até 4 casas."
          example: "12.5"
          nullable: true
          pattern: "^-?\\d{1,3}(\\.\\d{1,4})?$"
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - code
      - createdAt
      - id
      - kind
      - name
      - passThrough
      - revenueGroup
      - serviceChargeApplies
      - updatedAt
    TransactionCodeUpdateRequest:
      type: object
      description: Os dados editáveis de um código de lançamento (o tipo e o grupo
        de receita são fixos).
      properties:
        code:
          type: string
          description: "Letras, dígitos, `_` e `-`, até 20; guardado em maiúsculas."
          example: FRIGOBAR
          maxLength: 20
          minLength: 0
          nullable: true
        fiscalClassification:
          type: string
          maxLength: 60
          minLength: 0
          nullable: true
        name:
          type: string
          maxLength: 80
          minLength: 0
          nullable: true
        serviceChargeApplies:
          type: boolean
        serviceChargeRate:
          type: string
          format: decimal
          description: "Percentual em pontos (12.5 = 12,5%), até 4 casas."
          example: "12.5"
          nullable: true
          pattern: "^-?\\d{1,3}(\\.\\d{1,4})?$"
      required:
      - code
      - name
      - serviceChargeApplies
    TransferRequest:
      type: object
      description: Transferir lançamentos inteiros (o que ainda resta de cada um)
        para outra conta.
      properties:
        postingIds:
          type: array
          description: "Os lançamentos desta conta, de 1 a 100, sem repetir."
          items:
            type: string
            format: uuid
            description: "Os lançamentos desta conta, de 1 a 100, sem repetir."
          maxItems: 100
          minItems: 1
          nullable: true
        reason:
          type: string
          description: "Motivo (opcional, até 500)."
          maxLength: 500
          minLength: 0
          nullable: true
        targetFolioId:
          type: string
          format: uuid
          nullable: true
      required:
      - postingIds
      - targetFolioId
    TransferResponse:
      type: object
      description: As partes movidas por uma transferência ou divisão.
      properties:
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/TransferredPostingResponse"
      required:
      - transfers
    TransferredPostingResponse:
      type: object
      description: "Uma parte movida: o lançamento de onde saiu, a saída (nesta conta)\
        \ e a entrada (no destino)."
      properties:
        incoming:
          $ref: "#/components/schemas/PostingResponse"
        originalId:
          type: string
          format: uuid
        outgoing:
          $ref: "#/components/schemas/PostingResponse"
        serviceChargeIncoming:
          allOf:
          - $ref: "#/components/schemas/PostingResponse"
          nullable: true
        serviceChargeOutgoing:
          allOf:
          - $ref: "#/components/schemas/PostingResponse"
          nullable: true
      required:
      - incoming
      - originalId
      - outgoing
    UnpricedByDerivationResponse:
      type: object
      description: "O que a derivação deixou sem preço nesta data: o ajuste do plano\
        \ derivado deu zero ou menos (o valor do base em 0,00 continua 0,00 sob percentual;\
        \ um valor negativo somado a ele o deixa sem preço). A ocupação fica não vendá\
        vel, como uma sem preço gravado; a regra vale nas outras datas."
      nullable: true
      properties:
        children:
          type: array
          description: As faixas de criança sem preço.
          items:
            $ref: "#/components/schemas/AgeRangeResponse"
        extraAdult:
          type: boolean
        oneAdult:
          type: boolean
        twoAdults:
          type: boolean
      required:
      - children
      - extraAdult
      - oneAdult
      - twoAdults
    UnreadCountResponse:
      type: object
      description: Quantas notificações do próprio usuário ainda não foram lidas.
      properties:
        count:
          type: integer
          format: int32
      required:
      - count
    UpdateChecklistTemplateRequest:
      type: object
      description: O nome (vale na hora) e o rascunho inteiro de um modelo (vale na
        próxima publicação).
      properties:
        applicability:
          type: array
          description: "Regras de aplicabilidade (RF-CHK-04); vale qualquer uma. Vazio:\
            \ o modelo geral do contexto."
          items:
            $ref: "#/components/schemas/ApplicabilityRuleDto"
          maxItems: 20
          minItems: 0
        name:
          type: string
          description: Até 120 caracteres.
          example: Limpeza de saída
        sections:
          type: array
          description: "As seções, na ordem de exibição (de 1 a 30)."
          items:
            $ref: "#/components/schemas/ChecklistSectionDto"
          maxItems: 30
          minItems: 0
      required:
      - applicability
      - name
      - sections
    UpdateShiftRequest:
      type: object
      description: Nome e horários de um turno.
      properties:
        end:
          type: string
          format: time-local
          description: "Fim, no fuso do hotel; antes do início, termina no dia seguinte."
          example: 19:00:00
        name:
          type: string
          maxLength: 60
          minLength: 0
        start:
          type: string
          format: time-local
          description: "Início, no fuso do hotel."
          example: 07:00:00
      required:
      - end
      - name
      - start
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - name
    UserResponse:
      type: object
      description: Um usuário do sistema. Senha e PIN nunca saem.
      properties:
        active:
          type: boolean
        administrator:
          type: boolean
          description: Se o usuário tem a role de sistema Administrador.
        createdAt:
          type: string
          format: date-time
        hasPin:
          type: boolean
          description: Se o usuário tem PIN de aprovação.
        id:
          type: string
          format: uuid
        lockedUntil:
          type: string
          format: date-time
          description: Até quando o login está bloqueado por tentativas erradas.
          nullable: true
        login:
          type: string
          description: Login normalizado (minúsculo).
        name:
          type: string
        passwordChangeRequired:
          type: boolean
          description: Se o usuário precisa trocar a senha no próximo login.
        roles:
          type: array
          description: "Roles atribuídas, ativas ou não, em ordem de nome."
          items:
            $ref: "#/components/schemas/UserRoleResponse"
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - administrator
      - createdAt
      - hasPin
      - id
      - login
      - name
      - passwordChangeRequired
      - roles
      - updatedAt
    UserRoleResponse:
      type: object
      description: Uma role atribuída a um usuário.
      properties:
        active:
          type: boolean
          description: Role inativa não concede nada.
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - active
      - id
      - name
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token JWT (RS256) de `POST /api/v1/auth/login` ou `POST\
        \ /api/v1/auth/refresh`, válido por 15 min. Enquanto a troca de senha estiver\
        \ pendente, só `POST /api/v1/auth/password` e `POST /api/v1/auth/logout` respondem;\
        \ o resto devolve 403 `PASSWORD_CHANGE_REQUIRED`."
      scheme: bearer
      type: http
