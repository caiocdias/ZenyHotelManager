      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteePolicyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma política de garantia
      tags:
      - rates
    put:
      description: "Troca os termos; vale na hora para as reservas criadas depois,\
        \ sem mudar as existentes. Exige `rates.plans.manage`. e o `If-Match` (ausente:\
        \ 428; versão diferente: 412). Nome repetido (sem diferenciar maiúsculas,\
        \ inclusive de uma desativada): 409 `GUARANTEE_POLICY_NAME_ALREADY_IN_USE`;\
        \ depósito sem percentual ou prazo, ou eles noutro tipo: 400 `GUARANTEE_POLICY_INVALID`\
        \ (com o campo)."
      operationId: updateGuaranteePolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuaranteePolicyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteePolicyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma política de garantia
      tags:
      - rates
  /api/v1/guarantee-policies/{id}/deactivate:
    post:
      description: "Exige `rates.plans.manage`. Usada por um plano ativo: 422 `GUARANTEE_POLICY_IN_USE`.\
        \ Nada é apagado."
      operationId: deactivateGuaranteePolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteePolicyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma política de garantia
      tags:
      - rates
  /api/v1/guarantee-policies/{id}/reactivate:
    post:
      description: Exige `rates.plans.manage`.
      operationId: reactivateGuaranteePolicy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteePolicyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma política de garantia
      tags:
      - rates
  /api/v1/guests:
    get:
      description: "Em ordem de nome (sem acento). `name` procura cada palavra como\
        \ trecho do nome ou do nome social, sem diferenciar acento nem maiúsculas;\
        \ `email` é exato. Para buscar por documento, use `POST /api/v1/guests/search-by-document`\
        \ (o número não vai na URL). Só perfis ativos (um mesclado só se lê pelo id).\
        \ Exige `guests.profiles.read`. Os documentos vêm mascarados (só os últimos\
        \ caracteres) e os dados sensíveis da FNRH nunca vêm."
      operationId: listGuests
      parameters:
      - description: Trecho do nome ou do nome social (de 2 a 200 caracteres).
        in: query
        name: name
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 2
      - description: E-mail exato.
        in: query
        name: email
        required: false
        schema:
          type: string
          maxLength: 254
          minLength: 0
      - description: Só os da lista de restrição (`true`) ou só os fora dela (`false`).
        in: query
        name: restricted
        required: false
        schema:
          type: boolean
      - description: Só os VIP (`true`) ou só os não VIP (`false`).
        in: query
        name: vip
        required: false
        schema:
          type: boolean
      - description: Só os ligados a esta empresa.
        in: query
        name: companyId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageGuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Buscar perfis de hóspedes
      tags:
      - guests
    post:
      description: "Exige `guests.profiles.manage`. O endereço completo é só de quem\
        \ reside no Brasil (400 `ADDRESS_REQUIRES_BRAZIL_RESIDENCE`). CPF com dígito\
        \ verificador errado ou número fora do formato do tipo: 400 `DOCUMENT_NUMBER_INVALID`;\
        \ país emissor incompatível com o tipo: 400 `DOCUMENT_COUNTRY_INVALID`. Restriç\
        ões alimentares sem o consentimento `DIETARY_RESTRICTIONS` (que pode vir em\
        \ `consents`): 422 `DIETARY_RESTRICTIONS_REQUIRE_CONSENT`."
      operationId: createGuest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: Perfil cadastrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar um perfil de hóspede
      tags:
      - guests
  /api/v1/guests/duplicate-candidates:
    get:
      description: "Pares de perfis ativos com um documento igual (pelo índice cego,\
        \ sem decifrar nada) ou o mesmo e-mail (RF-HOS-05), cada par uma vez, o de\
        \ menor id primeiro, em ordem dos ids. `guestId`: só os pares desse perfil\
        \ (inexistente: 404 `GUEST_NOT_FOUND`). Documentos indexados com chaves diferentes\
        \ do anel (no meio de uma rotação) só se casam depois da reindexação. Exige\
        \ `guests.profiles.read`. Os documentos vêm mascarados (só os últimos caracteres)\
        \ e os dados sensíveis da FNRH nunca vêm."
      operationId: listGuestDuplicateCandidates
      parameters:
      - description: Só os pares deste perfil.
        in: query
        name: guestId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageDuplicateCandidateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar candidatos a duplicado
      tags:
      - guests
  /api/v1/guests/search-by-document:
    post:
      description: "Pelo índice cego (H8): o número é normalizado como no cadastro\
        \ e comparado só pelo hash, sem decifrar os registros. Vai no corpo, nunca\
        \ na URL. Até 50 perfis ativos (mais de um: duplicados). Número inválido para\
        \ o tipo: 400 `DOCUMENT_NUMBER_INVALID`. Exige `guests.profiles.read`. Os\
        \ documentos vêm mascarados (só os últimos caracteres) e os dados sensíveis\
        \ da FNRH nunca vêm."
      operationId: searchGuestsByDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDocumentSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestListResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Buscar perfis por documento
      tags:
      - guests
  /api/v1/guests/{id}:
    get:
      description: "Exige `guests.profiles.read`. Os documentos vêm mascarados (só\
        \ os últimos caracteres) e os dados sensíveis da FNRH nunca vêm. Um perfil\
        \ mesclado continua respondendo, com `status` `MERGED` e o sobrevivente em\
        \ `mergedInto`. Inexistente: 404 `GUEST_NOT_FOUND`."
      operationId: getGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um perfil de hóspede
      tags:
      - guests
    put:
      description: "Troca os dados do perfil (não os documentos, os dados sensíveis\
        \ nem a restrição, que têm ações próprias). Exige `guests.profiles.manage`.\
        \ e o `If-Match` (ausente: 428; versão diferente: 412). Num perfil mesclado:\
        \ 409 `GUEST_ALREADY_MERGED` (altere o sobrevivente); num anonimizado, 409\
        \ `GUEST_ANONYMIZED`."
      operationId: updateGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: "Pedido do titular (RF-HOS-07): a trilha registra a correção\
          \ com a origem `DATA_SUBJECT_REQUEST`."
        in: query
        name: dataSubjectRequest
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Corrigir um perfil de hóspede
      tags:
      - guests
  /api/v1/guests/{id}/anonymize:
    post:
      description: "Irreversível (RF-HOS-07). Ficam o id, a situação `ANONYMIZED`,\
        \ os consentimentos, a nacionalidade, o país de residência, a UF e o municí\
        pio e o VIP; saem o nome, os contatos, o endereço de rua, a data de nascimento,\
        \ o gênero, as preferências, as observações, as restrições alimentares, a\
        \ empresa, a restrição, os dados sensíveis da FNRH, os documentos e os anexos.\
        \ Ação sensível: sem `guests.data.anonymize`, 403 `APPROVAL_REQUIRED`, e a\
        \ requisição repetida com o `X-Approval-Token` de um superior é concluída.\
        \ Com estadia ativa: 409 `GUEST_HAS_ACTIVE_STAY`; já anonimizado: 409 `GUEST_ANONYMIZED`.\
        \ Vale para o titular inteiro: o perfil e os absorvidos por ele em mesclagens.\
        \ Num perfil mesclado: 409 `GUEST_ALREADY_MERGED` (faça o pedido no sobrevivente).\
        \ Inexistente: 404 `GUEST_NOT_FOUND`."
      operationId: anonymizeGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Anonimizar o perfil a pedido do titular
      tags:
      - guests
  /api/v1/guests/{id}/attachments:
    get:
      description: "Documento de identidade e autorização de menor (RF-HOS-08), em\
        \ ordem de vínculo, com os metadados. O conteúdo sai por `GET /api/v1/files/{fileId}/download-url`\
        \ (URL de curta duração do servidor; cada URL emitida e cada download ficam\
        \ na trilha). Exige `guests.attachments.read`."
      operationId: listGuestAttachments
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAttachmentListResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os anexos de um perfil
      tags:
      - guests
    post:
      description: "O anexo já enviado por `POST /api/v1/files` com uma finalidade\
        \ de hóspede (`guests.id-document-photo`, `guests.minor-authorization-photo`\
        \ ou `guests.document-pdf`, sensíveis). Já vinculado a este perfil: 200, sem\
        \ mudar nada. Inexistente, de outra finalidade ou de outro registro: 422 `GUEST_ATTACHMENT_INVALID`.\
        \ Exige `guests.attachments.manage`. Num perfil mesclado: 409 `GUEST_ALREADY_MERGED`;\
        \ num anonimizado, 409 `GUEST_ANONYMIZED`."
      operationId: attachGuestFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachGuestFileRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAttachmentResponse"
          description: Anexo vinculado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Vincular um anexo ao perfil
      tags:
      - guests
  /api/v1/guests/{id}/attachments/{fileId}/remove:
    post:
      description: "Apaga o anexo (o arquivo sai do armazenamento). Não vinculado\
        \ a este perfil: 404 `GUEST_ATTACHMENT_NOT_FOUND`. Exige `guests.attachments.manage`."
      operationId: removeGuestAttachment
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Anexo retirado e apagado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Retirar um anexo do perfil
      tags:
      - guests
  /api/v1/guests/{id}/consents:
    get:
      description: "Todos, inclusive os revogados, do mais recente ao mais antigo\
        \ (RF-HOS-07). Exige `guests.profiles.read`."
      operationId: listGuestConsents
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentListResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os consentimentos de um perfil
      tags:
      - guests
    post:
      description: "O consentimento do titular para a finalidade, com o meio (a origem)\
        \ e o instante. Já havendo um ativo da mesma finalidade, devolve-o (200) sem\
        \ mudar nada. Exige `guests.profiles.manage`. Num perfil mesclado: 409 `GUEST_ALREADY_MERGED`;\
        \ num anonimizado, 409 `GUEST_ANONYMIZED`."
      operationId: grantGuestConsent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
          description: Consentimento registrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Registrar um consentimento
      tags:
      - guests
  /api/v1/guests/{id}/consents/{consentId}/revoke:
    post:
      description: "Marca a revogação com o meio e o instante (o registro fica, como\
        \ prova). Revogar o de `DIETARY_RESTRICTIONS` apaga as restrições alimentares\
        \ gravadas. Já revogado: nada muda. De outro perfil ou inexistente: 404 `CONSENT_NOT_FOUND`.\
        \ Exige `guests.profiles.manage`. Nunca é recusada pela situação do perfil\
        \ (LGPD art. 8º §5º): vale num perfil anonimizado e num mesclado, e pelo id\
        \ de um mesclado o consentimento é procurado também na cadeia até o sobrevivente,\
        \ para onde a mesclagem o levou."
      operationId: revokeGuestConsent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: consentId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeConsentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar um consentimento
      tags:
      - guests
  /api/v1/guests/{id}/documents:
    post:
      description: "Exige `guests.profiles.manage`. Um documento de cada tipo e paí\
        s por perfil (repetido: 409 `DOCUMENT_ALREADY_RECORDED`; para corrigir, retire\
        \ o anterior). Devolve o perfil. Num perfil mesclado: 409 `GUEST_ALREADY_MERGED`\
        \ (altere o sobrevivente); num anonimizado, 409 `GUEST_ANONYMIZED`."
      operationId: addGuestDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Pedido do titular (RF-HOS-07): a trilha registra a correção\
          \ com a origem `DATA_SUBJECT_REQUEST`."
        in: query
        name: dataSubjectRequest
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDocumentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Acrescentar um documento
      tags:
      - guests
  /api/v1/guests/{id}/documents/{documentId}/remove:
    post:
      description: "Exige `guests.profiles.manage`. De outro perfil ou inexistente:\
        \ 404 `GUEST_DOCUMENT_NOT_FOUND`. Devolve o perfil. Num perfil mesclado: 409\
        \ `GUEST_ALREADY_MERGED` (altere o sobrevivente); num anonimizado, 409 `GUEST_ANONYMIZED`."
      operationId: removeGuestDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Pedido do titular (RF-HOS-07): a trilha registra a correção\
          \ com a origem `DATA_SUBJECT_REQUEST`."
        in: query
        name: dataSubjectRequest
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Retirar um documento
      tags:
      - guests
  /api/v1/guests/{id}/documents/{documentId}/reveal:
    post:
      description: "O número inteiro (H9). Exige `guests.documents.reveal`; cada acesso\
        \ fica na trilha de auditoria. A resposta não vai para cache (`Cache-Control:\
        \ no-store`)."
      operationId: revealGuestDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedDocumentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revelar o número de um documento
      tags:
      - guests
  /api/v1/guests/{id}/export:
    post:
      description: "O pacote completo com os dados pessoais do titular (inclusive\
        \ o número dos documentos e os dados sensíveis da FNRH), na própria resposta\
        \ (nada fica guardado; sem cache). Ação sensível: sem `guests.data.export`,\
        \ 403 `APPROVAL_REQUIRED`, e a requisição repetida com o `X-Approval-Token`\
        \ de um superior é concluída. O acesso fica na trilha (sem os dados exportados).\
        \ Vale para o titular inteiro: o perfil e os absorvidos por ele em mesclagens.\
        \ Num perfil mesclado: 409 `GUEST_ALREADY_MERGED` (faça o pedido no sobrevivente).\
        \ Inexistente: 404 `GUEST_NOT_FOUND`."
      operationId: exportGuestData
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDataExportResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Exportar os dados do titular
      tags:
      - guests
  /api/v1/guests/{id}/lift-restriction:
    post:
      description: "Exige `guests.restrictions.manage`. Fora da lista, não muda nada.\
        \ Num perfil mesclado: 409 `GUEST_ALREADY_MERGED` (altere o sobrevivente);\
        \ num anonimizado, 409 `GUEST_ANONYMIZED`."
      operationId: liftGuestRestriction
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Retirar da lista de restrição
      tags:
      - guests
  /api/v1/guests/{id}/merge:
    post:
      description: "O perfil do caminho é o sobrevivente; `mergedGuestId` fica como\
        \ mesclado (`MERGED`, com `mergedInto`), nunca é apagado, e o evento `GuestsMerged`\
        \ sai pelo outbox na mesma transação. Exige `guests.profiles.merge` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412) do sobrevivente. O mesmo perfil: 409\
        \ `GUEST_MERGE_SAME_PROFILE`; algum já mesclado: 409 `GUEST_ALREADY_MERGED`;\
        \ documento do mesmo tipo e país com números diferentes: 409 `GUEST_MERGE_DOCUMENT_CONFLICT`\
        \ (retire o errado antes); inexistente: 404 `GUEST_NOT_FOUND`. Devolve o sobrevivente."
      operationId: mergeGuests
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeGuestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Mesclar um perfil duplicado neste
      tags:
      - guests
  /api/v1/guests/{id}/restrict:
    post:
      description: "Com o motivo, que gera alerta na reserva e no check-in (RF-HOS-04);\
        \ de novo, troca o motivo. Exige `guests.restrictions.manage`. Num perfil\
        \ mesclado: 409 `GUEST_ALREADY_MERGED` (altere o sobrevivente); num anonimizado,\
        \ 409 `GUEST_ANONYMIZED`."
      operationId: restrictGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictGuestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Incluir na lista de restrição
      tags:
      - guests
  /api/v1/guests/{id}/sensitive-data:
    put:
      description: "Raça/cor e deficiência (RN-19): ficam cifrados e nunca voltam\
        \ pela API (só `hasSensitiveData`); os dois nulos apagam. Define o valor,\
        \ sem `If-Match`. Exige `guests.profiles.manage`. Num perfil mesclado: 409\
        \ `GUEST_ALREADY_MERGED` (altere o sobrevivente); num anonimizado, 409 `GUEST_ANONYMIZED`."
