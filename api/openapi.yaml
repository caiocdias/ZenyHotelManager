        mergedGuestId:
          type: string
          format: uuid
          description: "O perfil absorvido: fica como mesclado (`MERGED`), nunca é\
            \ apagado."
          nullable: true
        takeFromMerged:
          type: array
          description: "Os dados do perfil que vêm do absorvido (por padrão, nenhum:\
            \ vale o do sobrevivente)."
          items:
            type: string
            description: "Os dados do perfil que vêm do absorvido (por padrão, nenhum:\
              \ vale o do sobrevivente)."
            enum:
            - FULL_NAME
            - SOCIAL_NAME
            - NATIONALITY
            - BIRTH_DATE
            - GENDER
            - EMAIL
            - PHONE
            - RESIDENCE
            - PREFERENCES
            - NOTES
            - COMPANY
            - SENSITIVE_DATA
            - DIETARY_RESTRICTIONS
          uniqueItems: true
      required:
      - mergedGuestId
      - takeFromMerged
