      - items
    CursorPageDepartmentResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPageEmployeeResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPagePermissionResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPageRoleResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleResponse"
        nextCursor:
          type: string
