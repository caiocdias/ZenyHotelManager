  /api/v1/rooms/{id}/housekeeping-status:
    post:
      description: "Só as transições da SPEC §8.4: Sujo → Limpo (`MARK_CLEAN`, com\
        \ `requiresInspection` para deixar a inspeção pendente), Limpo → Inspecionado\
        \ (`MARK_INSPECTED`), Limpo com inspeção pendente → Sujo (`REJECT_INSPECTION`)\
        \ e Limpo ou Inspecionado → Sujo (`MARK_DIRTY`); as outras: 422 `HOUSEKEEPING_TRANSITION_NOT_ALLOWED`.\
        \ Repetir o estado atual não muda nada. Exige `rooms.status.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Fica no histórico com a origem `MANUAL`\
        \ (RN-08)."
      operationId: changeRoomHousekeepingStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Mudar à mão o status de governança
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order:
    post:
      description: "Abre um período de até 365 dias que não começa antes da data operacional\
        \ (422 `OUT_OF_ORDER_PERIOD_IN_PAST`), numa UH ativa (422 `ROOM_INACTIVE`),\
        \ sem sobrepor outro período da UH (409 `OUT_OF_ORDER_OVERLAP`). OOO não se\
        \ aplica a UH ocupada se o período inclui a data operacional (RN-07, 422 `OUT_OF_ORDER_ROOM_OCCUPIED`);\
        \ OOS sim. OOO exige `rooms.outoforder.manage` ou a aprovação de um superior\
        \ (ação `rooms.out-of-order.open`, recurso `rooms.room:<id da UH>`); OOS,\
        \ `rooms.outofservice.manage`. Não muda o status de governança. Publica `OutOfOrderChanged`."
      operationId: openOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenOutOfOrderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: Período aberto.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Colocar a UH em OOO ou OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order/{periodId}:
    get:
      description: "Com o `ETag`, para a edição. Exige `rooms.outoforder.read`. Inexistente\
        \ ou de outra UH: 404 `OUT_OF_ORDER_NOT_FOUND`."
      operationId: getOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um período OOO/OOS
      tags:
      - rooms
    put:
      description: "Troca o período, o motivo, o responsável e o status de retorno;\
        \ o tipo não muda (libere e abra outro). Exige o `If-Match` (ausente: 428;\
        \ versão diferente: 412). Um início ou fim alterado não fica antes da data\
        \ operacional (422 `OUT_OF_ORDER_PERIOD_IN_PAST`); período liberado: 422 `OUT_OF_ORDER_RELEASED`;\
        \ sobreposição: 409 `OUT_OF_ORDER_OVERLAP`; OOO que passa a incluir a data\
        \ operacional numa UH ocupada: 422 `OUT_OF_ORDER_ROOM_OCCUPIED`. OOO exige\
        \ `rooms.outoforder.manage` ou aprovação (ação `rooms.out-of-order.update`,\
        \ recurso `rooms.out-of-order:<id>`). Publica `OutOfOrderChanged`."
      operationId: updateOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutOfOrderRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Alterar um período OOO/OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order/{periodId}/release:
    post:
      description: "Libera na data operacional: a UH deixa de estar bloqueada a partir\
        \ dela. Se o período estava em vigor, a UH volta ao status de governança de\
        \ retorno, com o histórico (origem `MANUAL`); um período que ainda não começ\
        ou é cancelado, e um que já terminou só é encerrado, sem mudar o status. Liberar\
        \ de novo não muda nada. OOO exige `rooms.outoforder.manage` ou aprovação\
        \ (ação `rooms.out-of-order.release`, recurso `rooms.out-of-order:<id>`);\
        \ OOS, `rooms.outofservice.manage`. Publica `OutOfOrderChanged`."
      operationId: releaseOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Liberar um período OOO/OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/reactivate:
