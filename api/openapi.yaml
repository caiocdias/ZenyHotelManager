        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCodeUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCodeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um código de lançamento
      tags:
      - billing
  /api/v1/transaction-codes/{id}/deactivate:
    post:
      description: Exige `billing.codes.manage`. Os lançamentos feitos ficam; um lançamento
