  /api/v1/users/{id}/deactivate:
    post:
      description: "Exige `iam.users.manage`. O usuário não entra mais, perde as permissõ\
        es já na requisição seguinte e todas as sessões dele são revogadas (o pró\
        ximo refresh falha; o access token vence em até 15 min). Nada é apagado. O\
        \ último administrador ativo não é desativado (409 `LAST_ADMINISTRATOR`)."
      operationId: deactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
