    PostingRequest:
      type: object
      description: "Um lançamento manual: valor = quantidade × valor unitário, arredondado\
        \ pela regra de `Money`."
      properties:
        description:
          type: string
          description: "Descrição (até 200); vazia: o nome do código."
          maxLength: 200
          minLength: 0
          nullable: true
        quantity:
          type: number
          description: "Quantidade positiva, até 3 casas (padrão 1)."
          example: 2
        transactionCodeId:
          type: string
          format: uuid
          nullable: true
        unitPrice:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
      required:
      - quantity
      - transactionCodeId
      - unitPrice
    PostingResponse:
      type: object
      description: Um lançamento (imutável).
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        approvalId:
          type: string
          format: uuid
          description: "A aprovação de superior que autorizou a correção, se houve."
          nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        businessDate:
          type: string
          format: date
          description: Data operacional do hotel no lançamento (RN-01).
        correctsId:
          type: string
          format: uuid
          description: O lançamento corrigido (só no estorno e no ajuste).
          nullable: true
        description:
          type: string
        folioId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        postedAt:
          type: string
          format: date-time
        postedBy:
          type: string
          format: uuid
          description: "Quem lançou; nulo: o sistema."
          nullable: true
        quantity:
          type: number
        reason:
          type: string
          description: Motivo da correção (só no estorno e no ajuste).
          nullable: true
        remainingAmount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        reversedBy:
          type: string
          format: uuid
          description: "O estorno deste lançamento, se houve (só no normal)."
          nullable: true
        routedFromFolioId:
          type: string
          format: uuid
          description: "Roteado: a conta em que o lançamento foi pedido (esta é a\
            \ conta de destino)."
          nullable: true
        routingRuleId:
          type: string
          format: uuid
          description: "Roteado: a regra da conta de origem que desviou o lançamento."
          nullable: true
        serviceChargeForPostingId:
          type: string
          format: uuid
          description: "Taxa de serviço (`SERVICE_CHARGE`, ou a entrada da taxa de\
            \ um item transferido): o item nesta conta."
          nullable: true
        serviceChargePostingId:
          type: string
          format: uuid
          description: "Item com taxa de serviço: a taxa dele nesta conta."
          nullable: true
        serviceChargeRate:
          type: string
          format: decimal
          description: "Percentual em pontos (12.5 = 12,5%), até 4 casas."
          example: "12.5"
          nullable: true
          pattern: "^-?\\d{1,3}(\\.\\d{1,4})?$"
        source:
          type: string
          enum:
          - MANUAL
          - POS
          - END_OF_DAY
          - LAUNDRY
          - EVENT
        transactionCodeId:
          type: string
          format: uuid
        transferredFromFolioId:
          type: string
          format: uuid
          description: "Entrada de transferência: a conta de origem."
          nullable: true
        transferredFromPostingId:
          type: string
          format: uuid
          description: "Entrada de transferência: a saída correspondente."
          nullable: true
        transferredToFolioId:
          type: string
          format: uuid
          description: "Saída de transferência: a conta de destino."
          nullable: true
        transferredToPostingId:
          type: string
          format: uuid
          description: "Saída de transferência: a entrada correspondente."
          nullable: true
        triggeredByPostingId:
          type: string
          format: uuid
          description: "Correção ou saída da taxa de serviço feita junto da do item:\
            \ o lançamento do item que a provocou (nula na remoção a pedido do cliente)."
          nullable: true
        type:
          type: string
          description: "Tipo do lançamento: `REGULAR`, `REVERSAL` (estorno), `ADJUSTMENT`\
            \ (ajuste), `TRANSFER_OUT` (saída de uma transferência ou divisão), `TRANSFER_IN`\
            \ (entrada) ou `SERVICE_CHARGE` (taxa de serviço lançada junto de um item).\
            \ A lista pode crescer (`x-extensible-enum`): trate um valor desconhecido\
            \ sem falhar."
          x-extensible-enum:
          - REGULAR
          - REVERSAL
          - ADJUSTMENT
          - TRANSFER_OUT
          - TRANSFER_IN
          - SERVICE_CHARGE
        unitPrice:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
      required:
      - amount
      - businessDate
      - description
      - folioId
      - id
      - postedAt
      - quantity
      - source
      - transactionCodeId
      - type
      - unitPrice
    Problem:
      type: object
      description: Problema RFC 9457 (application/problem+json).
      properties:
        action:
          type: string
          description: "Em `APPROVAL_REQUIRED`: a operação sensível pedida."
          example: iam.user.deactivate
        code:
          type: string
          description: "Código estável do erro, para o cliente traduzir. Comuns: VALIDATION_FAILED,\
            \ MALFORMED_REQUEST, INVALID_CURSOR, UNAUTHENTICATED, ACCESS_DENIED, PASSWORD_CHANGE_REQUIRED,\
            \ APPROVAL_REQUIRED, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, CONFLICT,\
            \ PRECONDITION_FAILED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, BUSINESS_RULE_VIOLATED,\
            \ PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID,\
            \ IDEMPOTENCY_KEY_IN_USE, IDEMPOTENCY_KEY_REUSED, REQUEST_REJECTED, INTERNAL_ERROR,\
            \ SERVICE_UNAVAILABLE. Cada módulo acrescenta os seus."
          example: VALIDATION_FAILED
          pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
        detail:
          type: string
          description: "Explicação em pt-BR, para o usuário."
        errors:
          type: array
          description: Erros por campo; presente nos erros de validação.
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: Caminho da requisição.
        limit:
          type: object
          description: "Em `APPROVAL_REQUIRED` de uma ação acima do limite: a chave\
            \ do limite e o valor pedido (texto decimal), que o aprovador precisa\
            \ cobrir."
          properties:
            amount:
              type: string
              format: decimal
              example: "15"
            key:
              type: string
              example: maxPercent
          required:
          - amount
          - key
        permission:
          type: string
          description: "Em `APPROVAL_REQUIRED`: a permissão que o aprovador precisa\
            \ ter."
          example: iam.users.manage
        resourceRef:
          type: string
          description: "Em `APPROVAL_REQUIRED`: o registro sobre o qual a operaçã\
            o age."
          example: iam.user:0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
        status:
          type: integer
          format: int32
          description: Status HTTP.
          example: 400
        title:
          type: string
          description: "Frase do status HTTP, em pt-BR."
          example: Requisição inválida
        type:
          type: string
          format: uri
          description: Tipo do problema; ausente equivale a about:blank.
          example: about:blank
      required:
      - code
      - status
      - title
