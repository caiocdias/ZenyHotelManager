    CapturePreAuthorizationRequest:
      type: object
      description: "A captura de uma caução (total ou parcial): gera um recebimento\
        \ no cartão de crédito, com a bandeira e os últimos dígitos da caução."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        authorizationCode:
          type: string
          description: "Autorização da captura. Até 20 letras e dígitos (guardado\
            \ em maiúsculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dí\
            gitos tem cara de número de cartão e é recusada (400 `PRE_AUTHORIZATION_INVALID`)."
          maxLength: 20
          nullable: true
        nsu:
          type: string
          description: "NSU da captura. Até 20 letras e dígitos (guardado em maiú\
            sculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dígitos tem\
            \ cara de número de cartão e é recusada (400 `PRE_AUTHORIZATION_INVALID`)."
          maxLength: 20
          nullable: true
      required:
      - amount
    CardPreAuthorizationResponse:
      type: object
      description: "Uma caução na conta, com a situação calculada no instante da leitura."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        authorizationCode:
          type: string
        businessDate:
          type: string
          format: date
          description: Data operacional do registro (RN-01).
        capturableAmount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        capturePaymentIds:
          type: array
          description: "Os recebimentos gerados pelas capturas, em ordem de registro."
          items:
            type: string
            format: uuid
            description: "Os recebimentos gerados pelas capturas, em ordem de registro."
        capturedAmount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        cardBrand:
          type: string
          nullable: true
        cardLast4:
          type: string
          description: Os 4 últimos dígitos do cartão (nunca o número completo).
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: Validade da autorização.
        folioId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        nsu:
          type: string
          nullable: true
        registeredAt:
          type: string
          format: date-time
        registeredBy:
          type: string
          format: uuid
          description: Quem registrou.
        releasedAmount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releasedBy:
          type: string
          format: uuid
          description: Quem registrou a liberação.
          nullable: true
        status:
          type: string
          description: "`ACTIVE` (nada capturado), `PARTIALLY_CAPTURED` (o restante\
            \ continua capturável), `CAPTURED` (capturada por inteiro), `RELEASED`\
            \ (sobra liberada) ou `EXPIRED` (venceu sem ser capturada por inteiro\
            \ nem liberada; calculada na leitura). A lista pode crescer (`x-extensible-enum`):\
            \ trate um valor desconhecido sem falhar."
          x-extensible-enum:
          - ACTIVE
          - PARTIALLY_CAPTURED
          - CAPTURED
          - RELEASED
          - EXPIRED
      required:
      - amount
      - authorizationCode
      - businessDate
