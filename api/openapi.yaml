      description: "Exige `hotel.settings.manage` e o `If-Match`. CNPJ com dígito\
        \ verificador errado: 400 `VALIDATION_FAILED` (campo `cnpj`, `INVALID_FORMAT`).\
        \ Código IBGE de outra UF: 400 `INVALID_ADDRESS`. Fuso desconhecido ou de\
        \ deslocamento fixo: 400 `INVALID_TIMEZONE`. O logotipo é o id de um anexo\
        \ enviado antes em `POST /files` com a finalidade `hotel.logo`; inexistente\
        \ ou de outra finalidade: 422 `LOGO_FILE_INVALID`. Mudar o fuso não muda a\
        \ data operacional."
      operationId: updateHotel
      parameters:
