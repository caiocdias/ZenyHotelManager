    DuplicateCandidateResponse:
      type: object
      description: Dois perfis ativos que parecem o mesmo hóspede (candidatos a duplicado).
      properties:
        documentTypes:
          type: array
          description: Os tipos dos documentos iguais (vazio se só o e-mail é igual).
          items:
            type: string
            description: Os tipos dos documentos iguais (vazio se só o e-mail é igual).
            enum:
            - CPF
            - RG
            - CNH
            - PASSPORT
            - RNM
            - FOREIGN_ID
        first:
          $ref: "#/components/schemas/GuestResponse"
        reasons:
          type: array
          description: "O que os dois têm em comum: um documento igual (`DOCUMENT`)\
            \ e/ou o e-mail (`EMAIL`)."
