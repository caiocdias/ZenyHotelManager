              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Remover a taxa de serviço a pedido do cliente
      tags:
      - billing
  /api/v1/folios/{id}/postings/{postingId}/reverse:
    post:
      description: "Cria o lançamento inverso de tudo o que ainda resta do original\
        \ (ele menos os ajustes), vinculado e com motivo; um estorno por lançamento.\
        \ Os ajustes já zerando o original: 422 `POSTING_NOTHING_TO_REVERSE`. Exige\
        \ `billing.postings.reverse`. Exige antes `billing.folios.read` (sem ela,\
        \ 403 `PERMISSION_DENIED`, antes de ler a conta). Ação **sensível** com o\
        \ limite `maxAmount` sobre o total das correções do lançamento (as já feitas\
        \ mais esta, em valor absoluto): sem a permissão, ou acima do limite, 403\
        \ `APPROVAL_REQUIRED` (com `action`, `permission`, `resourceRef` e `limit`);\
        \ repita com o `X-Approval-Token` de `POST /api/v1/auth/approvals` e **outra**\
        \ `Idempotency-Key`. Só um lançamento normal é corrigido (422 `POSTING_NOT_CORRECTABLE`);\
        \ lançamento já estornado: 409 `POSTING_ALREADY_REVERSED`; conta encerrada:\
        \ 409 `FOLIO_CLOSED`. Essas regras são conferidas antes da aprovação de superior.\
        \ Taxa de serviço (M3 E06): a taxa vinculada ao item acompanha a correção\
        \ (o estorno a estorna; o ajuste a ajusta na proporção do percentual guardado),\
        \ com o mesmo motivo e `triggeredByPostingId`, e o limite confere o item com\
        \ a taxa (inclusive o que já saiu dela); a própria taxa não se corrige aqui\
