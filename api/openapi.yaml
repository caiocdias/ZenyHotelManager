  /api/v1/room-type-inventory:
    get:
      description: "Um período de até 366 dias, inclusive o passado (fim antes do\
        \ início: 400 `INVENTORY_PERIOD_INVALID`; mais: 400 `INVENTORY_PERIOD_TOO_LONG`);\
        \ tipo de UH inexistente: 400 `UNKNOWN_ROOM_TYPE`. Disponível = `total` (UHs\
        \ ativas do tipo) − `sold` (reservas) − `blocked` (bloqueios de grupo) − `outOfOrder`\
        \ (UHs em OOO; o OOS não conta) + `overbookingLimit` (nasce zero: overbooking\
        \ proibido, Q-09); pode ser negativo (data sobrevendida). O inventário é mantido\
        \ da data operacional até 730 dias à frente. Exige `reservations.availability.read`."
      operationId: listRoomTypeInventory
      parameters:
      - in: query
        name: roomTypeId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o inventário de um tipo de UH num período
      tags:
      - reservations
  /api/v1/room-type-inventory/overbooking-limit:
    post:
      description: "Grava o mesmo `limit` (de 0 a 50; fora: 400 `OVERBOOKING_LIMIT_INVALID`)\
        \ nos tipos de UH pedidos (de 1 a 50, sem repetir; senão 400 `OVERBOOKING_LIMIT_INVALID`;\
        \ inexistente 400 `UNKNOWN_ROOM_TYPE`) × as datas do período nos `weekdays`.\
        \ Fim antes do início ou nenhuma data nos dias da semana: 400 `INVENTORY_PERIOD_INVALID`;\
        \ mais de 366 dias: 400 `INVENTORY_PERIOD_TOO_LONG`; começo antes da data\
        \ operacional: 422 `INVENTORY_PERIOD_IN_PAST`; data fora do inventário mantido:\
        \ 422 `INVENTORY_DATE_OUT_OF_HORIZON` (datas em `dates`). Baixar o limite\
        \ não desfaz vendas. Exige `reservations.inventory.manage`; publica `AvailabilityChanged`\
        \ por tipo que mudou."
      operationId: setRoomTypeOverbookingLimit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverbookingLimitRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverbookingLimitResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir o limite de overbooking por tipo de UH e data
      tags:
      - reservations
  /api/v1/room-type-inventory/recount:
    post:
      description: "Refaz os contadores de todos os tipos de UH ativos (e dos que\
        \ já têm inventário) no período: o total e o OOO pelas UHs e períodos OOO\
        \ do cadastro, e as vendidas e bloqueadas pelas reservas e bloqueios; cria\
        \ as datas que faltam no horizonte. Repara uma divergência (uma atualizaçã\
        o perdida). Fim antes do início: 400 `INVENTORY_PERIOD_INVALID`. Exige `reservations.inventory.manage`;\
        \ publica `AvailabilityChanged` por tipo que mudou."
      operationId: recountRoomTypeInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRecountRequest"
        required: true
      responses:
        "200":
