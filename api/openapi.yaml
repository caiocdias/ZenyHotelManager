              $ref: "#/components/schemas/ReversalRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingResponse"
          description: Estornado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Estornar um lançamento
      tags:
      - billing
  /api/v1/folios/{id}/postings/{postingId}/split:
    post:
      description: "Reparte o que ainda resta do lançamento entre 2 e 10 contas (esta\
        \ mesma = a parte que fica), por percentual (`PERCENT`, somando exatamente\
        \ 100, repartido sem perder centavos) ou por valor (`AMOUNT`, somando exatamente\
        \ o que resta, senão 422 `SPLIT_TOTAL_MISMATCH`); cada parte movida é um par\
        \ saída/entrada como na transferência. Partes fora do formato: 400 `SPLIT_INVALID`;\
        \ conta de uma parte inexistente: 400 `UNKNOWN_FOLIO`. Exige `billing.postings.transfer`.\
        \ Só um lançamento normal ou a entrada de uma transferência é transferido\
        \ (422 `POSTING_NOT_TRANSFERABLE`); já estornado: 409 `POSTING_ALREADY_REVERSED`;\
        \ nada restando: 422 `POSTING_NOTHING_TO_TRANSFER`; conta encerrada: 409 `FOLIO_CLOSED`;\
        \ conta de destino inexistente: 400 `UNKNOWN_FOLIO`. A taxa de serviço do\
        \ item vai junto, na mesma proporção (`serviceChargeOutgoing`/`serviceChargeIncoming`);\
        \ ela não se move à parte (422 `SERVICE_CHARGE_FOLLOWS_ITEM`)."
      operationId: splitPosting
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: postingId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
