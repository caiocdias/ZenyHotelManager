    put:
      description: "Troca código, nome, taxa de serviço e classificação fiscal (o\
        \ tipo e o grupo de receita são fixos). Exige `billing.codes.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Código curto repetido (inclusive\
        \ de um desativado): 409 `TRANSACTION_CODE_ALREADY_IN_USE`; taxa de serviç\
        o fora de um código `CHARGE`, taxa própria sem a taxa aplicável ou fora de\
        \ 0 a 100: 400 `TRANSACTION_CODE_INVALID`; texto ou código fora do formato:\
        \ 400 `BILLING_DATA_INVALID`."
      operationId: updateTransactionCode
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
