      description: "As cauções ainda não encerradas (nem capturadas por inteiro nem\
        \ liberadas) cuja validade cai no período, em datas no fuso do hotel, inclusive;\
        \ em ordem de validade. As que já venceram no período vêm com `EXPIRED`. Exige\
        \ `billing.folios.read`. Fim antes do início: 400 `PRE_AUTHORIZATION_INVALID`\
        \ (campo `to`)."
