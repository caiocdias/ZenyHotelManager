                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar um usuário
      tags:
      - iam
  /api/v1/users/{id}/reset-password:
    post:
      description: "Define uma senha provisória (12 a 128 caracteres), que o usuá\
        rio troca no próximo login; zera o bloqueio por tentativas e revoga todas\
        \ as sessões dele. Exige `iam.users.manage` e cobrir as permissões do usuá\
        rio (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`)."
      operationId: resetUserPassword
      parameters:
      - in: path
        name: id
        required: true
