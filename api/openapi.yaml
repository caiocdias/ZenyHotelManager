openapi: 3.0.1
info:
  description: "API do servidor do Zeny Hotel Manager. Erros em RFC 9457 (application/problem+json)\
    \ com `code` estável; paginação por cursor (`cursor`/`limit`); concorrência otimista\
    \ com `ETag`/`If-Match`; `Idempotency-Key` obrigatório nas operações com efeito\
    \ financeiro ou externo (resposta guardada por 24h); instantes em UTC (ISO-8601\
    \ com `Z`), datas `YYYY-MM-DD` e dinheiro como string decimal em BRL. Autenticaç\
    ão: `POST /api/v1/auth/login` devolve um access token JWT de 15 min, enviado como\
    \ `Authorization: Bearer …`, e um refresh token rotativo da sessão do dispositivo,\
    \ trocado em `POST /api/v1/auth/refresh`. Um `401` com `code` `UNAUTHENTICATED`\
    \ pede um refresh; os demais códigos de `401` (credenciais, bloqueio, refresh)\
    \ pedem um novo login. Ação sensível sem permissão (ou acima do limite): 403 `APPROVAL_REQUIRED`;\
    \ outro usuário aprova em `POST /api/v1/auth/approvals` e a requisição é repetida\
    \ com `X-Approval-Token`."
  title: Zeny Hotel Manager API
  version: v1
servers:
- description: Este servidor
  url: /
security:
- bearerAuth: []
tags:
- description: "Anexos: upload por finalidade e download por URL assinada."
  name: files
- description: "Autenticação, sessões por dispositivo e usuários."
  name: iam
- description: "Tipos de UH, características, UHs e áreas comuns."
  name: rooms
- description: Configuração do hotel e data operacional.
  name: hotel
- description: Informações sobre o servidor e a API.
  name: meta
- description: Trilha de auditoria das escritas.
  name: audit
- description: "Setores, colaboradores, turnos e escala."
  name: staff
paths:
  /api/v1/areas:
    get:
      description: "Em ordem de nome, opcionalmente de um tipo e só ativas ou inativas.\
        \ Exige `rooms.registry.read`."
      operationId: listAreas
      parameters:
      - description: Só as áreas deste tipo.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
      - description: Só os ativos (`true`) ou só os inativos (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageAreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar áreas comuns
      tags:
      - rooms
    post:
      description: "Exige `rooms.registry.manage`. Nome já usado, sem diferenciar\
        \ maiúsculas: 409 `AREA_NAME_ALREADY_IN_USE`."
      operationId: createArea
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: Área cadastrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}:
    get:
      description: "Exige `rooms.registry.read`. Inexistente: 404 `AREA_NOT_FOUND`."
      operationId: getArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma área comum
      tags:
      - rooms
    put:
      description: "Troca nome, tipo e descrição. Exige `rooms.registry.manage` e\
        \ o `If-Match` (ausente: 428; versão diferente: 412). Nome já usado: 409 `AREA_NAME_ALREADY_IN_USE`."
      operationId: updateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}/deactivate:
    post:
      description: Exige `rooms.registry.manage`. Nada é apagado. Desativar de novo
        não muda nada.
      operationId: deactivateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}/reactivate:
    post:
      description: Exige `rooms.registry.manage`.
      operationId: reactivateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma área comum
      tags:
      - rooms
  /api/v1/audit-entries:
    get:
      description: "Entradas da trilha, das mais recentes para as mais antigas, filtradas\
        \ por quem agiu (`userId`), pela entidade (`entityType` e, opcionalmente,\
        \ `entityId`) e pelo período (`from` inclusive, `to` exclusive, instantes\
        \ em UTC). Cada entrada traz quem, quando e de qual sessão de dispositivo,\
        \ a ação e o resultado, a entidade, os valores antes e depois (com senha,\
        \ PIN, tokens e campos cifrados mascarados como `***`) e a aprovação associada.\
        \ Exige `audit.read` (sem ela, 403 `PERMISSION_DENIED`)."
      operationId: listAuditEntries
      parameters:
      - description: Só as entradas deste usuário (quem agiu).
        in: query
        name: userId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Tipo da entidade, como `iam.user` ou `iam.role`."
        in: query
        name: entityType
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: Id da entidade; exige `entityType`.
        in: query
        name: entityId
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - description: "Início do período (inclusive), em UTC."
        example: 2026-10-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Fim do período (exclusive), em UTC."
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageAuditEntryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar a trilha de auditoria
      tags:
      - audit
  /api/v1/auth/approvals:
    post:
      description: "Recebe a operação recusada com 403 `APPROVAL_REQUIRED` (`action`,\
        \ `permission`, `resourceRef` e, se houver, `limit`, copiados do problema),\
        \ o login e o PIN de outro usuário e o motivo. Devolve o token de aprovaçã\
        o: vale **uma vez**, por **2 min**, só para a mesma operação, pedida pelo\
        \ mesmo usuário na mesma sessão, no cabeçalho `X-Approval-Token` da requisiç\
        ão repetida. O aprovador precisa estar ativo e ter a permissão com limite\
        \ para o valor pedido (403 `APPROVER_NOT_ALLOWED`) e não pode ser o próprio\
        \ solicitante (403 `APPROVER_IS_REQUESTER`). Login inexistente, aprovador\
        \ sem PIN ou PIN errado: 403 `APPROVAL_CREDENTIALS_INVALID`; a partir da 3ª\
        \ falha seguida, as aprovações do aprovador ficam bloqueadas por tempo crescente\
        \ (403 `APPROVER_LOCKED`, mesmo com o PIN certo), sem bloquear o login dele.\
        \ Permissão que não aceita aprovação: 422 `APPROVAL_NOT_APPLICABLE`. A aprovaç\
        ão e as recusas ficam na trilha de auditoria."
      operationId: grantApproval
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
          description: Aprovação concedida.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Aprovar uma ação sensível (step-up)
      tags:
      - iam
  /api/v1/auth/login:
    post:
      description: "Público. Abre uma sessão no dispositivo (um novo login no mesmo\
        \ dispositivo encerra a sessão anterior dele) e devolve um access token JWT\
        \ de 15 min e um refresh token. O login não diferencia maiúsculas. Recusas\
        \ com 401: `INVALID_CREDENTIALS` (login ou senha), `ACCOUNT_LOCKED` (falhas\
        \ seguidas; o bloqueio cresce a cada nova falha e vale mesmo com a senha certa)\
        \ e `ACCOUNT_DISABLED`. Com `passwordChangeRequired`, só a troca de senha\
        \ e o logout respondem até a senha ser trocada."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Sessão aberta.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Entrar com login e senha
      tags:
      - iam
  /api/v1/auth/logout:
    post:
      description: "Encerra a sessão do access token: o refresh token dela deixa de\
        \ valer. O access token vence sozinho em até 15 min."
      operationId: logout
      responses:
        "204":
          description: Sessão encerrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Sair
      tags:
      - iam
  /api/v1/auth/me:
    get:
      description: "Quem está logado, as roles ativas e as permissões efetivas agora:\
        \ a união das roles ativas, com o escopo mais amplo e, por chave, o maior\
        \ limite. As permissões não vão no access token: uma mudança de role vale\
        \ já na requisição seguinte. Não exige permissão."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: O usuário corrente e as permissões efetivas
      tags:
      - iam
  /api/v1/auth/password:
    post:
      description: "Confere a senha atual (401 `INVALID_CREDENTIALS` ou `ACCOUNT_LOCKED`,\
        \ contando para o bloqueio como o login) e grava a nova, de 12 a 128 caracteres\
        \ e diferente da atual (422 `PASSWORD_UNCHANGED`). Encerra a troca obrigató\
        ria e as outras sessões do usuário; a sessão corrente continua, e o próximo\
        \ refresh traz um access token sem a pendência."
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Senha trocada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Trocar a própria senha
      tags:
      - iam
  /api/v1/auth/refresh:
    post:
      description: "Público (o cabeçalho Authorization é ignorado). Troca o refresh\
        \ token por um par novo: o refresh token usado deixa de valer, e a validade\
        \ da sessão volta a 30 dias. Recusas com 401: `REFRESH_TOKEN_INVALID` (desconhecido,\
        \ vencido, sessão revogada ou usuário desativado) e `REFRESH_TOKEN_REUSED`\
        \ (o token já tinha sido trocado: a sessão inteira é revogada, inclusive o\
        \ refresh token mais novo). Nos dois casos, o cliente pede um novo login."
      operationId: refreshTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Renovar os tokens da sessão
      tags:
      - iam
  /api/v1/auth/sessions:
    get:
      description: "Sessões não revogadas e não vencidas do usuário, da mais nova\
        \ para a mais antiga."
      operationId: listMySessions
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as próprias sessões ativas
      tags:
      - iam
  /api/v1/auth/sessions/{id}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Sessão de outro usuário ou\
        \ inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeMySession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão própria
      tags:
      - iam
  /api/v1/departments:
    get:
      description: Em ordem de criação (os seis pré-carregados primeiro). Exige `staff.employees.read`.
      operationId: listDepartments
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageDepartmentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar setores
      tags:
      - staff
    post:
      description: "Exige `staff.employees.manage`. Nome já usado, sem diferenciar\
        \ maiúsculas: 409 `DEPARTMENT_NAME_ALREADY_IN_USE`."
      operationId: createDepartment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"
          description: Setor criado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um setor
      tags:
      - staff
  /api/v1/departments/{id}:
    get:
      description: "Exige `staff.employees.read`. Inexistente: 404 `DEPARTMENT_NOT_FOUND`."
      operationId: getDepartment
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um setor
      tags:
      - staff
    put:
      description: "Exige `staff.employees.manage` e o `If-Match` (ausente: 428; versã\
        o diferente: 412). A chave dos setores pré-carregados não muda. Nome já usado:\
        \ 409 `DEPARTMENT_NAME_ALREADY_IN_USE`."
      operationId: updateDepartment
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Renomear um setor
      tags:
      - staff
  /api/v1/employees:
    get:
      description: "Em ordem de nome, opcionalmente de um setor e só ativos ou inativos.\
        \ Exige `staff.employees.read`."
      operationId: listEmployees
      parameters:
      - description: Só os colaboradores deste setor.
        in: query
        name: departmentId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só os ativos (`true`) ou só os inativos (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageEmployeeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar colaboradores
      tags:
      - staff
    post:
      description: "Exige `staff.employees.manage`. Setor inexistente: 400 `UNKNOWN_DEPARTMENT`.\
        \ O usuário vinculado (opcional) precisa existir (400 `UNKNOWN_USER`), estar\
        \ ativo (422 `USER_INACTIVE`) e não estar vinculado a outro colaborador (409\
        \ `USER_ALREADY_LINKED`)."
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
          description: Colaborador cadastrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar um colaborador
      tags:
      - staff
  /api/v1/employees/{id}:
    get:
      description: "Exige `staff.employees.read`. Inexistente: 404 `EMPLOYEE_NOT_FOUND`."
      operationId: getEmployee
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um colaborador
      tags:
      - staff
    put:
      description: "Troca os dados e o usuário vinculado (nulo: sem vínculo). Exige\
        \ `staff.employees.manage` e o `If-Match` (ausente: 428; versão diferente:\
        \ 412). Um usuário novo no vínculo segue as regras do cadastro (`UNKNOWN_USER`,\
        \ `USER_INACTIVE`, `USER_ALREADY_LINKED`)."
      operationId: updateEmployee
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um colaborador
      tags:
      - staff
  /api/v1/employees/{id}/deactivate:
