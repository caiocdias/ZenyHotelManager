          type: string
          format: uuid
        end:
          type: string
          format: time-local
          description: "Fim, no fuso do hotel; antes do início, termina no dia seguinte."
          example: 19:00:00
        name:
          type: string
          maxLength: 60
          minLength: 0
        start:
          type: string
          format: time-local
          description: "Início, no fuso do hotel."
          example: 07:00:00
