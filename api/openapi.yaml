                $ref: "#/components/schemas/RoutingRuleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma regra de roteamento
      tags:
      - billing
