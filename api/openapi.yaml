    get:
      description: "Em ordem de criação, opcionalmente de um colaborador. Exige `staff.schedule.read`;\
        \ com escopo `OWN`, só os do colaborador vinculado ao usuário."
      operationId: listSchedulePatterns
      parameters:
      - description: Só os padrões deste colaborador.
        in: query
        name: employeeId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
