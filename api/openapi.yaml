    ConsentListResponse:
      type: object
      description: "Os consentimentos de um perfil, do mais recente ao mais antigo."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsentResponse"
      required:
      - items
    ConsentRequest:
      type: object
      description: "Um consentimento do titular: a finalidade e o meio pelo qual ele\
        \ o deu."
      properties:
        purpose:
          type: string
          enum:
          - MARKETING
          - DIETARY_RESTRICTIONS
          nullable: true
        source:
          type: string
          description: Por qual meio o titular deu o consentimento (a origem).
          enum:
          - IN_PERSON
          - PAPER_FORM
          - PHONE
          - EMAIL
          - WEBSITE
          nullable: true
      required:
      - purpose
      - source
    ConsentResponse:
      type: object
      description: "Um consentimento do titular (RF-HOS-07): quando e por qual meio\
        \ foi dado e, se for o caso, revogado. Nunca é apagado (prova): um consentimento\
        \ novo da mesma finalidade é outro registro."
      properties:
        active:
          type: boolean
          description: Se ainda vale (não foi revogado nem substituído numa mesclagem).
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          format: uuid
          description: "Quem registrou o consentimento (nulo: o sistema)."
          nullable: true
        grantedSource:
          type: string
          enum:
          - IN_PERSON
          - PAPER_FORM
          - PHONE
          - EMAIL
          - WEBSITE
        guestId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - MARKETING
          - DIETARY_RESTRICTIONS
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: string
          format: uuid
          nullable: true
        revokedSource:
          type: string
          enum:
          - IN_PERSON
          - PAPER_FORM
          - PHONE
          - EMAIL
          - WEBSITE
          nullable: true
        supersededAt:
          type: string
          format: date-time
          description: "Quando deixou de valer numa mesclagem de duplicados, por haver\
            \ no perfil sobrevivente um consentimento ativo da mesma finalidade (`supersededBy`),\
            \ que prevalece; não é uma revogação do titular."
          nullable: true
        supersededBy:
          type: string
          format: uuid
          nullable: true
      required:
      - active
      - grantedAt
      - grantedSource
      - guestId
      - id
      - purpose
    CreateChecklistTemplateRequest:
      type: object
      description: "Um modelo de checklist novo: nome, contexto (fixo depois de criado)\
        \ e o rascunho."
      properties:
        applicability:
          type: array
          description: "Regras de aplicabilidade (RF-CHK-04); vale qualquer uma. Vazio:\
            \ o modelo geral do contexto."
          items:
            $ref: "#/components/schemas/ApplicabilityRuleDto"
          maxItems: 20
          minItems: 0
        context:
          type: string
          enum:
          - HOUSEKEEPING
          - INSPECTION
          - MAINTENANCE
          - COMMON_AREA
          - RESTAURANT
          - EVENT
          - OTHER
        name:
          type: string
          description: Até 120 caracteres.
          example: Limpeza de saída
        sections:
          type: array
          description: "As seções, na ordem de exibição (de 1 a 30)."
          items:
            $ref: "#/components/schemas/ChecklistSectionDto"
          maxItems: 30
          minItems: 0
      required:
      - applicability
      - context
      - name
      - sections
    CreateGuestRequest:
      type: object
      description: "Um perfil novo: os dados, os documentos e, opcionalmente, os dados\
        \ sensíveis da FNRH."
      properties:
        consents:
          type: array
          description: "Consentimentos dados no cadastro (um por finalidade), registrados\
            \ antes dos dados: o de `DIETARY_RESTRICTIONS` permite gravar as restriç\
            ões alimentares no mesmo pedido. Opcional."
          items:
            $ref: "#/components/schemas/ConsentRequest"
          maxItems: 10
          minItems: 0
        documents:
          type: array
          description: Documentos de identidade (até 6; um de cada tipo e país).
          items:
            $ref: "#/components/schemas/GuestDocumentRequest"
          maxItems: 6
          minItems: 0
        profile:
          allOf:
          - $ref: "#/components/schemas/GuestProfileRequest"
          nullable: true
        sensitiveData:
          allOf:
          - $ref: "#/components/schemas/GuestSensitiveDataRequest"
          nullable: true
      required:
      - documents
      - profile
    CreateSchedulePatternRequest:
      type: object
      description: "Um padrão de escala novo, para um colaborador."
      properties:
        employeeId:
          type: string
          format: uuid
        endsOn:
          type: string
          format: date
          nullable: true
        kind:
          type: string
          enum:
          - TWELVE_THIRTY_SIX
          - SIX_ON_ONE_OFF
          - FIXED
        shiftId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        weekdays:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          maxItems: 7
          minItems: 0
          uniqueItems: true
      required:
      - employeeId
      - kind
      - shiftId
      - startsOn
      - weekdays
    CreateShiftRequest:
      type: object
      description: Um turno novo.
      properties:
        departmentId:
          type: string
          format: uuid
        end:
          type: string
          format: time-local
          description: "Fim, no fuso do hotel; antes do início, termina no dia seguinte."
          example: 19:00:00
        name:
          type: string
          maxLength: 60
          minLength: 0
        start:
          type: string
          format: time-local
          description: "Início, no fuso do hotel."
          example: 07:00:00
      required:
      - departmentId
      - end
      - name
      - start
    CreateUserRequest:
      type: object
      properties:
        login:
          type: string
          description: "Login ou e-mail: 3 a 100 caracteres (letras, dígitos e . _\
            \ @ + -); não diferencia maiúsculas."
          example: maria.silva
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          description: "Senha provisória, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
        pin:
          type: string
          format: password
          description: "PIN de aprovação, de 4 a 8 dígitos (opcional)."
          nullable: true
          pattern: "\\d{4,8}"
        roleIds:
          type: array
          description: Roles do usuário (opcional).
          items:
            type: string
            format: uuid
            description: Roles do usuário (opcional).
          maxItems: 50
          minItems: 0
      required:
      - login
      - name
      - password
      - roleIds
