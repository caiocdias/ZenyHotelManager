  /api/v1/files:
    post:
      description: "Multipart com `purpose` (a finalidade, como `hotel.logo`) e `file`.\
        \ Exige a permissão de upload da finalidade (403 `PERMISSION_DENIED`). O tipo\
        \ é detectado pelo conteúdo, não pelo `Content-Type` nem pela extensão. Recusas\
        \ (400, com o campo em `errors[]`): `UNKNOWN_FILE_PURPOSE`, `FILE_EMPTY`,\
        \ `FILE_TOO_LARGE` (acima do máximo da finalidade), `FILE_TYPE_NOT_ACCEPTED`\
        \ (conteúdo de tipo não aceito) e `FILE_EXTENSION_MISMATCH` (extensão diferente\
        \ do conteúdo); acima do máximo do servidor, 413 `PAYLOAD_TOO_LARGE`. Numa\
        \ finalidade com reencode, a imagem (JPEG ou PNG) é regravada no servidor\
        \ sem metadados (EXIF, GPS) e com o lado maior limitado; imagem ilegível é\
        \ `FILE_IMAGE_UNREADABLE` e acima do teto de pixels, `FILE_IMAGE_TOO_LARGE`.\
        \ Anexo sensível é cifrado antes de ir ao armazenamento. Não aceita `Idempotency-Key`;\
        \ para repetir o envio com segurança (app offline), mande `clientFileId`,\
        \ um UUIDv7 gerado pelo cliente, que vira o id do anexo: a repetição pelo\
        \ mesmo usuário, com a mesma finalidade e o mesmo arquivo devolve 200 com\
        \ o anexo existente, sem gravar de novo; o mesmo id com outro arquivo, outra\
        \ finalidade, de outro usuário ou de um anexo já apagado é 409 `CLIENT_FILE_ID_CONFLICT`;\
        \ fora do formato, 400 `CLIENT_FILE_ID_INVALID`. Sem `clientFileId`, repetir\
        \ cria outro anexo."
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientFileId:
                  type: string
                  description: "Opcional: id do anexo gerado pelo cliente (UUIDv7),\
                    \ para repetir o envio sem duplicar o anexo."
                file:
                  type: string
                  format: binary
                  description: O arquivo; o tipo é detectado pelo conteúdo.
                purpose:
                  type: string
                  description: "Finalidade do anexo (`<módulo>.<nome>`), como `hotel.logo`."
              required:
              - file
              - purpose
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: "Repetição com o mesmo `clientFileId`: o anexo já gravado."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: Anexo gravado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Enviar um anexo
      tags:
      - files
  /api/v1/files/{id}:
    get:
      description: "Exige a permissão de download da finalidade (com escopo `OWN`,\
        \ só de quem enviou). Inexistente ou apagado: 404 `FILE_NOT_FOUND`."
      operationId: getFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar os metadados de um anexo
      tags:
      - files
  /api/v1/files/{id}/content:
    get:
      description: "Público: quem autoriza é o `token` da URL gerada em `GET /files/{id}/download-url`,\
        \ válido até `expiresAt`. Devolve o conteúdo original, decifrado, e grava\
        \ o download na trilha em nome de quem gerou a URL. Token adulterado, de outro\
        \ anexo ou ilegível: 403 `DOWNLOAD_URL_INVALID`; vencido: 403 `DOWNLOAD_URL_EXPIRED`."
      operationId: downloadFileContent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Assinatura da URL de download.
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: "O conteúdo do anexo, com o tipo detectado no upload."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Baixar um anexo sensível
      tags:
      - files
  /api/v1/files/{id}/download-url:
    get:
      description: "URL assinada de curta duração (`zeny.files.download-url-ttl`,\
        \ padrão 5 min), sem precisar do access token. Exige a permissão de download\
        \ da finalidade (com escopo `OWN`, só de quem enviou). Anexo comum: URL direta\
        \ ao armazenamento. Anexo sensível: URL do próprio servidor, que decifra o\
        \ conteúdo; a emissão e cada download vão para a trilha de auditoria. Inexistente\
        \ ou apagado: 404 `FILE_NOT_FOUND`."
      operationId: getFileDownloadUrl
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Gerar a URL de download de um anexo
      tags:
      - files
  /api/v1/hotel:
    get:
      description: "Exige `hotel.settings.read`. Antes da configuração inicial, `configured`\
        \ é falso e só o fuso vem preenchido. O `ETag` vai no `If-Match` da ediçã\
        o."
