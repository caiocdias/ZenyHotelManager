        \ mudam depois. Código curto repetido (inclusive de um desativado): 409 `TRANSACTION_CODE_ALREADY_IN_USE`;\
        \ taxa de serviço fora de um código `CHARGE`, taxa própria sem a taxa aplicá\
        vel ou fora de 0 a 100: 400 `TRANSACTION_CODE_INVALID`; texto ou código fora\
        \ do formato: 400 `BILLING_DATA_INVALID`."
      operationId: createTransactionCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCodeCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCodeResponse"
          description: Código cadastrado.
        default:
