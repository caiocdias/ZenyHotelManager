      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: Padrão criado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um padrão de escala
      tags:
      - staff
  /api/v1/schedule-patterns/{id}:
    get:
      description: "Exige `staff.schedule.read`. Inexistente (ou de outro colaborador,\
        \ com escopo `OWN`): 404 `SCHEDULE_PATTERN_NOT_FOUND`."
      operationId: getSchedulePattern
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um padrão de escala
      tags:
      - staff
    put:
      description: "Troca tipo, turno, período e dias da semana (o colaborador nã\
        o muda), com as regras da criação. Exige `staff.schedule.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Padrão desativado: 422 `SCHEDULE_PATTERN_INACTIVE`.\
        \ As entradas já geradas só mudam na próxima geração."
      operationId: updateSchedulePattern
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePatternRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um padrão de escala
      tags:
      - staff
  /api/v1/schedule-patterns/{id}/deactivate:
    post:
      description: Exige `staff.schedule.manage`. O padrão deixa de gerar entradas;
        as que ele gerou saem na próxima geração do período. Desativar de novo não
        muda nada.
      operationId: deactivateSchedulePattern
      parameters:
      - in: path
        name: id
