    put:
      description: "Troca nome e horários (o setor não muda). Exige `staff.employees.manage`\
        \ e o `If-Match` (ausente: 428; versão diferente: 412). As entradas da escala\
        \ que usam o turno passam a mostrar os horários novos."
      operationId: updateShift
