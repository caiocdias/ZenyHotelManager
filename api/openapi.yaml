  /api/v1/schedule:
    get:
      description: "As entradas de `from` a `to` (no máximo 92 dias; sem `from`, a\
        \ data operacional; sem `to`, o próprio `from`), em ordem de data, opcionalmente\
        \ de um setor (o do turno, ou o do colaborador nas ausências) ou de um colaborador.\
        \ Exige `staff.schedule.read`; com escopo `OWN`, só as do colaborador vinculado\
        \ ao usuário. Período inválido: 400 `SCHEDULE_PERIOD_INVALID`."
      operationId: listScheduleEntries
      parameters:
      - description: "Primeira data (YYYY-MM-DD); padrão: a data operacional."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data, inclusive (YYYY-MM-DD); padrão: `from`."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - description: Só as entradas deste setor.
        in: query
        name: departmentId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as entradas deste colaborador.
        in: query
        name: employeeId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
