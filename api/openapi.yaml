  /api/v1/users/{id}/reactivate:
    post:
      description: "Exige `iam.users.manage` e cobrir as permissões do usuário (403\
        \ `GRANT_EXCEEDS_OWN_PERMISSIONS`). As sessões revogadas não voltam: o usuá\
        rio entra de novo."
      operationId: reactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar um usuário
      tags:
      - iam
  /api/v1/users/{id}/reset-password:
    post:
      description: "Define uma senha provisória (12 a 128 caracteres), que o usuá\
        rio troca no próximo login; zera o bloqueio por tentativas e revoga todas\
        \ as sessões dele. Exige `iam.users.manage` e cobrir as permissões do usuá\
        rio (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`)."
      operationId: resetUserPassword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Senha redefinida.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Redefinir a senha de um usuário
      tags:
      - iam
  /api/v1/users/{id}/reset-pin:
    post:
      description: "PIN de 4 a 8 dígitos, usado para aprovar ações sensíveis de outro\
        \ usuário. Exige `iam.users.manage` e cobrir as permissões do usuário (403\
        \ `GRANT_EXCEEDS_OWN_PERMISSIONS`)."
      operationId: resetUserPin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPinRequest"
        required: true
      responses:
        "204":
          description: PIN definido.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir o PIN de aprovação de um usuário
      tags:
      - iam
  /api/v1/users/{id}/roles:
    put:
      description: "Troca o conjunto inteiro de roles do usuário. Exige `iam.users.manage`\
        \ e o `If-Match`. Cada role acrescentada não pode conceder permissão, escopo\
        \ ou limite acima dos seus (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`); só um administrador\
        \ dá ou tira a role Administrador e gere administradores (403 `ADMINISTRATOR_REQUIRED`);\
        \ o último administrador ativo não perde a role (409 `LAST_ADMINISTRATOR`).\
        \ Role inexistente: 400 `UNKNOWN_ROLE`. Vale na requisição seguinte."
      operationId: setUserRoles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir as roles de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions:
    get:
      description: "Sessões não revogadas e não vencidas, da mais nova para a mais\
        \ antiga. Exige `iam.sessions.manage`; as de um administrador, só outro administrador\
        \ (403 `ADMINISTRATOR_REQUIRED`)."
      operationId: listUserSessions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as sessões ativas de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions/{sessionId}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Exige `iam.sessions.manage`.\
        \ Sessão de outro usuário ou inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeUserSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão de um usuário
      tags:
      - iam
components:
  headers:
    IdempotentReplayed:
      description: '`true` quando a resposta é a guardada de uma requisição anterior
        com a mesma `Idempotency-Key`.'
      schema:
        type: string
        enum:
        - "true"
  parameters:
    ApprovalToken:
      description: "Token de aprovação de superior (step-up), de `POST /api/v1/auth/approvals`,\
        \ para repetir a requisição recusada com 403 `APPROVAL_REQUIRED`. Vale uma\
        \ vez, por 2 min, só para a mesma ação, permissão, recurso e valor de limite,\
        \ pedida pelo mesmo usuário na mesma sessão. Ignorado quando o usuário já\
        \ tem a permissão. A ação concluída fica na auditoria com a aprovação (solicitante,\
        \ aprovador e motivo)."
      in: header
      name: X-Approval-Token
      required: false
      schema:
        type: string
        maxLength: 200
        minLength: 1
    IdempotencyKey:
      description: "Identificador único da operação, gerado pelo cliente (um UUID).\
        \ Repetir a mesma requisição com a mesma chave em até 24h devolve a resposta\
        \ guardada, sem executar de novo (com o cabeçalho `Idempotent-Replayed: true`).\
        \ Sem chave: 400 `IDEMPOTENCY_KEY_REQUIRED`; malformada: 400 `IDEMPOTENCY_KEY_INVALID`;\
        \ em andamento: 409 `IDEMPOTENCY_KEY_IN_USE`; usada com outra requisição:\
        \ 422 `IDEMPOTENCY_KEY_REUSED`. A chave vale por usuário."
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        example: 0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
        maxLength: 255
        minLength: 1
        pattern: "^[\\x21-\\x7E]+$"
  schemas:
    AddressDto:
      type: object
      description: Endereço no Brasil com o código IBGE do município.
      properties:
        city:
          type: string
          maxLength: 100
          minLength: 0
        complement:
          type: string
          maxLength: 100
          minLength: 0
          nullable: true
        district:
          type: string
          maxLength: 100
          minLength: 0
        ibgeCityCode:
          type: string
          description: "Código IBGE do município (7 dígitos, os 2 primeiros da UF)."
          example: "3550308"
          pattern: "\\d{7}"
        number:
          type: string
          maxLength: 20
          minLength: 0
        postalCode:
          type: string
          description: "CEP, com ou sem hífen; volta só com os 8 dígitos."
          example: 01310-100
          pattern: "\\d{5}-?\\d{3}"
        state:
          type: string
          enum:
          - RO
          - AC
          - AM
          - RR
          - PA
          - AP
          - TO
          - MA
          - PI
          - CE
          - RN
          - PB
          - PE
          - AL
          - SE
          - BA
          - MG
          - ES
          - RJ
          - SP
          - PR
          - SC
          - RS
          - MS
          - MT
          - GO
          - DF
        street:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - city
      - district
      - ibgeCityCode
      - number
      - postalCode
      - state
      - street
    AdjustmentRequest:
      type: object
      description: "Um ajuste parcial: o valor (positivo) sai do lançamento, com o\
        \ sinal oposto ao dele."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        reason:
          type: string
          maxLength: 500
          minLength: 0
          nullable: true
      required:
      - amount
      - reason
    ApplicabilityRuleDto:
      type: object
      description: "Regra de aplicabilidade: o modelo vale para o sujeito quando cada\
        \ lista não vazia contém o atributo dele (lista vazia: o critério não restringe).\
        \ Ao menos uma lista não vazia. Os IDs são de outros módulos e não são conferidos."
      properties:
        areaIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        cleaningTypeIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        roomTypeIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
      required:
      - areaIds
      - assetIds
      - cleaningTypeIds
      - roomTypeIds
    ApprovalLimitRequest:
      type: object
      description: O valor pedido de um limite da permissão.
      nullable: true
      properties:
        amount:
          type: string
          format: decimal
          description: "Valor decimal, como no problema."
          example: "15"
          minLength: 1
          pattern: "^\\d{1,14}(\\.\\d{1,4})?$"
        key:
          type: string
          example: maxPercent
          maxLength: 100
          minLength: 0
      required:
      - amount
      - key
    ApprovalRequest:
      type: object
      description: Pedido de aprovação de uma ação sensível recusada com 403 `APPROVAL_REQUIRED`.
      properties:
        action:
          type: string
          description: '`action` do problema `APPROVAL_REQUIRED`.'
          example: iam.user.deactivate
          maxLength: 100
          minLength: 0
          pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9-]*)+$"
        approverLogin:
          type: string
          description: Login do aprovador; não diferencia maiúsculas.
          example: joana.gerente
          maxLength: 100
          minLength: 0
        approverPin:
          type: string
          format: password
          description: PIN do aprovador (4 a 8 dígitos).
          minLength: 1
          pattern: "\\d{4,8}"
        limit:
          allOf:
          - $ref: "#/components/schemas/ApprovalLimitRequest"
          nullable: true
        permission:
          type: string
          description: '`permission` do problema `APPROVAL_REQUIRED`.'
          example: iam.users.manage
          maxLength: 100
          minLength: 0
        reason:
          type: string
          description: "Motivo da aprovação, para a trilha de auditoria."
          example: Cortesia da gerência
          maxLength: 500
          minLength: 0
        resourceRef:
          type: string
          description: '`resourceRef` do problema `APPROVAL_REQUIRED`.'
          example: iam.user:0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
          maxLength: 200
          minLength: 0
      required:
      - action
      - approverLogin
      - approverPin
      - permission
      - reason
      - resourceRef
    ApprovalResponse:
      type: object
      description: "Aprovação concedida: o token vai no cabeçalho `X-Approval-Token`\
        \ da requisição repetida."
      properties:
        approvalId:
          type: string
          format: uuid
        approvalToken:
          type: string
          description: "Token opaco de uso único. Não guarde: use na requisição repetida,\
            \ em até 2 min."
        approverId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Até quando o token vale (2 min depois da aprovação).
      required:
      - approvalId
      - approvalToken
      - approverId
      - expiresAt
    AreaRequest:
      type: object
      description: Dados de uma área comum.
      properties:
        description:
          type: string
          maxLength: 500
          minLength: 0
          nullable: true
        kind:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
        name:
          type: string
          example: Piscina
          maxLength: 80
          minLength: 0
      required:
      - kind
      - name
    AreaResponse:
      type: object
      description: Uma área comum.
      properties:
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - createdAt
      - id
      - kind
      - name
      - updatedAt
    AttachGuestFileRequest:
      type: object
      description: O vínculo de um anexo já enviado (`POST /api/v1/files`) ao perfil.
      properties:
        fileId:
          type: string
          format: uuid
          description: "O id do anexo, de uma finalidade de hóspede (`guests.…`)."
          nullable: true
      required:
      - fileId
    AuditEntryResponse:
      type: object
      description: Uma entrada da trilha de auditoria.
      properties:
        action:
          type: string
          description: Código estável da ação.
          example: iam.user.deactivate
        after:
          type: object
          additionalProperties: true
          description: Valores depois da ação. Campos sensíveis saem como `***`.
          nullable: true
        approvalId:
          type: string
          format: uuid
          description: "A aprovação de superior associada, se houver."
          nullable: true
        before:
          type: object
          additionalProperties: true
          description: Valores antes da ação; nulo numa criação. Campos sensíveis
            saem como `***`.
          nullable: true
        deviceSessionId:
          type: string
          format: uuid
          description: "A sessão de dispositivo de onde agiu, se houver."
          nullable: true
        entityId:
          type: string
          nullable: true
        entityType:
          type: string
          description: Tipo da entidade; nulo numa ação sem entidade.
          example: iam.user
          nullable: true
        errorCode:
          type: string
          description: O `code` do erro de uma recusa.
          example: INVALID_CREDENTIALS
          nullable: true
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: Quando a ação aconteceu (UTC).
        outcome:
          type: string
          description: "SUCCEEDED, ou REJECTED para uma recusa registrada (como a\
            \ falha de login)."
          enum:
          - SUCCEEDED
          - REJECTED
        userId:
          type: string
          format: uuid
          description: "Quem agiu; nulo quando foi o sistema (boot, jobs)."
          nullable: true
      required:
      - action
      - id
      - occurredAt
      - outcome
    BusinessDateResponse:
      type: object
      description: A data operacional corrente do hotel.
      properties:
        businessDate:
          type: string
          format: date
          description: Data de negócio a que lançamentos e diárias se referem (YYYY-MM-DD).
        timezone:
          type: string
          description: "Fuso do hotel (IANA), onde os instantes em UTC são exibidos."
          example: America/Sao_Paulo
      required:
      - businessDate
      - timezone
    CashCountRequest:
      type: object
      description: O valor declarado de uma forma de pagamento na contagem do fechamento.
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        method:
          type: string
          enum:
          - CASH
          - DEBIT_CARD
          - CREDIT_CARD
          - PIX
          - BANK_TRANSFER
          - OTHER
          nullable: true
      required:
      - amount
      - method
    CashCountResponse:
      type: object
      description: A contagem do fechamento de uma forma de pagamento.
      properties:
        declared:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        difference:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        expected:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        method:
          type: string
          description: Forma de pagamento (trate um valor desconhecido).
          x-extensible-enum:
          - CASH
          - DEBIT_CARD
          - CREDIT_CARD
          - PIX
          - BANK_TRANSFER
          - OTHER
      required:
      - declared
      - difference
      - expected
      - method
    CashMovementRequest:
      type: object
      description: "Uma sangria ou um suprimento, em dinheiro."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        reason:
          type: string
          description: Motivo (até 200 caracteres).
          example: Recolhimento ao cofre
          maxLength: 200
          minLength: 0
          nullable: true
        type:
          type: string
          description: '`WITHDRAWAL` (sangria) ou `SUPPLY` (suprimento).'
          enum:
          - WITHDRAWAL
          - SUPPLY
          nullable: true
      required:
      - amount
      - reason
      - type
    CashMovementResponse:
      type: object
      description: Uma sangria ou um suprimento registrado (imutável).
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        businessDate:
          type: string
          format: date
          description: Data operacional do registro.
        id:
          type: string
          format: uuid
        reason:
          type: string
        recordedAt:
          type: string
          format: date-time
        recordedBy:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - WITHDRAWAL
          - SUPPLY
      required:
      - amount
      - businessDate
      - id
      - reason
      - recordedAt
      - recordedBy
      - shiftId
      - type
    CashPointRequest:
      type: object
      description: Os dados de um ponto de caixa.
      properties:
        blindClose:
          type: boolean
          description: "Fechamento cego (padrão): o operador só vê o valor esperado\
            \ depois de declarar a contagem. Vale para os turnos abertos depois da\
            \ mudança."
        name:
          type: string
