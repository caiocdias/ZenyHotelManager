  /api/v1/quotes:
    get:
      description: "Para a chegada, a saída (de 1 a 365 noites), os adultos (ao menos\
        \ 1, até 40), as idades das crianças na chegada (até 20; de 0 à idade limite\
        \ de criança do hotel) e o canal, devolve as combinações de tipo de UH (`roomTypeIds`,\
        \ até 50, sem eles os ativos) e plano (`ratePlanIds`, até 50, sem eles os\
        \ ativos com algum dos tipos) **vendáveis** no canal (plano ativo, canal,\
        \ tipo no plano e ativo, ocupação máxima, antecedência pela data operacional,\
        \ restrições e preço) e com ao menos uma UH disponível em **todas** as noites,\
        \ com o total e o detalhe por noite. Com `includeUnavailable=true`, també\
        m as combinações de fora, com os motivos. Estadia fora do formato: 400 `STAY_INVALID`\
        \ (campo `departure`, `adults` ou `childAges[i]`); listas longas ou repetidas:\
        \ 400 `AVAILABILITY_QUERY_INVALID`; tipo inexistente: 400 `UNKNOWN_ROOM_TYPE`;\
        \ plano inexistente: 400 `UNKNOWN_RATE_PLAN`. Leitura sem trava: a reserva\
        \ confere de novo. Exige `reservations.availability.read`."
      operationId: quoteStay
      parameters:
      - in: query
        name: arrival
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: departure
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: adults
        required: true
        schema:
          type: integer
          format: int32
      - description: "As idades das crianças na chegada, separadas por vírgula."
        in: query
        name: childAges
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: channel
        required: true
        schema:
          type: string
          enum:
          - DIRECT
          - WEBSITE
          - OTA
      - description: "Os tipos de UH, separados por vírgula (sem eles, os ativos)."
        in: query
        name: roomTypeIds
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - description: "Os planos, separados por vírgula (sem eles, os ativos com algum\
          \ dos tipos)."
        in: query
        name: ratePlanIds
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: includeUnavailable
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cotar uma estadia
      tags:
      - reservations
  /api/v1/rate-plans:
    get:
      description: Em ordem de código. Exige `rates.plans.read`.
      operationId: listRatePlans
      parameters:
      - description: Só os ativos (`true`) ou só os inativos (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - in: query
        name: category
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - COURTESY
          - HOUSE_USE
      - description: Só os vendidos no canal.
        in: query
        name: channel
        required: false
        schema:
          type: string
          enum:
          - DIRECT
          - WEBSITE
          - OTA
      - description: Só os que se aplicam ao tipo de UH.
        in: query
        name: roomTypeId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageRatePlanResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar planos tarifários
      tags:
      - rates
    post:
      description: "Exige `rates.plans.manage`. A categoria não muda depois. Código\
        \ repetido (inclusive de um desativado): 409 `RATE_PLAN_CODE_ALREADY_IN_USE`.\
        \ Tipo de UH inexistente: 400 `UNKNOWN_ROOM_TYPE` (campo `roomTypeIds`), desativado:\
        \ 422 `ROOM_TYPE_INACTIVE`; política inexistente: 400 `UNKNOWN_CANCELLATION_POLICY`\
        \ ou `UNKNOWN_GUARANTEE_POLICY` (com o campo), desativada: 422 `CANCELLATION_POLICY_INACTIVE`\
        \ ou `GUARANTEE_POLICY_INACTIVE`; pacote inexistente: 400 `UNKNOWN_PACKAGE`\
        \ (campo `packageIds`), desativado: 422 `PACKAGE_INACTIVE`."
      operationId: createRatePlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatePlanCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: Plano cadastrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar um plano tarifário
      tags:
      - rates
  /api/v1/rate-plans/{id}:
    get:
      description: "Exige `rates.plans.read`. Inexistente: 404 `RATE_PLAN_NOT_FOUND`."
      operationId: getRatePlan
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um plano tarifário
      tags:
      - rates
    put:
      description: "Troca tudo menos a categoria (os conjuntos inteiros). Exige `rates.plans.manage`.\
        \ e o `If-Match` (ausente: 428; versão diferente: 412). Só as referências\
        \ novas são conferidas. Tipo de UH inexistente: 400 `UNKNOWN_ROOM_TYPE` (campo\
        \ `roomTypeIds`), desativado: 422 `ROOM_TYPE_INACTIVE`; política inexistente:\
        \ 400 `UNKNOWN_CANCELLATION_POLICY` ou `UNKNOWN_GUARANTEE_POLICY` (com o campo),\
        \ desativada: 422 `CANCELLATION_POLICY_INACTIVE` ou `GUARANTEE_POLICY_INACTIVE`;\
        \ pacote inexistente: 400 `UNKNOWN_PACKAGE` (campo `packageIds`), desativado:\
        \ 422 `PACKAGE_INACTIVE`."
      operationId: updateRatePlan
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatePlanUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um plano tarifário
      tags:
      - rates
  /api/v1/rate-plans/{id}/deactivate:
    post:
      description: Exige `rates.plans.manage`. Nada é apagado; desativar de novo não
        muda nada.
      operationId: deactivateRatePlan
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um plano tarifário
      tags:
      - rates
  /api/v1/rate-plans/{id}/derivation:
    put:
      description: "O plano passa a derivar do `basePlanId`; os preços dele são calculados\
        \ na leitura. Exige `rates.prices.manage` e o `If-Match` do plano. Base inexistente:\
        \ 400 `UNKNOWN_RATE_PLAN`; o próprio plano ou um que deriva dele: 422 `RATE_PLAN_DERIVATION_CYCLE`;\
        \ mais de 5 níveis: 422 `RATE_PLAN_DERIVATION_TOO_DEEP`; plano com preços\
        \ próprios a partir da data operacional: 422 `RATE_PLAN_HAS_PRICES`; regra\
        \ incoerente: 400 `RATE_PLAN_DERIVATION_INVALID`. Trocar a regra de um plano\
        \ publicado (ativo ou base de um ativo) é ação sensível (`rates.prices.override`)."
      operationId: setRatePlanDerivation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatePlanDerivationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir a derivação de um plano
      tags:
      - rates
  /api/v1/rate-plans/{id}/derivation/remove:
    post:
      description: "O plano deixa de derivar e fica sem preços até ganhar os próprios.\
        \ Exige `rates.prices.manage` e o `If-Match` do plano; num plano publicado,\
        \ é ação sensível (`rates.prices.override`). Sem derivação, nada muda."
      operationId: removeRatePlanDerivation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePlanResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Retirar a derivação de um plano
      tags:
      - rates
  /api/v1/rate-plans/{id}/prices:
    get:
      description: "Um período de até 366 dias (fim antes do início: 400 `RATE_PRICE_PERIOD_INVALID`;\
        \ mais: 400 `RATE_PRICE_PERIOD_TOO_LONG`). Num plano derivado, os preços sã\
        o os do base com a regra aplicada na leitura; a ocupação cujo ajuste deu zero\
        \ ou menos fica sem preço e vem em `unpricedByDerivation`. Os preços de crianç\
        a gravados em faixas que o hotel não usa mais vêm em `obsoleteChildren` e\
        \ não valem. Exige `rates.plans.read`."
      operationId: listRatePlanPrices
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      - description: Só este tipo de UH.
        in: query
        name: roomTypeId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePricesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar os preços de um plano num período
      tags:
      - rates
  /api/v1/rate-plans/{id}/prices/bulk-remove:
    post:
      description: "As linhas selecionadas ficam sem preço. As linhas são os tipos\
        \ de UH (do plano; senão 422 `ROOM_TYPE_NOT_IN_PLAN`) × as datas do período\
        \ (`from` e `to`, até 366 dias, a partir da data operacional) **ou** da temporada\
        \ (`seasonId`, cortada na data operacional), só nos `weekdays` (vazio = todos).\
        \ Período e temporada juntos, ou nenhum: 400 `RATE_PRICE_SELECTION_INVALID`;\
        \ fim antes do início ou nenhuma data nos dias da semana: 400 `RATE_PRICE_PERIOD_INVALID`;\
        \ mais de 366 dias: 400 `RATE_PRICE_PERIOD_TOO_LONG` (campo `to`); começo\
        \ antes da data operacional (ou temporada já terminada): 422 `RATE_PRICE_PERIOD_IN_PAST`;\
        \ temporada inexistente 400 `UNKNOWN_SEASON`, desativada 422 `SEASON_INACTIVE`;\
        \ plano derivado: 422 `RATE_PLAN_DERIVED`. Exige `rates.prices.manage`. Alterar\
        \ ou retirar uma **tarifa publicada** (preço já gravado, a partir da data\
        \ operacional, de um plano ativo ou base de um plano ativo) é ação sensível\
        \ (`rates.prices.override`): sem ela, 403 `APPROVAL_REQUIRED`; repita com\
        \ o `X-Approval-Token`. Gravar onde não havia, regravar os mesmos valores\
        \ ou mexer num plano não publicado não pede aprovação."
      operationId: removeRatePlanPrices
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatePriceRemovalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePriceChangeResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
