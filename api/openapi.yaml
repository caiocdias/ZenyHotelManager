      - reason
    RegisterPreAuthorizationRequest:
      type: object
      description: "Uma caução (pré-autorização de cartão de crédito) feita numa maquininha\
        \ não integrada, registrada na conta (RF-CTA-08). Não entra no saldo da conta\
        \ até ser capturada. **Nunca** envie o número do cartão nem o CVV (PCI-DSS,\
        \ RNF-10): só a bandeira e os 4 últimos dígitos, além do NSU e da autorizaç\
        ão."
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        authorizationCode:
          type: string
          description: "Código de autorização da pré-autorização (obrigatório). Até\
            \ 20 letras e dígitos (guardado em maiúsculas), com no máximo 12 dígitos:\
            \ uma sequência de 13 a 19 dígitos tem cara de número de cartão e é recusada\
            \ (400 `PRE_AUTHORIZATION_INVALID`)."
          example: A1B2C3
          maxLength: 20
          nullable: true
        cardBrand:
          type: string
          description: "A bandeira (só letras e espaços, até 20)."
          example: VISA
          maxLength: 20
          nullable: true
        cardLast4:
          type: string
          description: Exatamente os 4 últimos dígitos do cartão (nunca o número completo).
          example: "1234"
          nullable: true
          pattern: "^[0-9]{4}$"
        expiresAt:
          type: string
          format: date-time
          description: "Validade da autorização na adquirente (instante em UTC): depois\
            \ de agora e até 90 dias. Vencida, a caução não é mais capturada (situaç\
            ão `EXPIRED`, calculada na leitura), mas a sobra ainda pode ser liberada."
          example: 2026-10-27T15:00:00Z
          nullable: true
        nsu:
          type: string
          description: "NSU da pré-autorização. Até 20 letras e dígitos (guardado\
            \ em maiúsculas), com no máximo 12 dígitos: uma sequência de 13 a 19 dí\
            gitos tem cara de número de cartão e é recusada (400 `PRE_AUTHORIZATION_INVALID`)."
          example: "004512"
          maxLength: 20
          nullable: true
      required:
