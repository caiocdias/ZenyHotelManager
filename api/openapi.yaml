        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Encerrar uma conta
      tags:
      - billing
  /api/v1/folios/{id}/postings:
    get:
      description: "Em ordem de lançamento, com o estorno e o que ainda resta de cada\
        \ um. Exige `billing.folios.read`."
      operationId: listPostings
      parameters:
