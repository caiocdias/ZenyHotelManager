    MergeGuestRequest:
      type: object
      description: "A mesclagem de um perfil duplicado no perfil do caminho (o sobrevivente).\
        \ Por padrão vale o que o sobrevivente tem e os campos vazios dele recebem\
        \ os do absorvido; os campos listados em `takeFromMerged` vêm do absorvido,\
        \ se ele os tiver (nada é apagado). VIP se qualquer um for; restrito se qualquer\
        \ um estiver (com o motivo do sobrevivente, ou o do absorvido se só ele estava).\
        \ Documentos: os iguais ficam uma vez só, os que faltam passam para o sobrevivente,\
        \ e o mesmo tipo e país com outro número é recusado."
