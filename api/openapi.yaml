        \ Exige `billing.folios.manage`. Sem corpo. Encerrada, a conta não recebe\
        \ lançamento, pagamento, reembolso nem caução e não troca o pagador nem o\
        \ limite (409 `FOLIO_CLOSED`); a liberação de caução continua valendo."
