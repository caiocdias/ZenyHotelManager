  /api/v1/routing-rules:
    get:
      description: Em ordem de criação. Exige `billing.folios.read`.
      operationId: listRoutingRules
      parameters:
      - description: Só as da conta de origem.
        in: query
        name: sourceFolioId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as que levam à conta de destino.
        in: query
        name: targetFolioId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as ativas (`true`) ou só as desativadas (`false`); omita para
          todas.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageRoutingRuleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as regras de roteamento
      tags:
      - billing
    post:
      description: "Os lançamentos pedidos na conta de origem, nos códigos ou no grupo\
        \ de receita da regra e na data operacional dentro do período, vão para a\
        \ conta de destino; com A → B e B → C, o lançamento em A vai a C. Na mesma\
        \ conta, a regra por código prevalece sobre a por grupo. Exige `billing.routing.manage`.\
        \ Com a regra ativa: origem encerrada: 409 `FOLIO_CLOSED`; destino encerrado:\
        \ 409 `ROUTING_TARGET_CLOSED`; outra regra ativa da mesma origem e do mesmo\
        \ nível (por código, com algum código em comum, ou pelo mesmo grupo) em perí\
        odo que se cruza: 409 `ROUTING_RULE_OVERLAP`; regra que formaria um ciclo\
        \ (a cadeia voltaria à origem, inclusive origem = destino): 422 `ROUTING_RULE_CYCLE`.\
        \ Códigos e grupo juntos, nenhum dos dois, código repetido ou fim antes do\
        \ início: 400 `ROUTING_RULE_INVALID`; código inexistente: 400 `UNKNOWN_TRANSACTION_CODE`;\
        \ conta inexistente: 400 `UNKNOWN_FOLIO`."
      operationId: createRoutingRule
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingRuleCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleResponse"
          description: Regra criada.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar uma regra de roteamento
      tags:
      - billing
  /api/v1/routing-rules/{id}:
