    put:
      description: "O dono não muda. Exige `billing.folios.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Pagador novo inexistente: 400 `UNKNOWN_COMPANY`;\
        \ desativado: 422 `COMPANY_INACTIVE`."
      operationId: updateFolio
      parameters:
      - in: path
        name: id
        required: true
