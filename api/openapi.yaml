          type: string
        key:
          type: string
          description: Chave do limite na concessão.
          example: maxPercent
        unit:
          type: string
          description: "MONEY: reais, até 2 casas; PERCENT: pontos percentuais de\
            \ 0 a 100, até 4 casas; QUANTITY: inteiro."
