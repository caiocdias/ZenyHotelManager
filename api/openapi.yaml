        \ 409 `PACKAGE_CODE_ALREADY_IN_USE`; preço fora da faixa ou preço por estadia\
        \ sem o ritmo `ON_ARRIVAL`: 400 `PACKAGE_INVALID`; código de lançamento inexistente:\
        \ 400 `UNKNOWN_TRANSACTION_CODE` (campo `transactionCodeId`), desativado:\
        \ 422 `TRANSACTION_CODE_INACTIVE`, de outro tipo que não consumo: 422 `TRANSACTION_CODE_KIND_NOT_ALLOWED`."
      operationId: updatePackage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um pacote
      tags:
      - rates
  /api/v1/packages/{id}/deactivate:
