  /api/v1/cashier-shifts:
    get:
      description: "Do mais novo para o mais antigo. Exige `billing.shifts.read`;\
        \ com `OWN`, só os turnos do próprio usuário. Sem o esperado (veja o turno)."
      operationId: listCashierShifts
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - in: query
        name: cashPointId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: operatorId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageCashierShiftListItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os turnos de caixa
      tags:
      - billing
    post:
      description: "Com o fundo de troco, na data operacional, com número `CX-<ano>-<sequê\
        ncia>`. Exige `billing.cashier.operate`. O usuário já tem um turno aberto\
        \ (em qualquer ponto): 409 `CASHIER_SHIFT_ALREADY_OPEN`; ponto inexistente:\
        \ 400 `UNKNOWN_CASH_POINT`; desativado: 422 `CASH_POINT_INACTIVE`; fundo fora\
        \ de 0,00 a 1.000.000,00: 400 `CASHIER_SHIFT_INVALID`. Fechamento cego: num\
        \ turno cego aberto, `expected` sai nulo (e `expectedVisible` falso) a quem\
        \ não tem `billing.shifts.review`; depois do fechamento, sai a todos que leem\
        \ o turno."
      operationId: openCashierShift
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashierShiftOpenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: Turno aberto.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Abrir o próprio turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/current:
    get:
      description: "Exige `billing.cashier.operate`. Sem turno aberto: 404 `CASHIER_SHIFT_NOT_FOUND`.\
        \ Fechamento cego: num turno cego aberto, `expected` sai nulo (e `expectedVisible`\
        \ falso) a quem não tem `billing.shifts.review`; depois do fechamento, sai\
        \ a todos que leem o turno."
      operationId: getCurrentCashierShift
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o próprio turno aberto
      tags:
      - billing
  /api/v1/cashier-shifts/{id}:
    get:
      description: "Com os movimentos; o `ETag` muda a cada movimento. Exige `billing.shifts.read`;\
        \ com `OWN`, o turno de outro usuário responde 404 `CASHIER_SHIFT_NOT_FOUND`.\
        \ Fechamento cego: num turno cego aberto, `expected` sai nulo (e `expectedVisible`\
        \ falso) a quem não tem `billing.shifts.review`; depois do fechamento, sai\
        \ a todos que leem o turno."
      operationId: getCashierShift
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/close:
    post:
      description: "Com a contagem declarada por forma de pagamento (a omitida vale\
        \ zero); devolve o relatório de fechamento, com o esperado e a diferença por\
        \ forma (declarado − esperado). Exige `billing.cashier.operate`, e só o operador\
        \ fecha (403 `CASHIER_SHIFT_OPERATOR_REQUIRED`). Já fechado: 409 `CASHIER_SHIFT_CLOSED`;\
        \ forma repetida, dinheiro fora de 0,00 a 1.000.000,00 ou outra forma fora\
        \ de -1.000.000,00 a 1.000.000,00 (o líquido do relatório pode ser negativo):\
        \ 400 `CASHIER_COUNT_INVALID`. Com alguma diferença, quem tem `billing.shifts.review`\
        \ (menos o operador) recebe a notificação `billing.cashier-shift-difference`."
      operationId: closeCashierShift
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashierShiftCloseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftReportResponse"
          description: OK
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Fechar o próprio turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/movements:
    post:
      description: "Em dinheiro, com motivo; imutável. Exige `billing.cashier.operate`,\
        \ e só o operador do turno registra (403 `CASHIER_SHIFT_OPERATOR_REQUIRED`).\
        \ Turno fechado: 409 `CASHIER_SHIFT_CLOSED`; valor fora de 0,01 a 1.000.000,00\
        \ ou motivo vazio: 400 `CASHIER_SHIFT_INVALID`. A sangria não é conferida\
        \ contra o dinheiro esperado (o fechamento cego não o revela); a falta aparece\
        \ como diferença."
      operationId: recordCashMovement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashMovementRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovementResponse"
          description: Movimento registrado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Registrar uma sangria ou um suprimento
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/report:
    get:
      description: "Em JSON (o PDF é do M5). Exige `billing.shifts.read`; com `OWN`,\
        \ só o dos próprios turnos (o de outro: 404 `CASHIER_SHIFT_NOT_FOUND`). Turno\
        \ aberto: 409 `CASHIER_SHIFT_NOT_CLOSED`."
      operationId: getCashierShiftReport
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o relatório de fechamento de um turno
      tags:
      - billing
  /api/v1/checklist-executions:
    get:
      description: "Da mais nova para a mais antiga, sem as respostas. Exige `checklists.executions.read`.\
        \ Com o escopo `OWN`, só as execuções de que o usuário é executor ou candidato\
        \ (rotina, H14)."
      operationId: listChecklistExecutions
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
      - in: query
        name: context
        required: false
        schema:
          type: string
          enum:
          - HOUSEKEEPING
          - INSPECTION
          - MAINTENANCE
          - COMMON_AREA
          - RESTAURANT
          - EVENT
          - OTHER
      - description: Só as geradas por esta rotina.
        in: query
        name: routineId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as de rotina desta data operacional.
        in: query
        name: businessDate
        required: false
        schema:
          type: string
          format: date
      - description: "Só as deste tipo de sujeito (com `subjectId`, deste sujeito)."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
      - in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageChecklistExecutionSummaryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar execuções de checklist
      tags:
      - checklists
    post:
      description: "Com a última versão publicada do modelo (`templateId`, ativo)\
        \ ou do modelo que vale para o sujeito no contexto (`context` e `attributes`,\
        \ RF-CHK-04); o executor é o usuário e o início, agora. Exige `checklists.executions.execute`.\
        \ Nem um nem outro, ou os dois: 400 `CHECKLIST_EXECUTION_INVALID`; nenhum\
        \ modelo que valha: 422 `CHECKLIST_NO_APPLICABLE_TEMPLATE`; modelo desativado\
        \ ou nunca publicado: 422 `CHECKLIST_TEMPLATE_INACTIVE` ou `CHECKLIST_TEMPLATE_NOT_PUBLISHED`."
      operationId: startChecklistExecution
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartChecklistExecutionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: Execução iniciada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Iniciar uma execução avulsa
      tags:
      - checklists
  /api/v1/checklist-executions/{id}:
    get:
      description: "Com as respostas e o conteúdo da versão usada. Exige `checklists.executions.read`.\
        \ Com o escopo `OWN`, só as execuções de que o usuário é executor ou candidato\
        \ (rotina, H14). Inexistente ou fora do escopo: 404 `CHECKLIST_EXECUTION_NOT_FOUND`."
      operationId: getChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma execução
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/answers:
    put:
      description: "A lista substitui as respostas gravadas; uma resposta que não\
        \ mudou mantém o horário. As fotos novas são conferidas e vinculadas à execuç\
        ão; as que saem, desvinculadas. Exige `checklists.executions.execute` e o\
        \ `If-Match` (ausente: 428; versão diferente: 412). Só o executor responde\
        \ e conclui (403 `CHECKLIST_EXECUTOR_REQUIRED`); pendente: 409 `CHECKLIST_EXECUTION_NOT_STARTED`;\
        \ concluída: 409 `CHECKLIST_EXECUTION_ALREADY_COMPLETED`. Recusas das respostas,\
        \ `400` com o campo em `errors[]`: `CHECKLIST_ANSWER_UNKNOWN_ITEM`, `CHECKLIST_ANSWER_DUPLICATED`\
        \ e `CHECKLIST_ANSWER_INVALID`. Foto inexistente: 422 `CHECKLIST_PHOTO_NOT_FOUND`;\
        \ de outra finalidade, de outro usuário ou de outro registro: 422 `CHECKLIST_PHOTO_INVALID`."
      operationId: replaceChecklistAnswers
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceChecklistAnswersRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Responder (trocar todas as respostas)
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/complete:
    post:
      description: "Confere os obrigatórios visíveis (o item oculto pela condição\
        \ não é exigido; a resposta dele sai), conclui e publica `ChecklistCompleted`\
        \ com as respostas que disparam ações (RF-CHK-05), uma vez. Exige `checklists.executions.execute`.\
        \ Obrigatório visível sem resposta: 422 `CHECKLIST_REQUIRED_ITEMS_MISSING`,\
        \ com as chaves em `missingItems`. Só o executor responde e conclui (403 `CHECKLIST_EXECUTOR_REQUIRED`);\
        \ pendente: 409 `CHECKLIST_EXECUTION_NOT_STARTED`; concluída: 409 `CHECKLIST_EXECUTION_ALREADY_COMPLETED`."
      operationId: completeChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Concluir uma execução
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/start:
    post:
      description: "O primeiro candidato que inicia assume a execução (H14), com a\
        \ última versão publicada do modelo. Exige `checklists.executions.execute`\
        \ (com `OWN`, ser candidato: 403 `RESOURCE_OUT_OF_SCOPE`). Já iniciada: 409\
        \ `CHECKLIST_EXECUTION_ALREADY_STARTED`."
      operationId: startScheduledChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Assumir a execução pendente de uma rotina
      tags:
      - checklists
  /api/v1/checklist-reports/compliance:
    get:
      description: "Por modelo, as execuções concluídas no período (pela conclusã\
        o) e as respostas de marcação por resultado, com a taxa de conformidade (OK\
        \ sobre os avaliados; nula sem nada avaliado). Em ordem de nome do modelo.\
        \ Só os itens de marcação têm resultado: OK conta como conforme, NÃO OK como\
        \ não conforme, e \"não se aplica\" fica fora do denominador (`evaluatedCount`\
        \ = OK + NÃO OK). Período em datas no fuso do hotel, inclusive nas duas pontas\
        \ (`from` e `to`, opcionais); fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`.\
        \ Exige `checklists.reports.read`."
      operationId: getChecklistComplianceReport
      parameters:
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Só os sujeitos deste tipo (o local: `rooms.room`, `rooms.area`…\
          )."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
          maxLength: 60
          minLength: 0
      - description: Só este sujeito (o local).
        in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistComplianceReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Conformidade por modelo
      tags:
      - checklists
  /api/v1/checklist-reports/failed-items:
    get:
      description: "Os itens de marcação com ao menos uma reprovação (NÃO OK) em execuç\
        ões concluídas no período (pela conclusão), do mais reprovado ao menos (desempate\
        \ pela taxa de reprovação), até `limit`. O rótulo é o da versão mais nova\
        \ entre as execuções do filtro (a chave do item é estável entre as versões).\
        \ Só os itens de marcação têm resultado: OK conta como conforme, NÃO OK como\
        \ não conforme, e \"não se aplica\" fica fora do denominador (`evaluatedCount`\
        \ = OK + NÃO OK). Período em datas no fuso do hotel, inclusive nas duas pontas\
        \ (`from` e `to`, opcionais); fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`.\
        \ Exige `checklists.reports.read`."
      operationId: getChecklistFailedItemsReport
      parameters:
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Só os sujeitos deste tipo (o local: `rooms.room`, `rooms.area`…\
          )."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
          maxLength: 60
          minLength: 0
      - description: Só este sujeito (o local).
        in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Quantos itens, no máximo (de 1 a 200)."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistFailedItemsReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Itens mais reprovados
      tags:
      - checklists
  /api/v1/checklist-reports/location-history:
    get:
      description: "As execuções de um local (sujeito), em qualquer situação — inclusive\
        \ a pendente de rotina que ninguém fez —, da mais recente para a mais antiga\
        \ pela referência (`referenceAt`: a conclusão, senão o início, senão o prazo\
        \ da rotina), com as respostas de marcação por resultado (parciais enquanto\
        \ em andamento). O período filtra pela referência. Só os itens de marcaçã\
        o têm resultado: OK conta como conforme, NÃO OK como não conforme, e \"nã\
        o se aplica\" fica fora do denominador (`evaluatedCount` = OK + NÃO OK). Perí\
        odo em datas no fuso do hotel, inclusive nas duas pontas (`from` e `to`, opcionais);\
        \ fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`. Exige `checklists.reports.read`."
      operationId: getChecklistLocationHistory
      parameters:
      - description: "O tipo do sujeito (o local: `rooms.room`, `rooms.area`…)."
        in: query
        name: subjectType
        required: true
        schema:
          type: string
          maxLength: 60
          minLength: 1
      - description: O sujeito (o local).
        in: query
        name: subjectId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageLocationHistoryEntryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Histórico por local
      tags:
      - checklists
  /api/v1/checklist-routines:
    get:
      description: Em ordem de nome. Exige `checklists.routines.read`.
      operationId: listChecklistRoutines
      parameters:
      - description: Só as ativas (`true`) ou só as inativas (`false`); omita para
          todas.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageChecklistRoutineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar rotinas de checklist
      tags:
      - checklists
    post:
      description: "A rotina gera, a cada virada da data operacional em que ocorre,\
        \ uma execução pendente com os candidatos escalados no setor num turno que\
        \ cobre o horário (H14). Exige `checklists.routines.manage`. Recusas: 400\
        \ `CHECKLIST_ROUTINE_INVALID` (nome, dias da semana só na semanal e obrigató\
        rios nela, horário com segundos, local), 400 `UNKNOWN_CHECKLIST_TEMPLATE`\
        \ e `UNKNOWN_DEPARTMENT`, 422 `CHECKLIST_TEMPLATE_INACTIVE`."
      operationId: createChecklistRoutine
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistRoutineRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoutineResponse"
          description: Rotina criada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar uma rotina de checklist
      tags:
      - checklists
  /api/v1/checklist-routines/{id}:
    get:
      description: "Exige `checklists.routines.read`. Inexistente: 404 `CHECKLIST_ROUTINE_NOT_FOUND`."
      operationId: getChecklistRoutine
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoutineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma rotina
      tags:
      - checklists
    put:
      description: "Troca todos os dados; vale nas próximas gerações (as execuções\
        \ já geradas ficam). Exige `checklists.routines.manage` e o `If-Match` (ausente:\
        \ 428; versão diferente: 412). Recusas: 400 `CHECKLIST_ROUTINE_INVALID` (nome,\
        \ dias da semana só na semanal e obrigatórios nela, horário com segundos,\
        \ local), 400 `UNKNOWN_CHECKLIST_TEMPLATE` e `UNKNOWN_DEPARTMENT`, 422 `CHECKLIST_TEMPLATE_INACTIVE`."
      operationId: updateChecklistRoutine
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistRoutineRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoutineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma rotina
      tags:
      - checklists
  /api/v1/checklist-routines/{id}/deactivate:
    post:
      description: "Desativada, não gera mais execuções. Exige `checklists.routines.manage`."
      operationId: deactivateChecklistRoutine
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoutineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma rotina
      tags:
      - checklists
  /api/v1/checklist-routines/{id}/reactivate:
    post:
      description: Exige `checklists.routines.manage`.
      operationId: reactivateChecklistRoutine
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRoutineResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma rotina
      tags:
      - checklists
  /api/v1/checklist-templates:
    get:
      description: "Em ordem de nome, sem o conteúdo. Exige `checklists.templates.read`."
      operationId: listChecklistTemplates
      parameters:
      - description: Só os modelos deste contexto.
        in: query
        name: context
        required: false
        schema:
          type: string
          enum:
          - HOUSEKEEPING
          - INSPECTION
          - MAINTENANCE
          - COMMON_AREA
          - RESTAURANT
          - EVENT
          - OTHER
      - description: Só os ativos (`true`) ou só os inativos (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageChecklistTemplateSummaryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar modelos de checklist
      tags:
      - checklists
    post:
      description: "Cria o modelo com o rascunho, sem publicar. Exige `checklists.templates.manage`.\
        \ Recusas do conteúdo, `400` com o campo em `errors[]`: `CHECKLIST_DATA_INVALID`,\
        \ `CHECKLIST_ITEM_KEY_DUPLICATED`, `CHECKLIST_ITEM_OPTIONS_INVALID`, `CHECKLIST_CONDITION_UNKNOWN_ITEM`,\
        \ `CHECKLIST_CONDITION_FORWARD_REFERENCE` (a condição só cita item anterior),\
        \ `CHECKLIST_CONDITION_INCOMPATIBLE`, `CHECKLIST_ACTION_INVALID`, `CHECKLIST_ACTION_ITEM_TYPE_MISMATCH`\
        \ (baixa de estoque e troca de enxoval só em item de quantidade; ocorrência\
        \ só em item de marcação) e `CHECKLIST_APPLICABILITY_INVALID`."
      operationId: createChecklistTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklistTemplateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplateResponse"
          description: Modelo criado (rascunho).
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um modelo de checklist
      tags:
      - checklists
  /api/v1/checklist-templates/{id}:
    get:
      description: "Com o rascunho e o número da última versão publicada. Exige `checklists.templates.read`.\
        \ Inexistente: 404 `CHECKLIST_TEMPLATE_NOT_FOUND`."
      operationId: getChecklistTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um modelo de checklist
      tags:
      - checklists
    put:
      description: "Troca o nome (vale na hora) e o rascunho inteiro (aplicabilidade,\
        \ seções e itens; vale na próxima publicação). As versões publicadas não mudam.\
        \ Exige `checklists.templates.manage` e o `If-Match` (ausente: 428; versã\
        o diferente: 412). Modelo desativado: 422 `CHECKLIST_TEMPLATE_INACTIVE`. Recusas\
        \ do conteúdo, `400` com o campo em `errors[]`: `CHECKLIST_DATA_INVALID`,\
        \ `CHECKLIST_ITEM_KEY_DUPLICATED`, `CHECKLIST_ITEM_OPTIONS_INVALID`, `CHECKLIST_CONDITION_UNKNOWN_ITEM`,\
        \ `CHECKLIST_CONDITION_FORWARD_REFERENCE` (a condição só cita item anterior),\
        \ `CHECKLIST_CONDITION_INCOMPATIBLE`, `CHECKLIST_ACTION_INVALID`, `CHECKLIST_ACTION_ITEM_TYPE_MISMATCH`\
        \ (baixa de estoque e troca de enxoval só em item de quantidade; ocorrência\
        \ só em item de marcação) e `CHECKLIST_APPLICABILITY_INVALID`."
      operationId: updateChecklistTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistTemplateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar o rascunho de um modelo
      tags:
      - checklists
  /api/v1/checklist-templates/{id}/deactivate:
    post:
      description: "Exige `checklists.templates.manage`. Nada é apagado: as versõ\
        es publicadas ficam, mas o modelo deixa de ser escolhido para os sujeitos\
        \ e não é editado nem publicado. Desativar de novo não muda nada."
      operationId: deactivateChecklistTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um modelo
      tags:
      - checklists
  /api/v1/checklist-templates/{id}/publish:
    post:
      description: "Congela o rascunho na versão seguinte (1, 2, …); as anteriores\
        \ continuam iguais. Exige `checklists.templates.manage` e o `If-Match` (ausente:\
        \ 428; versão diferente: 412): publica-se o rascunho que se viu. Rascunho\
        \ igual à última versão: 422 `CHECKLIST_NOTHING_TO_PUBLISH`; modelo desativado:\
        \ 422 `CHECKLIST_TEMPLATE_INACTIVE`."
      operationId: publishChecklistTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistVersionResponse"
          description: Versão publicada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Publicar o rascunho como uma versão nova
      tags:
      - checklists
  /api/v1/checklist-templates/{id}/reactivate:
    post:
      description: Exige `checklists.templates.manage`.
      operationId: reactivateChecklistTemplate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
