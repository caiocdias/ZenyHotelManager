openapi: 3.0.1
info:
  description: "API do servidor do Zeny Hotel Manager. Erros em RFC 9457 (application/problem+json)\
    \ com `code` estável; paginação por cursor (`cursor`/`limit`); concorrência otimista\
    \ com `ETag`/`If-Match`; `Idempotency-Key` obrigatório nas operações com efeito\
    \ financeiro ou externo (resposta guardada por 24h); instantes em UTC (ISO-8601\
    \ com `Z`), datas `YYYY-MM-DD` e dinheiro como string decimal em BRL. Autenticaç\
    ão: `POST /api/v1/auth/login` devolve um access token JWT de 15 min, enviado como\
    \ `Authorization: Bearer …`, e um refresh token rotativo da sessão do dispositivo,\
    \ trocado em `POST /api/v1/auth/refresh`. Um `401` com `code` `UNAUTHENTICATED`\
    \ pede um refresh; os demais códigos de `401` (credenciais, bloqueio, refresh)\
    \ pedem um novo login."
  title: Zeny Hotel Manager API
  version: v1
servers:
- description: Este servidor
  url: /
security:
- bearerAuth: []
tags:
- description: "Autenticação, sessões por dispositivo e usuários."
  name: iam
- description: Informações sobre o servidor e a API.
  name: meta
- description: Trilha de auditoria das escritas.
  name: audit
paths:
  /api/v1/audit-entries:
    get:
      description: "Entradas da trilha, das mais recentes para as mais antigas, filtradas\
        \ por quem agiu (`userId`), pela entidade (`entityType` e, opcionalmente,\
        \ `entityId`) e pelo período (`from` inclusive, `to` exclusive, instantes\
        \ em UTC). Cada entrada traz quem, quando e de qual sessão de dispositivo,\
        \ a ação e o resultado, a entidade, os valores antes e depois (com senha,\
        \ PIN, tokens e campos cifrados mascarados como `***`) e a aprovação associada.\
        \ Exige `audit.read` (sem ela, 403 `PERMISSION_DENIED`)."
      operationId: listAuditEntries
      parameters:
      - description: Só as entradas deste usuário (quem agiu).
        in: query
        name: userId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Tipo da entidade, como `iam.user` ou `iam.role`."
        in: query
        name: entityType
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: Id da entidade; exige `entityType`.
        in: query
        name: entityId
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - description: "Início do período (inclusive), em UTC."
        example: 2026-10-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Fim do período (exclusive), em UTC."
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageAuditEntryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar a trilha de auditoria
      tags:
      - audit
  /api/v1/auth/login:
    post:
      description: "Público. Abre uma sessão no dispositivo (um novo login no mesmo\
        \ dispositivo encerra a sessão anterior dele) e devolve um access token JWT\
        \ de 15 min e um refresh token. O login não diferencia maiúsculas. Recusas\
        \ com 401: `INVALID_CREDENTIALS` (login ou senha), `ACCOUNT_LOCKED` (falhas\
        \ seguidas; o bloqueio cresce a cada nova falha e vale mesmo com a senha certa)\
        \ e `ACCOUNT_DISABLED`. Com `passwordChangeRequired`, só a troca de senha\
        \ e o logout respondem até a senha ser trocada."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Sessão aberta.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Entrar com login e senha
      tags:
      - iam
  /api/v1/auth/logout:
    post:
      description: "Encerra a sessão do access token: o refresh token dela deixa de\
        \ valer. O access token vence sozinho em até 15 min."
      operationId: logout
      responses:
        "204":
          description: Sessão encerrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Sair
      tags:
      - iam
  /api/v1/auth/me:
    get:
      description: "Quem está logado, as roles ativas e as permissões efetivas agora:\
        \ a união das roles ativas, com o escopo mais amplo e, por chave, o maior\
        \ limite. As permissões não vão no access token: uma mudança de role vale\
        \ já na requisição seguinte. Não exige permissão."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: O usuário corrente e as permissões efetivas
      tags:
      - iam
  /api/v1/auth/password:
    post:
      description: "Confere a senha atual (401 `INVALID_CREDENTIALS` ou `ACCOUNT_LOCKED`,\
        \ contando para o bloqueio como o login) e grava a nova, de 12 a 128 caracteres\
        \ e diferente da atual (422 `PASSWORD_UNCHANGED`). Encerra a troca obrigató\
        ria e as outras sessões do usuário; a sessão corrente continua, e o próximo\
        \ refresh traz um access token sem a pendência."
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Senha trocada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Trocar a própria senha
      tags:
      - iam
  /api/v1/auth/refresh:
    post:
      description: "Público (o cabeçalho Authorization é ignorado). Troca o refresh\
        \ token por um par novo: o refresh token usado deixa de valer, e a validade\
        \ da sessão volta a 30 dias. Recusas com 401: `REFRESH_TOKEN_INVALID` (desconhecido,\
        \ vencido, sessão revogada ou usuário desativado) e `REFRESH_TOKEN_REUSED`\
        \ (o token já tinha sido trocado: a sessão inteira é revogada, inclusive o\
        \ refresh token mais novo). Nos dois casos, o cliente pede um novo login."
      operationId: refreshTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Renovar os tokens da sessão
      tags:
      - iam
  /api/v1/auth/sessions:
    get:
      description: "Sessões não revogadas e não vencidas do usuário, da mais nova\
        \ para a mais antiga."
      operationId: listMySessions
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as próprias sessões ativas
      tags:
      - iam
  /api/v1/auth/sessions/{id}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Sessão de outro usuário ou\
        \ inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeMySession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão própria
      tags:
      - iam
  /api/v1/meta/version:
    get:
      description: "Público, sem autenticação. A versão da API muda só com mudanç\
        a incompatível (/api/v2)."
      operationId: getServerVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerVersionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Versão do servidor e da API
      tags:
      - meta
  /api/v1/permissions:
    get:
      description: "Permissões vigentes do catálogo, definido pelo sistema e não editá\
        vel, em ordem de código: escopos suportados, se é sensível (exige aprovaçã\
        o de superior quando falta) e os limites que aceita. Exige `iam.permissions.read`\
        \ (sem ela, 403 `PERMISSION_DENIED`)."
      operationId: listPermissions
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePermissionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar o catálogo de permissões
      tags:
      - iam
  /api/v1/roles:
    get:
      description: "Todas as roles, ativas e inativas, em ordem de criação. Exige\
        \ `iam.roles.read`."
      operationId: listRoles
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageRoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar roles
      tags:
      - iam
    post:
      description: "Exige `iam.roles.manage`. Ninguém concede permissão, escopo ou\
        \ limite acima dos seus (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`). Permissão fora\
        \ do catálogo: 400 `UNKNOWN_PERMISSION`; escopo não suportado, limite não\
        \ declarado ou inválido, ou permissão repetida: 400 `INVALID_GRANT`. Nome\
        \ já usado, sem diferenciar maiúsculas: 409 `ROLE_NAME_ALREADY_IN_USE`."
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Role criada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar uma role
      tags:
      - iam
  /api/v1/roles/{id}:
    get:
      description: "Exige `iam.roles.read`. O `ETag` vai no `If-Match` da edição.\
        \ Inexistente: 404 `ROLE_NOT_FOUND`."
      operationId: getRole
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma role
      tags:
      - iam
    put:
      description: "Troca nome, descrição e o conjunto inteiro de concessões. Exige\
        \ `iam.roles.manage` e o `If-Match` (ausente: 428; versão diferente: 412).\
        \ Cada concessão acrescentada ou mudada, inclusive numa role que o próprio\
        \ usuário tem, não pode passar das permissões dele (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`).\
        \ A role Administrador não é editada (422 `SYSTEM_ROLE_IMMUTABLE`). Vale na\
        \ requisição seguinte de quem tem a role."
      operationId: updateRole
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma role
      tags:
      - iam
  /api/v1/roles/{id}/deactivate:
    post:
      description: A role deixa de conceder permissões já na requisição seguinte de
        quem a tem; nada é apagado. Exige `iam.roles.manage`. A role Administrador
        não é desativada (422 `SYSTEM_ROLE_IMMUTABLE`).
      operationId: deactivateRole
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma role
      tags:
      - iam
  /api/v1/roles/{id}/duplicate:
    post:
      description: Cria uma role nova com as concessões vigentes da outra. Exige `iam.roles.manage`
        e ter todas elas (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`).
      operationId: duplicateRole
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Role criada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Duplicar uma role
      tags:
      - iam
  /api/v1/roles/{id}/reactivate:
    post:
      description: As concessões da role voltam a valer. Exige `iam.roles.manage`
        e ter todas elas (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`).
      operationId: reactivateRole
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma role
      tags:
      - iam
  /api/v1/users:
    get:
      description: "Todos os usuários, ativos e inativos, em ordem de login. Exige\
        \ `iam.users.read`."
      operationId: listUsers
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageUserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar usuários
      tags:
      - iam
    post:
      description: "Exige `iam.users.manage`. A senha é provisória: o usuário a troca\
        \ no primeiro login. O PIN (4 a 8 dígitos) é opcional. Login já usado, sem\
        \ diferenciar maiúsculas: 409 `LOGIN_ALREADY_IN_USE`. As roles seguem as regras\
        \ de `PUT /users/{id}/roles`."
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Usuário criado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um usuário
      tags:
      - iam
  /api/v1/users/{id}:
    get:
      description: "Exige `iam.users.read`. O `ETag` vai no `If-Match` das edições.\
        \ Inexistente: 404 `USER_NOT_FOUND`."
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um usuário
      tags:
      - iam
    put:
      description: "Troca o nome (o login não muda). Exige `iam.users.manage` e o\
        \ `If-Match` (ausente: 428; versão diferente: 412). Um administrador só é\
        \ editado por outro administrador (403 `ADMINISTRATOR_REQUIRED`)."
      operationId: updateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um usuário
      tags:
      - iam
  /api/v1/users/{id}/deactivate:
    post:
      description: "Exige `iam.users.manage`. O usuário não entra mais, perde as permissõ\
        es já na requisição seguinte e todas as sessões dele são revogadas (o pró\
        ximo refresh falha; o access token vence em até 15 min). Nada é apagado. O\
        \ último administrador ativo não é desativado (409 `LAST_ADMINISTRATOR`)."
      operationId: deactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um usuário
      tags:
      - iam
  /api/v1/users/{id}/reactivate:
    post:
      description: "Exige `iam.users.manage` e cobrir as permissões do usuário (403\
        \ `GRANT_EXCEEDS_OWN_PERMISSIONS`). As sessões revogadas não voltam: o usuá\
        rio entra de novo."
      operationId: reactivateUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar um usuário
      tags:
      - iam
  /api/v1/users/{id}/reset-password:
    post:
      description: "Define uma senha provisória (12 a 128 caracteres), que o usuá\
        rio troca no próximo login; zera o bloqueio por tentativas e revoga todas\
        \ as sessões dele. Exige `iam.users.manage` e cobrir as permissões do usuá\
        rio (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`)."
      operationId: resetUserPassword
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Senha redefinida.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Redefinir a senha de um usuário
      tags:
      - iam
  /api/v1/users/{id}/reset-pin:
    post:
      description: "PIN de 4 a 8 dígitos, usado para aprovar ações sensíveis de outro\
        \ usuário. Exige `iam.users.manage` e cobrir as permissões do usuário (403\
        \ `GRANT_EXCEEDS_OWN_PERMISSIONS`)."
      operationId: resetUserPin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPinRequest"
        required: true
      responses:
        "204":
          description: PIN definido.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir o PIN de aprovação de um usuário
      tags:
      - iam
  /api/v1/users/{id}/roles:
    put:
      description: "Troca o conjunto inteiro de roles do usuário. Exige `iam.users.manage`\
        \ e o `If-Match`. Cada role acrescentada não pode conceder permissão, escopo\
        \ ou limite acima dos seus (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`); só um administrador\
        \ dá ou tira a role Administrador e gere administradores (403 `ADMINISTRATOR_REQUIRED`);\
        \ o último administrador ativo não perde a role (409 `LAST_ADMINISTRATOR`).\
        \ Role inexistente: 400 `UNKNOWN_ROLE`. Vale na requisição seguinte."
      operationId: setUserRoles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir as roles de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions:
    get:
      description: "Sessões não revogadas e não vencidas, da mais nova para a mais\
        \ antiga. Exige `iam.sessions.manage`; as de um administrador, só outro administrador\
        \ (403 `ADMINISTRATOR_REQUIRED`)."
      operationId: listUserSessions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as sessões ativas de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions/{sessionId}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Exige `iam.sessions.manage`.\
        \ Sessão de outro usuário ou inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeUserSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão de um usuário
      tags:
      - iam
components:
  headers:
    IdempotentReplayed:
      description: '`true` quando a resposta é a guardada de uma requisição anterior
        com a mesma `Idempotency-Key`.'
      schema:
        type: string
        enum:
        - "true"
  parameters:
    IdempotencyKey:
      description: "Identificador único da operação, gerado pelo cliente (um UUID).\
        \ Repetir a mesma requisição com a mesma chave em até 24h devolve a resposta\
        \ guardada, sem executar de novo (com o cabeçalho `Idempotent-Replayed: true`).\
        \ Sem chave: 400 `IDEMPOTENCY_KEY_REQUIRED`; malformada: 400 `IDEMPOTENCY_KEY_INVALID`;\
        \ em andamento: 409 `IDEMPOTENCY_KEY_IN_USE`; usada com outra requisição:\
        \ 422 `IDEMPOTENCY_KEY_REUSED`. A chave vale por usuário."
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        example: 0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
        maxLength: 255
        minLength: 1
        pattern: "^[\\x21-\\x7E]+$"
  schemas:
    AuditEntryResponse:
      type: object
      description: Uma entrada da trilha de auditoria.
      properties:
        action:
          type: string
          description: Código estável da ação.
          example: iam.user.deactivate
        after:
          type: object
          additionalProperties: true
          description: Valores depois da ação. Campos sensíveis saem como `***`.
          nullable: true
        approvalId:
          type: string
          format: uuid
          description: "A aprovação de superior associada, se houver."
          nullable: true
        before:
          type: object
          additionalProperties: true
          description: Valores antes da ação; nulo numa criação. Campos sensíveis
            saem como `***`.
          nullable: true
        deviceSessionId:
          type: string
          format: uuid
          description: "A sessão de dispositivo de onde agiu, se houver."
          nullable: true
        entityId:
          type: string
          nullable: true
        entityType:
          type: string
          description: Tipo da entidade; nulo numa ação sem entidade.
          example: iam.user
          nullable: true
        errorCode:
          type: string
          description: O `code` do erro de uma recusa.
          example: INVALID_CREDENTIALS
          nullable: true
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: Quando a ação aconteceu (UTC).
        outcome:
          type: string
          description: "SUCCEEDED, ou REJECTED para uma recusa registrada (como a\
            \ falha de login)."
          enum:
          - SUCCEEDED
          - REJECTED
        userId:
          type: string
          format: uuid
          description: "Quem agiu; nulo quando foi o sistema (boot, jobs)."
          nullable: true
      required:
      - action
      - id
      - occurredAt
      - outcome
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          description: Senha atual.
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          format: password
          description: "Senha nova, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
      required:
      - currentPassword
      - newPassword
    CreateUserRequest:
      type: object
      properties:
        login:
          type: string
          description: "Login ou e-mail: 3 a 100 caracteres (letras, dígitos e . _\
            \ @ + -); não diferencia maiúsculas."
          example: maria.silva
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          description: "Senha provisória, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
        pin:
          type: string
          format: password
          description: "PIN de aprovação, de 4 a 8 dígitos (opcional)."
          nullable: true
          pattern: "\\d{4,8}"
        roleIds:
          type: array
          description: Roles do usuário (opcional).
          items:
            type: string
            format: uuid
            description: Roles do usuário (opcional).
          maxItems: 50
          minItems: 0
      required:
      - login
      - name
      - password
      - roleIds
    CursorPageAuditEntryResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPagePermissionResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPageRoleResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPageSessionResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    CursorPageUserResponse:
      type: object
      description: Página de resultados paginada por cursor.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        nextCursor:
          type: string
          description: Cursor da próxima página; nulo quando esta é a última.
          nullable: true
      required:
      - items
    DeviceRequest:
      type: object
      description: Dispositivo de onde se entra.
      properties:
        id:
          type: string
          description: "Identificador estável do dispositivo, gerado pelo cliente\
            \ na instalação (um UUID)."
          example: 0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
          maxLength: 100
          minLength: 0
        name:
          type: string
          description: Nome do dispositivo para a lista de sessões.
          example: Celular da recepção
          maxLength: 100
          minLength: 0
      required:
      - id
      - name
    DuplicateRoleRequest:
      type: object
      properties:
        description:
          type: string
          description: "Descrição da role nova; sem ela, a da original."
          maxLength: 500
          minLength: 0
          nullable: true
        name:
          type: string
          description: Nome da role nova.
          maxLength: 100
          minLength: 0
      required:
      - name
    EffectivePermissionResponse:
      type: object
      description: Uma permissão efetiva do usuário corrente.
      properties:
        code:
          type: string
          example: iam.users.manage
        limits:
          type: array
          description: "Por chave, o maior limite entre as roles do usuário."
          items:
            $ref: "#/components/schemas/LimitValueResponse"
        scope:
          type: string
          description: O escopo mais amplo entre as roles do usuário.
          enum:
          - OWN
          - ALL
      required:
      - code
      - limits
      - scope
    FieldViolation:
      type: object
      description: Erro de um campo da requisição.
      properties:
        code:
          type: string
          description: "Código estável: REQUIRED, INVALID_FORMAT, INVALID_VALUE ou\
            \ o nome da restrição em UPPER_SNAKE_CASE (NOT_BLANK, SIZE, MIN, MAX,\
            \ PATTERN etc.)."
          example: NOT_BLANK
        field:
          type: string
          description: Caminho do campo no JSON ou nome do parâmetro.
          example: price
        message:
          type: string
          description: Mensagem em pt-BR.
          example: não deve estar em branco
      required:
      - code
      - field
      - message
    LimitDefinitionResponse:
      type: object
      description: Um parâmetro de limite que a permissão aceita.
      properties:
        description:
          type: string
        key:
          type: string
          description: Chave do limite na concessão.
          example: maxPercent
        unit:
          type: string
          description: "MONEY: reais, até 2 casas; PERCENT: pontos percentuais de\
            \ 0 a 100, até 4 casas; QUANTITY: inteiro."
          enum:
          - MONEY
          - PERCENT
          - QUANTITY
      required:
      - description
      - key
      - unit
    LimitRequest:
      type: object
      description: "O limite de uma chave: um teto (max) ou sem teto (unlimited),\
        \ exatamente um dos dois."
      properties:
        key:
          type: string
          example: maxPercent
          maxLength: 100
          minLength: 0
        max:
          type: string
          description: "O teto, como decimal em string, na unidade do limite."
          example: "10.5"
          nullable: true
          pattern: "\\d{1,14}(\\.\\d{1,4})?"
        unlimited:
          type: boolean
          description: Sem teto.
      required:
      - key
      - unlimited
    LimitValueResponse:
      type: object
      description: "O limite efetivo de uma chave: sem teto ou o teto."
      properties:
        key:
          type: string
          example: maxPercent
        max:
          type: string
          description: "O teto, como decimal em string; nulo quando unlimited."
          example: "10.5"
          nullable: true
        unlimited:
          type: boolean
          description: Sem teto.
      required:
      - key
      - unlimited
    LoginRequest:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/DeviceRequest"
        login:
          type: string
          description: Login ou e-mail; não diferencia maiúsculas.
          example: maria.silva
          maxLength: 100
          minLength: 0
        password:
          type: string
          format: password
          description: Senha.
          maxLength: 128
          minLength: 0
      required:
      - device
      - login
      - password
    MeResponse:
      type: object
      description: "O usuário corrente, as roles ativas e as permissões efetivas."
      properties:
        login:
          type: string
          description: Login normalizado (minúsculo).
        name:
          type: string
        permissions:
          type: array
          description: "Permissões efetivas, em ordem de código."
          items:
            $ref: "#/components/schemas/EffectivePermissionResponse"
        roles:
          type: array
          description: "Roles ativas atribuídas ao usuário, em ordem de nome."
          items:
            $ref: "#/components/schemas/MeRoleResponse"
        sessionId:
          type: string
          format: uuid
          description: Sessão de dispositivo do access token desta requisição.
        userId:
          type: string
          format: uuid
      required:
      - login
      - name
      - permissions
      - roles
      - sessionId
      - userId
    MeRoleResponse:
      type: object
      description: Uma role ativa do usuário.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    PermissionResponse:
      type: object
      description: Uma permissão do catálogo.
      properties:
        code:
          type: string
          description: "Código estável da permissão: o módulo e a ação."
          example: iam.users.manage
        description:
          type: string
          description: Descrição para a tela de roles.
        limits:
          type: array
          description: Parâmetros de limite que uma concessão aceita.
          items:
            $ref: "#/components/schemas/LimitDefinitionResponse"
        module:
          type: string
          description: Módulo dono da permissão.
          example: iam
        scopes:
          type: array
          description: "Escopos que uma concessão pode ter: OWN (só os próprios registros)\
            \ e ALL."
          items:
            type: string
            description: "Escopos que uma concessão pode ter: OWN (só os próprios\
              \ registros) e ALL."
            enum:
            - OWN
            - ALL
        sensitive:
          type: boolean
          description: "Ação sensível: sem a permissão, exige aprovação de superior\
            \ (RF-ACS-08)."
      required:
      - code
      - description
      - limits
      - module
      - scopes
      - sensitive
    Problem:
      type: object
      description: Problema RFC 9457 (application/problem+json).
      properties:
        code:
          type: string
          description: "Código estável do erro, para o cliente traduzir. Comuns: VALIDATION_FAILED,\
            \ MALFORMED_REQUEST, INVALID_CURSOR, UNAUTHENTICATED, ACCESS_DENIED, PASSWORD_CHANGE_REQUIRED,\
            \ NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, CONFLICT, PRECONDITION_FAILED,\
            \ PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, BUSINESS_RULE_VIOLATED, PRECONDITION_REQUIRED,\
            \ IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_IN_USE,\
            \ IDEMPOTENCY_KEY_REUSED, REQUEST_REJECTED, INTERNAL_ERROR, SERVICE_UNAVAILABLE.\
            \ Cada módulo acrescenta os seus."
          example: VALIDATION_FAILED
          pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
        detail:
          type: string
          description: "Explicação em pt-BR, para o usuário."
        errors:
          type: array
          description: Erros por campo; presente nos erros de validação.
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: Caminho da requisição.
        status:
          type: integer
          format: int32
          description: Status HTTP.
          example: 400
        title:
          type: string
          description: "Frase do status HTTP, em pt-BR."
          example: Requisição inválida
        type:
          type: string
          format: uri
          description: Tipo do problema; ausente equivale a about:blank.
          example: about:blank
      required:
      - code
      - status
      - title
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: "Refresh token da sessão, recebido no login ou no último refresh."
          maxLength: 200
          minLength: 0
      required:
      - refreshToken
    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          format: password
          description: "Senha provisória, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
      required:
      - newPassword
    ResetPinRequest:
      type: object
      properties:
        newPin:
          type: string
          format: password
          description: "PIN de aprovação, de 4 a 8 dígitos."
          minLength: 1
          pattern: "\\d{4,8}"
      required:
      - newPin
    RoleGrantRequest:
      type: object
      description: O conjunto completo das concessões da role.
      properties:
        limits:
          type: array
          description: "Limites, só das chaves que a permissão declara; chave omitida\
            \ vale teto zero."
          items:
            $ref: "#/components/schemas/LimitRequest"
          maxItems: 20
          minItems: 0
        permission:
          type: string
          description: Código de uma permissão do catálogo (`GET /permissions`).
          example: iam.users.read
          maxLength: 100
          minLength: 0
        scope:
          type: string
          description: Um dos escopos que a permissão suporta.
          enum:
          - OWN
          - ALL
      required:
      - limits
      - permission
      - scope
    RoleGrantResponse:
      type: object
      description: "Uma concessão: a permissão, o escopo e os limites."
      properties:
        limits:
          type: array
          description: Por chave declarada; uma chave sem valor vale teto zero.
          items:
            $ref: "#/components/schemas/LimitValueResponse"
        permission:
          type: string
          example: iam.users.read
        scope:
          type: string
          enum:
          - OWN
          - ALL
      required:
      - limits
      - permission
      - scope
    RoleRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 500
          minLength: 0
        grants:
          type: array
          description: O conjunto completo das concessões da role.
          items:
            $ref: "#/components/schemas/RoleGrantRequest"
          maxItems: 500
          minItems: 0
        name:
          type: string
          description: "Único, sem diferenciar maiúsculas."
          example: Recepção noturna
          maxLength: 100
          minLength: 0
      required:
      - description
      - grants
      - name
    RoleResponse:
      type: object
      description: "Uma role: um conjunto de concessões de permissões do catálogo."
      properties:
        active:
          type: boolean
          description: Role inativa não concede nada.
        createdAt:
          type: string
          format: date-time
        customized:
          type: boolean
          description: Se a role de modelo foi editada (não recebe mais as sugestões
            do catálogo).
        description:
          type: string
        grants:
          type: array
          description: "Concessões de permissões vigentes, em ordem de código."
          items:
            $ref: "#/components/schemas/RoleGrantResponse"
        id:
          type: string
          format: uuid
        name:
          type: string
        systemRole:
          type: boolean
          description: "A role de sistema Administrador: todas as permissões, sem\
            \ edição."
        template:
          type: string
          description: "Modelo da SPEC §3.1 de onde a role veio, se veio de um."
          enum:
          - ADMINISTRATOR
          - MANAGER
          - RECEPTIONIST
          - HOUSEKEEPER
          - ROOM_ATTENDANT
          - MAINTENANCE
          - WAITER
          - FNB_CASHIER
          - KITCHEN_BAR
          - SALES_EVENTS
          - STOREKEEPER
          - FINANCE
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - createdAt
      - customized
      - description
      - grants
      - id
      - name
      - systemRole
      - updatedAt
    ServerVersionResponse:
      type: object
      properties:
        apiVersion:
          type: string
          description: "Versão da API, igual ao prefixo das rotas."
          example: v1
        application:
          type: string
          description: Nome da aplicação.
          example: zeny-hotel-manager
        version:
          type: string
          description: Versão do servidor (build).
          example: 1.4.0
      required:
      - apiVersion
      - application
      - version
    SessionResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Se é a sessão do access token desta requisição.
        deviceId:
          type: string
        deviceName:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Até quando a sessão renova sem uso.
        id:
          type: string
          format: uuid
        lastSeenAt:
          type: string
          format: date-time
      required:
      - createdAt
      - current
      - deviceId
      - deviceName
      - expiresAt
      - id
      - lastSeenAt
    SetUserRolesRequest:
      type: object
      properties:
        roleIds:
          type: array
          description: O conjunto completo de roles do usuário.
          items:
            type: string
            format: uuid
            description: O conjunto completo de roles do usuário.
          maxItems: 50
          minItems: 0
      required:
      - roleIds
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Access token JWT (RS256), válido até accessTokenExpiresAt\
            \ (15 min)."
        accessTokenExpiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
          description: Se o usuário precisa trocar a senha antes de usar a API.
        refreshToken:
          type: string
          description: "Refresh token opaco da sessão. Vale uma vez: use o novo de\
            \ cada resposta. Guarde-o só no armazenamento seguro do dispositivo."
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Até quando a sessão renova sem uso (30 dias depois do último
            refresh).
        sessionId:
          type: string
          format: uuid
        tokenType:
          type: string
          description: "Tipo do access token, para o cabeçalho Authorization."
          example: Bearer
        userId:
          type: string
          format: uuid
      required:
      - accessToken
      - accessTokenExpiresAt
      - passwordChangeRequired
      - refreshToken
      - refreshTokenExpiresAt
      - sessionId
      - tokenType
      - userId
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - name
    UserResponse:
      type: object
      description: Um usuário do sistema. Senha e PIN nunca saem.
      properties:
        active:
          type: boolean
        administrator:
          type: boolean
          description: Se o usuário tem a role de sistema Administrador.
        createdAt:
          type: string
          format: date-time
        hasPin:
          type: boolean
          description: Se o usuário tem PIN de aprovação.
        id:
          type: string
          format: uuid
        lockedUntil:
          type: string
          format: date-time
          description: Até quando o login está bloqueado por tentativas erradas.
          nullable: true
        login:
          type: string
          description: Login normalizado (minúsculo).
        name:
          type: string
        passwordChangeRequired:
          type: boolean
          description: Se o usuário precisa trocar a senha no próximo login.
        roles:
          type: array
          description: "Roles atribuídas, ativas ou não, em ordem de nome."
          items:
            $ref: "#/components/schemas/UserRoleResponse"
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - administrator
      - createdAt
      - hasPin
      - id
      - login
      - name
      - passwordChangeRequired
      - roles
      - updatedAt
    UserRoleResponse:
      type: object
      description: Uma role atribuída a um usuário.
      properties:
        active:
          type: boolean
          description: Role inativa não concede nada.
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - active
      - id
      - name
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token JWT (RS256) de `POST /api/v1/auth/login` ou `POST\
        \ /api/v1/auth/refresh`, válido por 15 min. Enquanto a troca de senha estiver\
        \ pendente, só `POST /api/v1/auth/password` e `POST /api/v1/auth/logout` respondem;\
        \ o resto devolve 403 `PASSWORD_CHANGE_REQUIRED`."
      scheme: bearer
      type: http
