    ItemActionDto:
      type: object
      description: "Ação vinculada ao item (RF-CHK-05), com os parâmetros do tipo\
        \ e nenhum outro. `CONSUME_STOCK` (`stockItemId`, `defaultQuantity` opcional)\
        \ e `LINEN_EXCHANGE` (`linenTypeId`, `movement`) só num item `QUANTITY`; `OPEN_OCCURRENCE`\
        \ (`occurrenceKind`, `category` opcional) só num item `CHECK`, quando a resposta\
        \ é `NOT_OK`. Os IDs são de outros módulos e não são conferidos."
      properties:
        category:
          type: string
          description: "Categoria da ocorrência, do módulo que a trata: letras, dí\
            gitos, `_` e `-`, até 40."
          example: PLUMBING
          nullable: true
        defaultQuantity:
          type: number
          description: "Quantidade sugerida na baixa: maior que zero, até 999999,\
            \ até 3 casas."
          example: 2
          nullable: true
        linenTypeId:
          type: string
          format: uuid
          description: Tipo de enxoval da troca.
          nullable: true
        movement:
          type: string
          description: O que a quantidade respondida representa na troca de enxoval.
          enum:
          - REMOVED
          - PLACED
          nullable: true
        occurrenceKind:
          type: string
          description: O que a ocorrência gera.
          enum:
          - MAINTENANCE
          - LOST_AND_FOUND
          - DAMAGE
          nullable: true
        stockItemId:
          type: string
          format: uuid
          description: Insumo da baixa de estoque.
          nullable: true
        type:
          type: string
          enum:
          - CONSUME_STOCK
          - LINEN_EXCHANGE
          - OPEN_OCCURRENCE
      required:
      - type
    ItemConditionDto:
      type: object
      description: "O item só aparece se o item `itemKey`, anterior a este, tiver\
        \ a resposta `answer`: num item de marcação, `OK`, `NOT_OK` ou `NOT_APPLICABLE`;\
        \ num de escolha, o valor de uma das opções (na escolha múltipla, basta a\
        \ opção estar marcada)."
      nullable: true
      properties:
        answer:
          type: string
          example: NOT_OK
        itemKey:
          type: string
          example: shower
      required:
      - answer
      - itemKey
    LimitDefinitionResponse:
