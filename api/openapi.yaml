      summary: Editar uma UH
      tags:
      - rooms
  /api/v1/rooms/{id}/deactivate:
    post:
      description: "Exige `rooms.registry.manage`. Nada é apagado: o cadastro, o nú\
        mero e o histórico ficam, e a UH sai das listas de UHs ativas. Desativar de\
        \ novo não muda nada."
      operationId: deactivateRoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma UH
      tags:
      - rooms
  /api/v1/rooms/{id}/housekeeping-observations:
    post:
      description: "A ocupação encontrada e, se contou, o número de pessoas (só com\
        \ a UH ocupada; vazia com número: 400 `GUEST_COUNT_INVALID`). Comparada com\
        \ a recepção, mostra as discrepâncias (RF-UH-08). Exige `rooms.status.observe`;\
        \ UH desativada: 422 `ROOM_INACTIVE`."
      operationId: recordRoomHousekeepingObservation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingObservationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingObservationResponse"
          description: Observação registrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Registrar o que a governança encontrou na UH
      tags:
      - rooms
  /api/v1/rooms/{id}/housekeeping-status:
    post:
      description: "Só as transições da SPEC §8.4: Sujo → Limpo (`MARK_CLEAN`, com\
        \ `requiresInspection` para deixar a inspeção pendente), Limpo → Inspecionado\
        \ (`MARK_INSPECTED`), Limpo com inspeção pendente → Sujo (`REJECT_INSPECTION`)\
        \ e Limpo ou Inspecionado → Sujo (`MARK_DIRTY`); as outras: 422 `HOUSEKEEPING_TRANSITION_NOT_ALLOWED`.\
        \ Repetir o estado atual não muda nada. Exige `rooms.status.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Fica no histórico com a origem `MANUAL`\
        \ (RN-08)."
      operationId: changeRoomHousekeepingStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Mudar à mão o status de governança
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order:
    post:
      description: "Abre um período de até 365 dias que não começa antes da data operacional\
        \ (422 `OUT_OF_ORDER_PERIOD_IN_PAST`), numa UH ativa (422 `ROOM_INACTIVE`),\
        \ sem sobrepor outro período da UH (409 `OUT_OF_ORDER_OVERLAP`). OOO não se\
        \ aplica a UH ocupada se o período inclui a data operacional (RN-07, 422 `OUT_OF_ORDER_ROOM_OCCUPIED`);\
        \ OOS sim. OOO exige `rooms.outoforder.manage` ou a aprovação de um superior\
        \ (ação `rooms.out-of-order.open`, recurso `rooms.room:<id da UH>`); OOS,\
        \ `rooms.outofservice.manage`. Não muda o status de governança. Publica `OutOfOrderChanged`."
      operationId: openOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenOutOfOrderRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: Período aberto.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Colocar a UH em OOO ou OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order/{periodId}:
    get:
      description: "Com o `ETag`, para a edição. Exige `rooms.outoforder.read`. Inexistente\
        \ ou de outra UH: 404 `OUT_OF_ORDER_NOT_FOUND`."
      operationId: getOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um período OOO/OOS
      tags:
      - rooms
    put:
      description: "Troca o período, o motivo, o responsável e o status de retorno;\
        \ o tipo não muda (libere e abra outro). Exige o `If-Match` (ausente: 428;\
        \ versão diferente: 412). Um início ou fim alterado não fica antes da data\
        \ operacional (422 `OUT_OF_ORDER_PERIOD_IN_PAST`); período liberado: 422 `OUT_OF_ORDER_RELEASED`;\
        \ sobreposição: 409 `OUT_OF_ORDER_OVERLAP`; OOO que passa a incluir a data\
        \ operacional numa UH ocupada: 422 `OUT_OF_ORDER_ROOM_OCCUPIED`. OOO exige\
        \ `rooms.outoforder.manage` ou aprovação (ação `rooms.out-of-order.update`,\
        \ recurso `rooms.out-of-order:<id>`). Publica `OutOfOrderChanged`."
      operationId: updateOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutOfOrderRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Alterar um período OOO/OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/out-of-order/{periodId}/release:
    post:
      description: "Libera na data operacional: a UH deixa de estar bloqueada a partir\
        \ dela. Se o período estava em vigor, a UH volta ao status de governança de\
        \ retorno, com o histórico (origem `MANUAL`); um período que ainda não começ\
        ou é cancelado, e um que já terminou só é encerrado, sem mudar o status. Liberar\
        \ de novo não muda nada. OOO exige `rooms.outoforder.manage` ou aprovação\
        \ (ação `rooms.out-of-order.release`, recurso `rooms.out-of-order:<id>`);\
        \ OOS, `rooms.outofservice.manage`. Publica `OutOfOrderChanged`."
      operationId: releaseOutOfOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: periodId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfOrderResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Liberar um período OOO/OOS
      tags:
      - rooms
  /api/v1/rooms/{id}/reactivate:
    post:
      description: Exige `rooms.registry.manage` e o tipo da UH ativo (422 `ROOM_TYPE_INACTIVE`).
      operationId: reactivateRoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma UH
      tags:
      - rooms
  /api/v1/rooms/{id}/service-flag:
    post:
      description: "Não perturbe ou arrumar agora, só numa UH ocupada (422 `ROOM_NOT_OCCUPIED`);\
        \ `NONE` retira a sinalização. Definir o valor atual não muda nada. Exige\
        \ `rooms.status.flag`. A UH ficar vaga também retira a sinalização."
      operationId: setRoomServiceFlag
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceFlagRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Registrar a sinalização do hóspede
      tags:
      - rooms
  /api/v1/rooms/{id}/status:
    get:
      description: "Com o `ETag` da UH (o mesmo do cadastro), para a mudança manual.\
        \ Exige `rooms.status.read`. Inexistente: 404 `ROOM_NOT_FOUND`."
      operationId: getRoomStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatusResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o status de uma UH
      tags:
      - rooms
  /api/v1/rooms/{id}/status-history:
    get:
      description: "Um registro por campo que mudou, das mudanças mais recentes à\
        s mais antigas, com quem (`changedBy` nulo = o sistema), quando e a origem\
        \ (RF-UH-06). Exige `rooms.status.read`."
      operationId: listRoomStatusHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageRoomStatusChangeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Histórico de status de uma UH
      tags:
      - rooms
  /api/v1/schedule:
    get:
      description: "As entradas de `from` a `to` (no máximo 92 dias; sem `from`, a\
        \ data operacional; sem `to`, o próprio `from`), em ordem de data, opcionalmente\
        \ de um setor (o do turno, ou o do colaborador nas ausências) ou de um colaborador.\
        \ Exige `staff.schedule.read`; com escopo `OWN`, só as do colaborador vinculado\
        \ ao usuário. Período inválido: 400 `SCHEDULE_PERIOD_INVALID`."
      operationId: listScheduleEntries
      parameters:
      - description: "Primeira data (YYYY-MM-DD); padrão: a data operacional."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data, inclusive (YYYY-MM-DD); padrão: `from`."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - description: Só as entradas deste setor.
        in: query
        name: departmentId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as entradas deste colaborador.
        in: query
        name: employeeId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageScheduleEntryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar a escala
      tags:
      - staff
  /api/v1/schedule-patterns:
    get:
      description: "Em ordem de criação, opcionalmente de um colaborador. Exige `staff.schedule.read`;\
        \ com escopo `OWN`, só os do colaborador vinculado ao usuário."
      operationId: listSchedulePatterns
      parameters:
      - description: Só os padrões deste colaborador.
        in: query
        name: employeeId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar padrões de escala
      tags:
      - staff
    post:
      description: "Exige `staff.schedule.manage`. 12x36: um dia sim, um não, a partir\
        \ de `startsOn`; 6x1: seis dias de trabalho e um de folga, a partir de `startsOn`;\
        \ fixo: os `weekdays` (obrigatórios só nele). Fim antes do início ou dias\
        \ da semana incoerentes: 400 `SCHEDULE_PATTERN_INVALID`. Colaborador ou turno\
        \ inexistente: 400 `UNKNOWN_EMPLOYEE`/`UNKNOWN_SHIFT`; colaborador desativado:\
        \ 422 `EMPLOYEE_INACTIVE`; outro padrão ativo do colaborador no período: 409\
        \ `SCHEDULE_PATTERN_OVERLAP`. A escala só muda ao gerar (`POST /schedule/generate`)."
      operationId: createSchedulePattern
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchedulePatternRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: Padrão criado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar um padrão de escala
      tags:
      - staff
  /api/v1/schedule-patterns/{id}:
    get:
      description: "Exige `staff.schedule.read`. Inexistente (ou de outro colaborador,\
        \ com escopo `OWN`): 404 `SCHEDULE_PATTERN_NOT_FOUND`."
      operationId: getSchedulePattern
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um padrão de escala
      tags:
      - staff
    put:
      description: "Troca tipo, turno, período e dias da semana (o colaborador nã\
        o muda), com as regras da criação. Exige `staff.schedule.manage` e o `If-Match`\
        \ (ausente: 428; versão diferente: 412). Padrão desativado: 422 `SCHEDULE_PATTERN_INACTIVE`.\
        \ As entradas já geradas só mudam na próxima geração."
      operationId: updateSchedulePattern
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePatternRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um padrão de escala
      tags:
      - staff
  /api/v1/schedule-patterns/{id}/deactivate:
    post:
      description: Exige `staff.schedule.manage`. O padrão deixa de gerar entradas;
        as que ele gerou saem na próxima geração do período. Desativar de novo não
        muda nada.
      operationId: deactivateSchedulePattern
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePatternResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um padrão de escala
      tags:
      - staff
  /api/v1/schedule/entries:
    post:
      description: "Lança, em cada data de `from` a `to` (no máximo 92 dias), um turno\
        \ (`SHIFT`), uma troca (`SWAP`), uma folga (`DAY_OFF`), uma falta (`ABSENCE`)\
        \ ou férias (`VACATION`) do colaborador. Turno e troca exigem `shiftId`; folga,\
        \ falta e férias não o aceitam (400 `SCHEDULE_ENTRY_INVALID`). A entrada de\
        \ cada data, gerada ou lançada antes, passa a ser esta e a geração não a toca\
        \ mais. Colaborador ou turno inexistente: 400 `UNKNOWN_EMPLOYEE`/`UNKNOWN_SHIFT`;\
        \ colaborador desativado: 422 `EMPLOYEE_INACTIVE`. Exige `staff.schedule.manage`."
      operationId: recordScheduleEntries
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordScheduleEntriesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEntriesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Lançar atribuição ou exceção na escala
      tags:
      - staff
  /api/v1/schedule/generate:
    post:
      description: "Para o período (no máximo 92 dias, começando na data operacional\
        \ ou depois: 422 `SCHEDULE_PERIOD_IN_PAST`), opcionalmente só dos colaboradores\
        \ de um setor ou de um colaborador: cria as entradas que os padrões ativos\
        \ dos colaboradores ativos pedem, refaz as geradas que mudaram e retira as\
        \ geradas que nenhum padrão pede mais. As lançadas à mão (atribuição, troca,\
        \ folga, falta, férias) nunca são sobrescritas. Gerar de novo sem mudança\
        \ não faz nada. Exige `staff.schedule.manage`."
      operationId: generateSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScheduleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Gerar a escala a partir dos padrões
      tags:
      - staff
  /api/v1/shifts:
    get:
      description: "Em ordem de criação, opcionalmente de um setor. Exige `staff.employees.read`."
      operationId: listShifts
