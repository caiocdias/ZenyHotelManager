              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Definir as roles de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions:
    get:
      description: "Sessões não revogadas e não vencidas, da mais nova para a mais\
        \ antiga. Exige `iam.sessions.manage`; as de um administrador, só outro administrador\
        \ (403 `ADMINISTRATOR_REQUIRED`)."
      operationId: listUserSessions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as sessões ativas de um usuário
      tags:
      - iam
  /api/v1/users/{id}/sessions/{sessionId}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Exige `iam.sessions.manage`.\
        \ Sessão de outro usuário ou inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeUserSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão de um usuário
      tags:
      - iam
components:
  headers:
    IdempotentReplayed:
      description: '`true` quando a resposta é a guardada de uma requisição anterior
        com a mesma `Idempotency-Key`.'
      schema:
        type: string
        enum:
        - "true"
  parameters:
    ApprovalToken:
      description: "Token de aprovação de superior (step-up), de `POST /api/v1/auth/approvals`,\
        \ para repetir a requisição recusada com 403 `APPROVAL_REQUIRED`. Vale uma\
        \ vez, por 2 min, só para a mesma ação, permissão, recurso e valor de limite,\
        \ pedida pelo mesmo usuário na mesma sessão. Ignorado quando o usuário já\
        \ tem a permissão. A ação concluída fica na auditoria com a aprovação (solicitante,\
        \ aprovador e motivo)."
      in: header
      name: X-Approval-Token
      required: false
      schema:
        type: string
        maxLength: 200
        minLength: 1
    IdempotencyKey:
      description: "Identificador único da operação, gerado pelo cliente (um UUID).\
        \ Repetir a mesma requisição com a mesma chave em até 24h devolve a resposta\
        \ guardada, sem executar de novo (com o cabeçalho `Idempotent-Replayed: true`).\
        \ Sem chave: 400 `IDEMPOTENCY_KEY_REQUIRED`; malformada: 400 `IDEMPOTENCY_KEY_INVALID`;\
        \ em andamento: 409 `IDEMPOTENCY_KEY_IN_USE`; usada com outra requisição:\
        \ 422 `IDEMPOTENCY_KEY_REUSED`. A chave vale por usuário."
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        example: 0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
        maxLength: 255
        minLength: 1
        pattern: "^[\\x21-\\x7E]+$"
  schemas:
    AddressDto:
      type: object
      description: Endereço no Brasil com o código IBGE do município.
      properties:
        city:
          type: string
          maxLength: 100
          minLength: 0
        complement:
          type: string
          maxLength: 100
          minLength: 0
          nullable: true
        district:
          type: string
          maxLength: 100
          minLength: 0
        ibgeCityCode:
          type: string
          description: "Código IBGE do município (7 dígitos, os 2 primeiros da UF)."
          example: "3550308"
          pattern: "\\d{7}"
        number:
          type: string
          maxLength: 20
          minLength: 0
        postalCode:
          type: string
          description: "CEP, com ou sem hífen; volta só com os 8 dígitos."
          example: 01310-100
          pattern: "\\d{5}-?\\d{3}"
        state:
          type: string
          enum:
          - RO
          - AC
          - AM
          - RR
          - PA
          - AP
          - TO
          - MA
          - PI
          - CE
          - RN
          - PB
          - PE
          - AL
          - SE
          - BA
          - MG
          - ES
          - RJ
          - SP
          - PR
          - SC
          - RS
          - MS
          - MT
          - GO
          - DF
        street:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - city
      - district
      - ibgeCityCode
      - number
      - postalCode
      - state
      - street
    ApplicabilityRuleDto:
      type: object
      description: "Regra de aplicabilidade: o modelo vale para o sujeito quando cada\
        \ lista não vazia contém o atributo dele (lista vazia: o critério não restringe).\
        \ Ao menos uma lista não vazia. Os IDs são de outros módulos e não são conferidos."
      properties:
        areaIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        cleaningTypeIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        roomTypeIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
      required:
      - areaIds
      - assetIds
      - cleaningTypeIds
      - roomTypeIds
    ApprovalLimitRequest:
      type: object
      description: O valor pedido de um limite da permissão.
      nullable: true
      properties:
        amount:
          type: string
          format: decimal
          description: "Valor decimal, como no problema."
          example: "15"
          minLength: 1
          pattern: "^\\d{1,14}(\\.\\d{1,4})?$"
        key:
          type: string
          example: maxPercent
          maxLength: 100
          minLength: 0
      required:
      - amount
      - key
    ApprovalRequest:
      type: object
      description: Pedido de aprovação de uma ação sensível recusada com 403 `APPROVAL_REQUIRED`.
      properties:
        action:
          type: string
          description: '`action` do problema `APPROVAL_REQUIRED`.'
          example: iam.user.deactivate
          maxLength: 100
          minLength: 0
          pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9-]*)+$"
        approverLogin:
          type: string
          description: Login do aprovador; não diferencia maiúsculas.
          example: joana.gerente
          maxLength: 100
          minLength: 0
        approverPin:
          type: string
          format: password
          description: PIN do aprovador (4 a 8 dígitos).
          minLength: 1
          pattern: "\\d{4,8}"
        limit:
          allOf:
          - $ref: "#/components/schemas/ApprovalLimitRequest"
          nullable: true
        permission:
          type: string
          description: '`permission` do problema `APPROVAL_REQUIRED`.'
          example: iam.users.manage
          maxLength: 100
          minLength: 0
        reason:
          type: string
          description: "Motivo da aprovação, para a trilha de auditoria."
          example: Cortesia da gerência
          maxLength: 500
          minLength: 0
        resourceRef:
          type: string
          description: '`resourceRef` do problema `APPROVAL_REQUIRED`.'
          example: iam.user:0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
          maxLength: 200
          minLength: 0
      required:
      - action
      - approverLogin
      - approverPin
      - permission
      - reason
      - resourceRef
    ApprovalResponse:
      type: object
      description: "Aprovação concedida: o token vai no cabeçalho `X-Approval-Token`\
        \ da requisição repetida."
      properties:
        approvalId:
          type: string
          format: uuid
        approvalToken:
          type: string
          description: "Token opaco de uso único. Não guarde: use na requisição repetida,\
            \ em até 2 min."
        approverId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Até quando o token vale (2 min depois da aprovação).
      required:
      - approvalId
      - approvalToken
      - approverId
      - expiresAt
    AreaRequest:
      type: object
      description: Dados de uma área comum.
      properties:
        description:
          type: string
          maxLength: 500
          minLength: 0
          nullable: true
        kind:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
        name:
          type: string
          example: Piscina
          maxLength: 80
          minLength: 0
      required:
      - kind
      - name
    AreaResponse:
      type: object
      description: Uma área comum.
      properties:
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - active
      - createdAt
      - id
      - kind
      - name
      - updatedAt
    AuditEntryResponse:
      type: object
      description: Uma entrada da trilha de auditoria.
      properties:
        action:
          type: string
          description: Código estável da ação.
          example: iam.user.deactivate
        after:
          type: object
          additionalProperties: true
          description: Valores depois da ação. Campos sensíveis saem como `***`.
          nullable: true
        approvalId:
          type: string
          format: uuid
          description: "A aprovação de superior associada, se houver."
          nullable: true
        before:
          type: object
          additionalProperties: true
          description: Valores antes da ação; nulo numa criação. Campos sensíveis
            saem como `***`.
          nullable: true
        deviceSessionId:
          type: string
          format: uuid
          description: "A sessão de dispositivo de onde agiu, se houver."
          nullable: true
        entityId:
          type: string
          nullable: true
        entityType:
          type: string
          description: Tipo da entidade; nulo numa ação sem entidade.
          example: iam.user
          nullable: true
        errorCode:
          type: string
          description: O `code` do erro de uma recusa.
          example: INVALID_CREDENTIALS
          nullable: true
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: Quando a ação aconteceu (UTC).
        outcome:
          type: string
          description: "SUCCEEDED, ou REJECTED para uma recusa registrada (como a\
            \ falha de login)."
          enum:
          - SUCCEEDED
          - REJECTED
        userId:
          type: string
          format: uuid
          description: "Quem agiu; nulo quando foi o sistema (boot, jobs)."
          nullable: true
      required:
      - action
      - id
      - occurredAt
      - outcome
    BusinessDateResponse:
      type: object
      description: A data operacional corrente do hotel.
      properties:
        businessDate:
          type: string
          format: date
          description: Data de negócio a que lançamentos e diárias se referem (YYYY-MM-DD).
        timezone:
          type: string
          description: "Fuso do hotel (IANA), onde os instantes em UTC são exibidos."
          example: America/Sao_Paulo
      required:
      - businessDate
      - timezone
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          description: Senha atual.
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          format: password
          description: "Senha nova, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
      required:
      - currentPassword
      - newPassword
    ChecklistAnswerDto:
      type: object
      description: "Uma resposta: a chave do item e só o campo do tipo dele — `check`\
        \ (CHECK), `quantity` (QUANTITY, de 0 a 999999, até 3 casas), `number` (NUMBER,\
        \ até 4 casas), `text` (TEXT, até 2000), `choice` (SINGLE_CHOICE), `choices`\
        \ (MULTI_CHOICE) ou `photoFileId` (PHOTO: um anexo da finalidade `checklists.photo`\
        \ enviado pelo executor) — e a observação opcional (até 500)."
      properties:
        check:
          type: string
          enum:
          - OK
          - NOT_OK
          - NOT_APPLICABLE
          nullable: true
        choice:
          type: string
          maxLength: 40
          minLength: 0
          nullable: true
        choices:
          type: array
          items:
            type: string
            nullable: true
          maxItems: 50
          minItems: 0
          nullable: true
        itemKey:
          type: string
          example: towels
          maxLength: 40
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
          nullable: true
        number:
          type: number
          example: 4.5
          nullable: true
        photoFileId:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: number
          example: 2
          nullable: true
        text:
          type: string
          maxLength: 2000
          minLength: 0
          nullable: true
      required:
      - itemKey
    ChecklistAnswerResponse:
      type: object
      description: Uma resposta gravada.
      properties:
        answeredAt:
          type: string
          format: date-time
          description: "Quando a resposta foi dada (offline, o horário do dispositivo\
            \ corrigido)."
        check:
          type: string
          enum:
          - OK
          - NOT_OK
          - NOT_APPLICABLE
          nullable: true
        choice:
          type: string
          nullable: true
        choices:
          type: array
          items:
            type: string
        itemKey:
          type: string
        itemType:
          type: string
          enum:
          - CHECK
          - QUANTITY
          - NUMBER
          - TEXT
          - SINGLE_CHOICE
          - MULTI_CHOICE
          - PHOTO
        note:
          type: string
          nullable: true
        number:
          type: number
          nullable: true
        photoFileId:
          type: string
          format: uuid
          nullable: true
        photoMissing:
          type: boolean
          description: "A foto citada offline não ficou com a resposta: ainda não\
            \ tinha chegado ou não servia (outra finalidade, outro autor ou outro\
            \ registro). Conta como respondida num item de foto obrigatório."
        quantity:
          type: number
          nullable: true
        text:
          type: string
          nullable: true
      required:
      - answeredAt
      - choices
      - itemKey
      - itemType
      - photoMissing
    ChecklistExecutionResponse:
      type: object
      description: Uma execução de checklist com as respostas e o conteúdo da versão
        usada.
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistAnswerResponse"
        checklistVersion:
          allOf:
          - $ref: "#/components/schemas/ChecklistVersionResponse"
          nullable: true
        execution:
          $ref: "#/components/schemas/ChecklistExecutionSummaryResponse"
      required:
      - answers
      - execution
    ChecklistExecutionSummaryResponse:
      type: object
      description: "Uma execução de checklist na listagem, sem as respostas."
      properties:
        businessDate:
          type: string
          format: date
          description: A data operacional da rotina.
          nullable: true
        candidateIds:
          type: array
          description: Os candidatos escalados da rotina (H14).
          items:
            type: string
            format: uuid
            description: Os candidatos escalados da rotina (H14).
        completedAt:
          type: string
          format: date-time
          description: "Fim real (offline, o horário do dispositivo corrigido)."
          nullable: true
        context:
          type: string
          enum:
          - HOUSEKEEPING
          - INSPECTION
          - MAINTENANCE
          - COMMON_AREA
          - RESTAURANT
          - EVENT
          - OTHER
        createdAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: O horário previsto da rotina.
          nullable: true
        duplicateOf:
          type: string
          format: uuid
          description: "A execução offline de uma rotina já assumida por outra pessoa\
            \ fica à parte, ligada à original (RN-22)."
          nullable: true
        executorId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        offline:
          type: boolean
          description: Iniciada ou concluída por comando offline.
        routineId:
          type: string
          format: uuid
          description: A rotina que gerou a execução.
          nullable: true
        startedAt:
          type: string
          format: date-time
          description: "Início real (offline, o horário do dispositivo corrigido)."
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
        subject:
          allOf:
          - $ref: "#/components/schemas/ChecklistSubjectDto"
          nullable: true
        templateId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Versão do registro (a mesma do `ETag` do detalhe).
        versionId:
          type: string
          format: uuid
          description: A versão usada; nula na pendente de uma rotina.
          nullable: true
        versionNumber:
          type: integer
          format: int32
          nullable: true
      required:
      - candidateIds
      - context
      - createdAt
      - id
      - offline
      - status
      - templateId
      - updatedAt
      - version
    ChecklistItemDto:
      type: object
      description: Um item (pergunta) do checklist.
      properties:
        actions:
          type: array
          description: "Ações executadas ao concluir o checklist (RF-CHK-05), até\
            \ 5."
          items:
            $ref: "#/components/schemas/ItemActionDto"
          maxItems: 5
          minItems: 0
        key:
          type: string
          description: "Chave do item no modelo: minúsculas, dígitos, `_` e `-`, até\
            \ 40, única no modelo. Fica igual entre as versões para identificar o\
            \ mesmo item; as condições a citam."
          example: towels
        label:
          type: string
          description: Até 200 caracteres.
          example: Toalhas repostas
        options:
          type: array
          description: "Só nos itens de escolha (`SINGLE_CHOICE`, `MULTI_CHOICE`):\
            \ de 2 a 50."
          items:
            $ref: "#/components/schemas/ChoiceOptionDto"
          maxItems: 50
          minItems: 0
        required:
          type: boolean
          description: Obrigatório quando aparece. Padrão `false` para todos os tipos
            (a foto nunca é exigida por padrão).
        type:
          type: string
          enum:
          - CHECK
          - QUANTITY
          - NUMBER
          - TEXT
          - SINGLE_CHOICE
          - MULTI_CHOICE
          - PHOTO
        unit:
          type: string
          description: "Só em `QUANTITY` e `NUMBER`: até 20 caracteres."
          example: °C
          nullable: true
        visibleWhen:
          allOf:
          - $ref: "#/components/schemas/ItemConditionDto"
          nullable: true
      required:
      - actions
      - key
      - label
      - options
      - required
      - type
    ChecklistRoutineRequest:
      type: object
      description: "Uma rotina (RF-CHK-08): o modelo, o setor, a frequência (`DAILY`,\
        \ sem dias; `WEEKLY`, com os dias da semana), o horário (horas e minutos,\
        \ no fuso do hotel) e o local opcional."
      properties:
        departmentId:
          type: string
          format: uuid
          nullable: true
        dueAt:
          type: string
          example: 06:00
          nullable: true
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          nullable: true
        location:
          allOf:
          - $ref: "#/components/schemas/ChecklistSubjectDto"
          nullable: true
        name:
          type: string
          description: Até 120 caracteres.
          example: Abertura do restaurante
        templateId:
          type: string
          format: uuid
          nullable: true
        weekdays:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          maxItems: 7
          minItems: 0
          uniqueItems: true
      required:
      - departmentId
      - dueAt
      - frequency
      - name
      - templateId
      - weekdays
    ChecklistRoutineResponse:
      type: object
      description: Uma rotina de checklist.
      properties:
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        departmentId:
          type: string
          format: uuid
        dueAt:
          type: string
          example: 06:00
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
        id:
          type: string
          format: uuid
        location:
          allOf:
          - $ref: "#/components/schemas/ChecklistSubjectDto"
          nullable: true
        name:
          type: string
        templateId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Versão do registro (a mesma do `ETag` do detalhe).
        weekdays:
          type: array
          items:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
      required:
      - active
      - createdAt
      - departmentId
      - dueAt
      - frequency
      - id
      - name
      - templateId
      - updatedAt
      - version
      - weekdays
    ChecklistSectionDto:
      type: object
      description: "Uma seção, com os itens na ordem de exibição (de 1 a 100)."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItemDto"
          maxItems: 100
          minItems: 0
        title:
          type: string
          description: Até 120 caracteres.
          example: Banheiro
      required:
      - items
      - title
    ChecklistSubjectDto:
      type: object
      description: "O sujeito ou local, de outro módulo: o tipo (minúsculas, dígitos,\
        \ hífen e ponto, até 60, ex.: `rooms.room`, `rooms.area`) e o id. Nenhum dos\
        \ dois é conferido."
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          example: rooms.area
          maxLength: 60
          minLength: 0
      required:
      - id
      - type
    ChecklistTemplateResponse:
      type: object
      description: "Um modelo de checklist: os dados, o rascunho e a última versã\
        o publicada."
