          type: string
          format: uuid
      - description: Só os períodos deste tipo.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - OUT_OF_ORDER
          - OUT_OF_SERVICE
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
