      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
          description: Dividido.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Dividir um lançamento entre contas
      tags:
      - billing
  /api/v1/guests:
    get:
      description: "Em ordem de nome (sem acento). `name` procura cada palavra como\
        \ trecho do nome ou do nome social, sem diferenciar acento nem maiúsculas;\
        \ `email` é exato. Para buscar por documento, use `POST /api/v1/guests/search-by-document`\
        \ (o número não vai na URL). Só perfis ativos (um mesclado só se lê pelo id).\
        \ Exige `guests.profiles.read`. Os documentos vêm mascarados (só os últimos\
        \ caracteres) e os dados sensíveis da FNRH nunca vêm."
      operationId: listGuests
      parameters:
      - description: Trecho do nome ou do nome social (de 2 a 200 caracteres).
        in: query
        name: name
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 2
      - description: E-mail exato.
        in: query
        name: email
        required: false
        schema:
          type: string
          maxLength: 254
          minLength: 0
      - description: Só os da lista de restrição (`true`) ou só os fora dela (`false`).
        in: query
        name: restricted
        required: false
        schema:
          type: boolean
      - description: Só os VIP (`true`) ou só os não VIP (`false`).
        in: query
        name: vip
        required: false
        schema:
          type: boolean
      - description: Só os ligados a esta empresa.
        in: query
        name: companyId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageGuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Buscar perfis de hóspedes
      tags:
      - guests
    post:
      description: "Exige `guests.profiles.manage`. O endereço completo é só de quem\
        \ reside no Brasil (400 `ADDRESS_REQUIRES_BRAZIL_RESIDENCE`). CPF com dígito\
        \ verificador errado ou número fora do formato do tipo: 400 `DOCUMENT_NUMBER_INVALID`;\
        \ país emissor incompatível com o tipo: 400 `DOCUMENT_COUNTRY_INVALID`. Restriç\
        ões alimentares sem o consentimento `DIETARY_RESTRICTIONS` (que pode vir em\
        \ `consents`): 422 `DIETARY_RESTRICTIONS_REQUIRE_CONSENT`."
      operationId: createGuest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: Perfil cadastrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar um perfil de hóspede
      tags:
      - guests
  /api/v1/guests/duplicate-candidates:
    get:
      description: "Pares de perfis ativos com um documento igual (pelo índice cego,\
        \ sem decifrar nada) ou o mesmo e-mail (RF-HOS-05), cada par uma vez, o de\
        \ menor id primeiro, em ordem dos ids. `guestId`: só os pares desse perfil\
        \ (inexistente: 404 `GUEST_NOT_FOUND`). Documentos indexados com chaves diferentes\
        \ do anel (no meio de uma rotação) só se casam depois da reindexação. Exige\
        \ `guests.profiles.read`. Os documentos vêm mascarados (só os últimos caracteres)\
        \ e os dados sensíveis da FNRH nunca vêm."
      operationId: listGuestDuplicateCandidates
      parameters:
      - description: Só os pares deste perfil.
        in: query
        name: guestId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageDuplicateCandidateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar candidatos a duplicado
      tags:
      - guests
  /api/v1/guests/search-by-document:
    post:
      description: "Pelo índice cego (H8): o número é normalizado como no cadastro\
        \ e comparado só pelo hash, sem decifrar os registros. Vai no corpo, nunca\
        \ na URL. Até 50 perfis ativos (mais de um: duplicados). Número inválido para\
        \ o tipo: 400 `DOCUMENT_NUMBER_INVALID`. Exige `guests.profiles.read`. Os\
        \ documentos vêm mascarados (só os últimos caracteres) e os dados sensíveis\
        \ da FNRH nunca vêm."
      operationId: searchGuestsByDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDocumentSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestListResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Buscar perfis por documento
      tags:
      - guests
  /api/v1/guests/{id}:
    get:
      description: "Exige `guests.profiles.read`. Os documentos vêm mascarados (só\
        \ os últimos caracteres) e os dados sensíveis da FNRH nunca vêm. Um perfil\
        \ mesclado continua respondendo, com `status` `MERGED` e o sobrevivente em\
        \ `mergedInto`. Inexistente: 404 `GUEST_NOT_FOUND`."
      operationId: getGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um perfil de hóspede
      tags:
      - guests
    put:
      description: "Troca os dados do perfil (não os documentos, os dados sensíveis\
        \ nem a restrição, que têm ações próprias). Exige `guests.profiles.manage`.\
        \ e o `If-Match` (ausente: 428; versão diferente: 412). Num perfil mesclado:\
        \ 409 `GUEST_ALREADY_MERGED` (altere o sobrevivente); num anonimizado, 409\
        \ `GUEST_ANONYMIZED`."
      operationId: updateGuest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      - description: "Pedido do titular (RF-HOS-07): a trilha registra a correção\
          \ com a origem `DATA_SUBJECT_REQUEST`."
        in: query
        name: dataSubjectRequest
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Corrigir um perfil de hóspede
      tags:
      - guests
  /api/v1/guests/{id}/anonymize:
    post:
      description: "Irreversível (RF-HOS-07). Ficam o id, a situação `ANONYMIZED`,\
        \ os consentimentos, a nacionalidade, o país de residência, a UF e o municí\
        pio e o VIP; saem o nome, os contatos, o endereço de rua, a data de nascimento,\
        \ o gênero, as preferências, as observações, as restrições alimentares, a\
        \ empresa, a restrição, os dados sensíveis da FNRH, os documentos e os anexos.\
        \ Ação sensível: sem `guests.data.anonymize`, 403 `APPROVAL_REQUIRED`, e a\
        \ requisição repetida com o `X-Approval-Token` de um superior é concluída.\
        \ Com estadia ativa: 409 `GUEST_HAS_ACTIVE_STAY`; já anonimizado: 409 `GUEST_ANONYMIZED`.\
        \ Vale para o titular inteiro: o perfil e os absorvidos por ele em mesclagens.\
        \ Num perfil mesclado: 409 `GUEST_ALREADY_MERGED` (faça o pedido no sobrevivente).\
        \ Inexistente: 404 `GUEST_NOT_FOUND`."
      operationId: anonymizeGuest
      parameters:
