    CancellationPolicyRequest:
      type: object
      description: "Os termos de uma política de cancelamento: o prazo e a multa (só\
        \ o valor do tipo)."
      properties:
        deadlineHours:
          type: integer
          format: int32
          description: "Prazo em horas antes do horário de check-in da data de chegada\
            \ (no fuso do hotel): o cancelamento feito depois dele paga a multa."
          maximum: 8760
          minimum: 0
          nullable: true
        name:
          type: string
          example: Flexível 48 h
          maxLength: 80
          minLength: 0
          nullable: true
        penaltyAmount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        penaltyNights:
          type: integer
          format: int32
          description: "Só em `NIGHTS`: número de diárias, de 0 a 365."
