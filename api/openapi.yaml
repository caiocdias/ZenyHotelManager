        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar os dados do hotel
      tags:
      - hotel
  /api/v1/hotel/business-date:
