                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um padrão de escala
      tags:
      - staff
  /api/v1/schedule/entries:
    post:
      description: "Lança, em cada data de `from` a `to` (no máximo 92 dias), um turno\
        \ (`SHIFT`), uma troca (`SWAP`), uma folga (`DAY_OFF`), uma falta (`ABSENCE`)\
        \ ou férias (`VACATION`) do colaborador. Turno e troca exigem `shiftId`; folga,\
        \ falta e férias não o aceitam (400 `SCHEDULE_ENTRY_INVALID`). A entrada de\
        \ cada data, gerada ou lançada antes, passa a ser esta e a geração não a toca\
        \ mais. Colaborador ou turno inexistente: 400 `UNKNOWN_EMPLOYEE`/`UNKNOWN_SHIFT`;\
        \ colaborador desativado: 422 `EMPLOYEE_INACTIVE`. Exige `staff.schedule.manage`."
      operationId: recordScheduleEntries
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordScheduleEntriesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEntriesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Lançar atribuição ou exceção na escala
      tags:
      - staff
  /api/v1/schedule/generate:
    post:
      description: "Para o período (no máximo 92 dias, começando na data operacional\
        \ ou depois: 422 `SCHEDULE_PERIOD_IN_PAST`), opcionalmente só dos colaboradores\
        \ de um setor ou de um colaborador: cria as entradas que os padrões ativos\
        \ dos colaboradores ativos pedem, refaz as geradas que mudaram e retira as\
        \ geradas que nenhum padrão pede mais. As lançadas à mão (atribuição, troca,\
        \ folga, falta, férias) nunca são sobrescritas. Gerar de novo sem mudança\
        \ não faz nada. Exige `staff.schedule.manage`."
      operationId: generateSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScheduleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Gerar a escala a partir dos padrões
      tags:
      - staff
  /api/v1/shifts:
    get:
      description: "Em ordem de criação, opcionalmente de um setor. Exige `staff.employees.read`."
      operationId: listShifts
      parameters:
      - description: Só os turnos deste setor.
        in: query
        name: departmentId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
