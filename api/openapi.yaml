  /api/v1/permissions:
    get:
      description: "Permissões vigentes do catálogo, definido pelo sistema e não editá\
        vel, em ordem de código: escopos suportados, se é sensível (exige aprovaçã\
        o de superior quando falta) e os limites que aceita. Exige `iam.permissions.read`\
        \ (sem ela, 403 `PERMISSION_DENIED`)."
      operationId: listPermissions
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePermissionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar o catálogo de permissões
      tags:
      - iam
  /api/v1/roles:
    get:
      description: "Todas as roles, ativas e inativas, em ordem de criação. Exige\
        \ `iam.roles.read`."
      operationId: listRoles
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageRoleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar roles
      tags:
      - iam
    post:
      description: "Exige `iam.roles.manage`. Ninguém concede permissão, escopo ou\
        \ limite acima dos seus (403 `GRANT_EXCEEDS_OWN_PERMISSIONS`). Permissão fora\
        \ do catálogo: 400 `UNKNOWN_PERMISSION`; escopo não suportado, limite não\
        \ declarado ou inválido, ou permissão repetida: 400 `INVALID_GRANT`. Nome\
        \ já usado, sem diferenciar maiúsculas: 409 `ROLE_NAME_ALREADY_IN_USE`."
      operationId: createRole
      parameters:
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Role criada.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Criar uma role
      tags:
      - iam
  /api/v1/roles/{id}:
