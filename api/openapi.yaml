    DailyChildRateResponse:
      type: object
      description: O preço de uma faixa atual de criança numa data; nulo = sem preço
        para criança dessa idade.
      properties:
        amount:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        label:
          type: string
        maxAge:
          type: integer
          format: int32
        minAge:
          type: integer
          format: int32
      required:
      - label
      - maxAge
      - minAge
    DailyRatePriceResponse:
      type: object
      description: Os preços de um tipo de UH numa data.
      properties:
        children:
          type: array
          description: "Um por faixa atual que tem preço, em ordem de idade."
          items:
            $ref: "#/components/schemas/ChildRatePriceResponse"
        date:
          type: string
          format: date
        extraAdult:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        obsoleteChildren:
          type: array
          description: "Faixas obsoletas (gravadas com faixas etárias que o hotel\
            \ não usa mais): não valem; a data fica sem preço de criança nessas idades\
            \ até o gestor regravar."
          items:
            $ref: "#/components/schemas/ObsoleteChildPriceResponse"
        oneAdult:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        roomTypeId:
          type: string
          format: uuid
        twoAdults:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        unpricedByDerivation:
          allOf:
          - $ref: "#/components/schemas/UnpricedByDerivationResponse"
          nullable: true
      required:
      - children
      - date
      - obsoleteChildren
      - roomTypeId
    DailyRatesResponse:
      type: object
      description: "Os preços efetivos do plano no tipo de UH numa data (num plano\
        \ derivado, os do base ajustados): a diária de um e de dois adultos, o adulto\
        \ extra (por adulto além do segundo) e um preço por faixa atual de crianç\
        a. Nulo = aquela ocupação não tem preço na data."
      nullable: true
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/DailyChildRateResponse"
        extraAdult:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        oneAdult:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        twoAdults:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
      required:
      - children
    DailyRestrictionResponse:
      type: object
      description: "A restrição efetiva do plano no tipo de UH numa data (a do tipo\
        \ sobre a geral do plano, campo a campo): fechado vale em cada noite; CTA\
        \ só na chegada; CTD só na saída; estadia mínima e máxima e antecedência,\
        \ as da data de chegada. Nulo = não restringe."
      nullable: true
      properties:
        closed:
          type: boolean
        closedToArrival:
          type: boolean
        closedToDeparture:
          type: boolean
        maxAdvanceDays:
          type: integer
          format: int32
          nullable: true
        maxStay:
          type: integer
          format: int32
          nullable: true
        minAdvanceDays:
          type: integer
          format: int32
          nullable: true
        minStay:
          type: integer
          format: int32
          nullable: true
      required:
      - closed
      - closedToArrival
      - closedToDeparture
    DepartmentRequest:
      type: object
      description: Nome de um setor.
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
      required:
      - name
    DepartmentResponse:
      type: object
      description: Um setor.
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Chave dos seis setores pré-carregados; nula nos criados depois.
          enum:
          - RECEPTION
          - HOUSEKEEPING
          - MAINTENANCE
          - FOOD_AND_BEVERAGE
          - EVENTS
          - ADMINISTRATION
          nullable: true
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - name
      - updatedAt
    DeviceRequest:
      type: object
      description: Dispositivo de onde se entra.
