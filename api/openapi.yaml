        \ ou ser liberado; a sobra sai pela liberação. Exige `billing.payments.receive`.\
        \ Acima do que ainda está autorizado: 422 `CAPTURE_EXCEEDS_AUTHORIZED`; vencida:\
        \ 422 `PRE_AUTHORIZATION_EXPIRED`; já capturada por inteiro ou liberada: 409\
        \ `PRE_AUTHORIZATION_SETTLED`; inexistente nesta conta: 404 `PRE_AUTHORIZATION_NOT_FOUND`;\
