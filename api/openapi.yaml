      tags:
      - billing
  /api/v1/folios/{id}/postings:
    get:
      description: "Em ordem de lançamento, com o estorno e o que ainda resta de cada\
        \ um. Exige `billing.folios.read`."
      operationId: listPostings
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePostingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os lançamentos de uma conta
      tags:
      - billing
    post:
      description: "Lançamento manual na data operacional do hotel (RN-01): valor\
        \ = quantidade × valor unitário, arredondado pela regra de `Money`, negativo\
        \ num código `CREDIT`. Exige `billing.postings.create`. Conta encerrada: 409\
        \ `FOLIO_CLOSED`; código inexistente: 400 `UNKNOWN_TRANSACTION_CODE`; desativado:\
        \ 422 `TRANSACTION_CODE_INACTIVE`; quantidade ou valor fora da faixa: 400\
        \ `POSTING_INVALID`. Roteamento (RF-CTA-04): uma regra vigente na data operacional\
        \ desta conta (por código, que prevalece, ou por grupo de receita) grava o\
        \ lançamento na conta de destino, seguindo a cadeia, com `routedFromFolioId`\
        \ = esta conta e `routingRuleId`; a resposta e o `Location` são os da conta\
        \ final; destino encerrado: 409 `ROUTING_TARGET_CLOSED`. Taxa de serviço (RF-CTA-14):\
        \ num código com `serviceChargeApplies`, lança junto, à parte, a taxa (`SERVICE_CHARGE`,\
        \ código `TX-SERVICO`) na conta final do item, vinculada a ele (`serviceChargePostingId`),\
        \ com o percentual do código, senão o padrão do hotel, arredondado pela regra\
        \ de `Money`; `TX-SERVICO` desativado: 422 `TRANSACTION_CODE_INACTIVE` (salvo\
        \ com a taxa zero, em que o item passa sem taxa)."
      operationId: createPosting
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingResponse"
          description: Lançado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Lançar numa conta
      tags:
      - billing
  /api/v1/folios/{id}/postings/transfer:
    post:
      description: "Transfere tudo o que ainda resta de cada lançamento para a conta\
        \ de destino (RF-CTA-05), sem mudar o lançamento: cada um ganha uma saída\
        \ nesta conta (`TRANSFER_OUT`, o inverso) e uma entrada no destino (`TRANSFER_IN`),\
        \ vinculadas, na data operacional. Vai exatamente para o destino (o roteamento\
        \ não se aplica). Exige `billing.postings.transfer`. Só um lançamento normal\
        \ ou a entrada de uma transferência é transferido (422 `POSTING_NOT_TRANSFERABLE`);\
        \ já estornado: 409 `POSTING_ALREADY_REVERSED`; nada restando: 422 `POSTING_NOTHING_TO_TRANSFER`;\
        \ conta encerrada: 409 `FOLIO_CLOSED`; conta de destino inexistente: 400 `UNKNOWN_FOLIO`.\
        \ A taxa de serviço do item vai junto, na mesma proporção (`serviceChargeOutgoing`/`serviceChargeIncoming`);\
        \ ela não se move à parte (422 `SERVICE_CHARGE_FOLLOWS_ITEM`)."
      operationId: transferPostings
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
          description: Transferidos.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Transferir lançamentos para outra conta
      tags:
      - billing
  /api/v1/folios/{id}/postings/{postingId}:
    get:
      description: "Exige `billing.folios.read`. Inexistente nesta conta: 404 `POSTING_NOT_FOUND`."
      operationId: getPosting
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: postingId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um lançamento
      tags:
      - billing
  /api/v1/folios/{id}/postings/{postingId}/adjust:
    post:
      description: "Cria um lançamento vinculado no mesmo código, com o valor informado\
        \ e o sinal oposto ao do original, e motivo. Parcial: até o que ainda resta\
        \ (acima: 422 `ADJUSTMENT_EXCEEDS_REMAINING`). Exige `billing.postings.adjust`.\
        \ Exige antes `billing.folios.read` (sem ela, 403 `PERMISSION_DENIED`, antes\
        \ de ler a conta). Ação **sensível** com o limite `maxAmount` sobre o total\
        \ das correções do lançamento (as já feitas mais esta, em valor absoluto):\
        \ sem a permissão, ou acima do limite, 403 `APPROVAL_REQUIRED` (com `action`,\
        \ `permission`, `resourceRef` e `limit`); repita com o `X-Approval-Token`\
        \ de `POST /api/v1/auth/approvals` e **outra** `Idempotency-Key`. Só um lanç\
        amento normal é corrigido (422 `POSTING_NOT_CORRECTABLE`); lançamento já estornado:\
        \ 409 `POSTING_ALREADY_REVERSED`; conta encerrada: 409 `FOLIO_CLOSED`. Essas\
        \ regras são conferidas antes da aprovação de superior. Taxa de serviço (M3\
        \ E06): a taxa vinculada ao item acompanha a correção (o estorno a estorna;\
        \ o ajuste a ajusta na proporção do percentual guardado), com o mesmo motivo\
        \ e `triggeredByPostingId`, e o limite confere o item com a taxa (inclusive\
        \ o que já saiu dela); a própria taxa não se corrige aqui (422 `SERVICE_CHARGE_FOLLOWS_ITEM`)."
      operationId: adjustPosting
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: postingId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingResponse"
          description: Ajustado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Ajustar um lançamento
      tags:
      - billing
  /api/v1/folios/{id}/postings/{postingId}/remove-service-charge:
    post:
      description: "RN-10: estorna tudo o que resta da taxa de serviço (`postingId`\
        \ é a taxa, ou a entrada dela numa conta para onde o item foi transferido),\
        \ com o motivo fixo \"Taxa de serviço removida a pedido do cliente.\", registrado\
        \ e auditado. Exige `billing.servicecharge.remove`; **não** é ação sensível\
        \ (sem aprovação nem limite). Sem corpo. Não é taxa vinculada: 422 `POSTING_NOT_SERVICE_CHARGE`;\
        \ já estornada (removida, ou o item estornado): 409 `POSTING_ALREADY_REVERSED`;\
        \ zerada: 422 `POSTING_NOTHING_TO_REVERSE`; conta encerrada: 409 `FOLIO_CLOSED`.\
        \ A taxa não é estornada, ajustada, transferida nem dividida à parte pelos\
        \ outros endpoints (422 `SERVICE_CHARGE_FOLLOWS_ITEM`): ela acompanha o item."
