        \ fuso do hotel; fim antes do início é um turno que atravessa a meia-noite\
        \ (pertence à data em que começa). Início igual ao fim ou com segundos: 400\
        \ `SHIFT_TIMES_INVALID`. Setor inexistente: 400 `UNKNOWN_DEPARTMENT`. Nome\
        \ já usado no setor: 409 `SHIFT_NAME_ALREADY_IN_USE`."
