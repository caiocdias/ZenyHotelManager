        \ dela (RF-UH-08): ocupada mas vazia, vaga mas ocupada, ou outro número de\
        \ hóspedes. Em ordem de número. Exige `rooms.status.read`."
      operationId: listRoomDiscrepancies
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
