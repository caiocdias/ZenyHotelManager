  /api/v1/stream:
    get:
      description: "Exige a permissão de cada tópico (sem ela, 403 PERMISSION_DENIED;\
        \ tópico desconhecido, 400 UNKNOWN_STREAM_TOPIC). Cada mensagem é um evento\
        \ com o nome do tópico, `id` `<época>-<sequência>` e `data` JSON com só `type`,\
        \ `id` e `version`: o cliente aplica a mudança ou rebusca o recurso. A conexã\
        o começa por `ready` (sem `Last-Event-ID`, ou depois de repor as mensagens\
        \ perdidas) ou por `reset` (o `Last-Event-ID` saiu do buffer ou é de outro\
        \ boot: recarregue o estado); os dois trazem a posição corrente no `id`. Comentá\
        rios `: heartbeat` periódicos mantêm a conexão viva. O servidor encerra a\
        \ conexão no vencimento do access token (renove-o e reconecte com o `Last-Event-ID`)\
        \ e na revogação da sessão."
      operationId: openStream
      parameters:
      - description: "Tópicos separados por vírgula, como `rooms`."
        example: rooms
        in: query
        name: topics
        required: false
        schema:
          type: string
      - description: "Id do último evento recebido, para repor o que foi perdido."
        in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Stream SSE (`text/event-stream`).
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Abre o canal de tempo real
      tags:
      - stream
  /api/v1/sync/changes:
    get:
      description: "Sem `cursor`, o estado completo do que o usuário pode ver no escopo\
        \ offline; com o `cursor` da resposta anterior, só o que mudou desde ele,\
        \ em ordem, incluindo *tombstones* (`deleted`: o registro foi apagado, desativado\
        \ ou saiu do escopo; apague-o). Com `hasMore`, peça a página seguinte com\
        \ o novo `cursor`; sem ele, guarde o `cursor` para a próxima sincronizaçã\
        o. `reset` indica um download completo (sem cursor, ou o usuário ou as permissõ\
        es mudaram): descarte o que tem das fontes antes de aplicar. Cada mudança\
        \ traz a fonte, o id, a versão e os dados, sem dado pessoal de hóspede (RN-13).\
        \ Fonte `rooms` (exige `rooms.offline.read`): UHs ativas com `number`, `floor`,\
        \ `occupancy`, `housekeepingStatus`, `inspectionPending` e `serviceFlag`.\
        \ Cursor inválido: 400 `INVALID_CURSOR`."
      operationId: listSyncChanges
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncChangesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Baixa as mudanças desde o cursor
      tags:
      - sync
  /api/v1/sync/commands:
    post:
      description: "Lote ordenado de até 100 comandos `{commandId (UUIDv7 gerado no\
        \ dispositivo), type, payload, occurredAt, deviceClock (o relógio do dispositivo\
        \ no envio)}`, processados em ordem, cada um na sua transação. Um resultado\
        \ por comando: `APPLIED`, `APPLIED_WITH_WARNINGS` (com `warnings`), `REJECTED`\
        \ (com `code` e `message`; definitivo), `FAILED` (falha no servidor: reenvie)\
        \ ou `NOT_PROCESSED` (um anterior falhou: reenvie a partir dele). Um `commandId`\
        \ já processado devolve o resultado guardado (`replayed`), sem aplicar de\
        \ novo; de outro usuário, `COMMAND_ID_CONFLICT`; com outro tipo, `COMMAND_ID_REUSED`;\
        \ com o instante do UUIDv7, corrigido pela defasagem do relógio, mais antigo\
        \ que a retenção (30 dias), ou cujo resultado já saiu pela retenção (o id\
        \ fica guardado por 365 dias), `COMMAND_EXPIRED`. Outras rejeições do protocolo:\
        \ `COMMAND_ID_INVALID` (não é UUIDv7, ou instante implausível), `DEVICE_TIME_INVALID`\
        \ (`deviceClock` ou `occurredAt` antes de 2020-01-01 ou mais de 366 dias à\
        \ frente do servidor), `UNKNOWN_COMMAND_TYPE` e `COMMAND_PAYLOAD_INVALID`.\
        \ O `occurredAt` é corrigido pela defasagem do relógio (`recebimento − deviceClock`),\
        \ sem passar do recebimento; acima da tolerância, o comando é aplicado com\
        \ o alerta `CLOCK_SKEW_EXCEEDED`. O endpoint não usa `Idempotency-Key`."
      operationId: submitSyncCommands
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncCommandsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCommandsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Envia um lote de comandos offline
      tags:
      - sync
  /api/v1/transaction-codes:
    get:
      description: Em ordem de código. Exige `billing.codes.read`.
      operationId: listTransactionCodes
      parameters:
      - description: Só os ativos (`true`) ou só os desativados (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - in: query
        name: revenueGroup
        required: false
        schema:
          type: string
          enum:
          - ROOM
          - FOOD_BEVERAGE
          - SERVICE_CHARGE
          - FEES
          - TAXES
          - LAUNDRY
          - OTHER
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
