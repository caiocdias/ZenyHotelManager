          type: string
          format: password
          description: "Senha provisória, de 12 a 128 caracteres."
          maxLength: 128
          minLength: 12
        pin:
          type: string
          format: password
          description: "PIN de aprovação, de 4 a 8 dígitos (opcional)."
          nullable: true
          pattern: "\\d{4,8}"
        roleIds:
          type: array
          description: Roles do usuário (opcional).
          items:
            type: string
            format: uuid
            description: Roles do usuário (opcional).
          maxItems: 50
          minItems: 0
      required:
      - login
      - name
      - password
      - roleIds
