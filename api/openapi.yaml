          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma regra de roteamento
      tags:
      - billing
    put:
      description: "Troca o destino, o critério e o período (a origem não muda). Exige\
        \ `billing.routing.manage` e o `If-Match` (ausente: 428; versão diferente:\
        \ 412). Lançamentos já feitos não mudam. Com a regra ativa: origem encerrada:\
        \ 409 `FOLIO_CLOSED`; destino encerrado: 409 `ROUTING_TARGET_CLOSED`; outra\
        \ regra ativa da mesma origem e do mesmo nível (por código, com algum código\
        \ em comum, ou pelo mesmo grupo) em período que se cruza: 409 `ROUTING_RULE_OVERLAP`;\
        \ regra que formaria um ciclo (a cadeia voltaria à origem, inclusive origem\
        \ = destino): 422 `ROUTING_RULE_CYCLE`. Códigos e grupo juntos, nenhum dos\
        \ dois, código repetido ou fim antes do início: 400 `ROUTING_RULE_INVALID`;\
        \ código inexistente: 400 `UNKNOWN_TRANSACTION_CODE`; conta inexistente: 400\
        \ `UNKNOWN_FOLIO`."
      operationId: updateRoutingRule
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingRuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRuleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma regra de roteamento
      tags:
      - billing
  /api/v1/routing-rules/{id}/deactivate:
    post:
      description: Os lançamentos seguintes ficam na origem. Exige `billing.routing.manage`.
