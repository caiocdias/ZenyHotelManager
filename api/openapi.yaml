      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageShiftResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar turnos
      tags:
      - staff
    post:
      description: "Exige `staff.employees.manage`. Horários em horas e minutos, no\
        \ fuso do hotel; fim antes do início é um turno que atravessa a meia-noite\
        \ (pertence à data em que começa). Início igual ao fim ou com segundos: 400\
        \ `SHIFT_TIMES_INVALID`. Setor inexistente: 400 `UNKNOWN_DEPARTMENT`. Nome\
        \ já usado no setor: 409 `SHIFT_NAME_ALREADY_IN_USE`."
      operationId: createShift
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftResponse"
