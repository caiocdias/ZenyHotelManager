openapi: 3.0.1
info:
  description: "API do servidor do Zeny Hotel Manager. Erros em RFC 9457 (application/problem+json)\
    \ com `code` estável; paginação por cursor (`cursor`/`limit`); concorrência otimista\
    \ com `ETag`/`If-Match`; `Idempotency-Key` obrigatório nas operações com efeito\
    \ financeiro ou externo (resposta guardada por 24h); instantes em UTC (ISO-8601\
    \ com `Z`), datas `YYYY-MM-DD` e dinheiro como string decimal em BRL. Autenticaç\
    ão: `POST /api/v1/auth/login` devolve um access token JWT de 15 min, enviado como\
    \ `Authorization: Bearer …`, e um refresh token rotativo da sessão do dispositivo,\
    \ trocado em `POST /api/v1/auth/refresh`. Um `401` com `code` `UNAUTHENTICATED`\
    \ pede um refresh; os demais códigos de `401` (credenciais, bloqueio, refresh)\
    \ pedem um novo login. Ação sensível sem permissão (ou acima do limite): 403 `APPROVAL_REQUIRED`;\
    \ outro usuário aprova em `POST /api/v1/auth/approvals` e a requisição é repetida\
    \ com `X-Approval-Token`."
  title: Zeny Hotel Manager API
  version: v1
servers:
- description: Este servidor
  url: /
security:
- bearerAuth: []
tags:
- description: Configuração do hotel e data operacional.
  name: hotel
- description: "Códigos de lançamento, contas, lançamentos imutáveis, roteamento,\
    \ transferência e divisão."
  name: billing
- description: "Modelos de checklist, rascunhos e versões publicadas."
  name: checklists
- description: "Anexos: upload por finalidade e download por URL assinada."
  name: files
- description: "Autenticação, sessões por dispositivo e usuários."
  name: iam
- description: "Tipos de UH, características, UHs e áreas comuns."
  name: rooms
- description: Informações sobre o servidor e a API.
  name: meta
- description: Sincronização offline do app operacional.
  name: sync
- description: "Perfis de hóspedes, documentos, lista de restrição e empresas."
  name: guests
- description: Trilha de auditoria das escritas.
  name: audit
- description: Canal de tempo real (SSE).
  name: stream
- description: "Setores, colaboradores, turnos e escala."
  name: staff
- description: "Notificações internas, preferências e dispositivos de push do pró\
    prio usuário."
  name: notifications
paths:
  /api/v1/areas:
    get:
      description: "Em ordem de nome, opcionalmente de um tipo e só ativas ou inativas.\
        \ Exige `rooms.registry.read`."
      operationId: listAreas
      parameters:
      - description: Só as áreas deste tipo.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - LOBBY
          - POOL
          - KITCHEN
          - HALL
          - CORRIDOR
          - OTHER
      - description: Só os ativos (`true`) ou só os inativos (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageAreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar áreas comuns
      tags:
      - rooms
    post:
      description: "Exige `rooms.registry.manage`. Nome já usado, sem diferenciar\
        \ maiúsculas: 409 `AREA_NAME_ALREADY_IN_USE`."
      operationId: createArea
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: Área cadastrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}:
    get:
      description: "Exige `rooms.registry.read`. Inexistente: 404 `AREA_NOT_FOUND`."
      operationId: getArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma área comum
      tags:
      - rooms
    put:
      description: "Troca nome, tipo e descrição. Exige `rooms.registry.manage` e\
        \ o `If-Match` (ausente: 428; versão diferente: 412). Nome já usado: 409 `AREA_NAME_ALREADY_IN_USE`."
      operationId: updateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}/deactivate:
    post:
      description: Exige `rooms.registry.manage`. Nada é apagado. Desativar de novo
        não muda nada.
      operationId: deactivateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar uma área comum
      tags:
      - rooms
  /api/v1/areas/{id}/reactivate:
    post:
      description: Exige `rooms.registry.manage`.
      operationId: reactivateArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar uma área comum
      tags:
      - rooms
  /api/v1/audit-entries:
    get:
      description: "Entradas da trilha, das mais recentes para as mais antigas, filtradas\
        \ por quem agiu (`userId`), pela entidade (`entityType` e, opcionalmente,\
        \ `entityId`) e pelo período (`from` inclusive, `to` exclusive, instantes\
        \ em UTC). Cada entrada traz quem, quando e de qual sessão de dispositivo,\
        \ a ação e o resultado, a entidade, os valores antes e depois (com senha,\
        \ PIN, tokens e campos cifrados mascarados como `***`) e a aprovação associada.\
        \ Exige `audit.read` (sem ela, 403 `PERMISSION_DENIED`)."
      operationId: listAuditEntries
      parameters:
      - description: Só as entradas deste usuário (quem agiu).
        in: query
        name: userId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Tipo da entidade, como `iam.user` ou `iam.role`."
        in: query
        name: entityType
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: Id da entidade; exige `entityType`.
        in: query
        name: entityId
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      - description: "Início do período (inclusive), em UTC."
        example: 2026-10-01T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Fim do período (exclusive), em UTC."
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageAuditEntryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar a trilha de auditoria
      tags:
      - audit
  /api/v1/auth/approvals:
    post:
      description: "Recebe a operação recusada com 403 `APPROVAL_REQUIRED` (`action`,\
        \ `permission`, `resourceRef` e, se houver, `limit`, copiados do problema),\
        \ o login e o PIN de outro usuário e o motivo. Devolve o token de aprovaçã\
        o: vale **uma vez**, por **2 min**, só para a mesma operação, pedida pelo\
        \ mesmo usuário na mesma sessão, no cabeçalho `X-Approval-Token` da requisiç\
        ão repetida. O aprovador precisa estar ativo e ter a permissão com limite\
        \ para o valor pedido (403 `APPROVER_NOT_ALLOWED`) e não pode ser o próprio\
        \ solicitante (403 `APPROVER_IS_REQUESTER`). Login inexistente, aprovador\
        \ sem PIN ou PIN errado: 403 `APPROVAL_CREDENTIALS_INVALID`; a partir da 3ª\
        \ falha seguida, as aprovações do aprovador ficam bloqueadas por tempo crescente\
        \ (403 `APPROVER_LOCKED`, mesmo com o PIN certo), sem bloquear o login dele.\
        \ Permissão que não aceita aprovação: 422 `APPROVAL_NOT_APPLICABLE`. A aprovaç\
        ão e as recusas ficam na trilha de auditoria."
      operationId: grantApproval
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
          description: Aprovação concedida.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Aprovar uma ação sensível (step-up)
      tags:
      - iam
  /api/v1/auth/login:
    post:
      description: "Público. Abre uma sessão no dispositivo (um novo login no mesmo\
        \ dispositivo encerra a sessão anterior dele) e devolve um access token JWT\
        \ de 15 min e um refresh token. O login não diferencia maiúsculas. Recusas\
        \ com 401: `INVALID_CREDENTIALS` (login ou senha), `ACCOUNT_LOCKED` (falhas\
        \ seguidas; o bloqueio cresce a cada nova falha e vale mesmo com a senha certa)\
        \ e `ACCOUNT_DISABLED`. Com `passwordChangeRequired`, só a troca de senha\
        \ e o logout respondem até a senha ser trocada."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Sessão aberta.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Entrar com login e senha
      tags:
      - iam
  /api/v1/auth/logout:
    post:
      description: "Encerra a sessão do access token: o refresh token dela deixa de\
        \ valer. O access token vence sozinho em até 15 min."
      operationId: logout
      responses:
        "204":
          description: Sessão encerrada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Sair
      tags:
      - iam
  /api/v1/auth/me:
    get:
      description: "Quem está logado, as roles ativas e as permissões efetivas agora:\
        \ a união das roles ativas, com o escopo mais amplo e, por chave, o maior\
        \ limite. As permissões não vão no access token: uma mudança de role vale\
        \ já na requisição seguinte. Não exige permissão."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: O usuário corrente e as permissões efetivas
      tags:
      - iam
  /api/v1/auth/password:
    post:
      description: "Confere a senha atual (401 `INVALID_CREDENTIALS` ou `ACCOUNT_LOCKED`,\
        \ contando para o bloqueio como o login) e grava a nova, de 12 a 128 caracteres\
        \ e diferente da atual (422 `PASSWORD_UNCHANGED`). Encerra a troca obrigató\
        ria e as outras sessões do usuário; a sessão corrente continua, e o próximo\
        \ refresh traz um access token sem a pendência."
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Senha trocada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Trocar a própria senha
      tags:
      - iam
  /api/v1/auth/refresh:
    post:
      description: "Público (o cabeçalho Authorization é ignorado). Troca o refresh\
        \ token por um par novo: o refresh token usado deixa de valer, e a validade\
        \ da sessão volta a 30 dias. Recusas com 401: `REFRESH_TOKEN_INVALID` (desconhecido,\
        \ vencido, sessão revogada ou usuário desativado) e `REFRESH_TOKEN_REUSED`\
        \ (o token já tinha sido trocado: a sessão inteira é revogada, inclusive o\
        \ refresh token mais novo). Nos dois casos, o cliente pede um novo login."
      operationId: refreshTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      security: []
      summary: Renovar os tokens da sessão
      tags:
      - iam
  /api/v1/auth/sessions:
    get:
      description: "Sessões não revogadas e não vencidas do usuário, da mais nova\
        \ para a mais antiga."
      operationId: listMySessions
      parameters:
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageSessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar as próprias sessões ativas
      tags:
      - iam
  /api/v1/auth/sessions/{id}/revoke:
    post:
      description: "O refresh token da sessão deixa de valer (o access token vence\
        \ em até 15 min). Revogar de novo não muda nada. Sessão de outro usuário ou\
        \ inexistente: 404 `SESSION_NOT_FOUND`."
      operationId: revokeMySession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Sessão revogada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Revogar uma sessão própria
      tags:
      - iam
  /api/v1/cash-points:
    get:
      description: Em ordem de nome. Exige `billing.shifts.read` (qualquer escopo)
        ou `billing.cashpoints.manage`.
      operationId: listCashPoints
      parameters:
      - description: Só os ativos (`true`) ou só os desativados (`false`); omita para
          todos.
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageCashPointResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os pontos de caixa
      tags:
      - billing
    post:
      description: "Exige `billing.cashpoints.manage`. Nome repetido (sem diferenciar\
        \ maiúsculas, inclusive de um desativado): 409 `CASH_POINT_NAME_ALREADY_IN_USE`."
      operationId: createCashPoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPointRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPointResponse"
          description: Ponto de caixa cadastrado.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Cadastrar um ponto de caixa
      tags:
      - billing
  /api/v1/cash-points/{id}:
    get:
      description: "Exige `billing.shifts.read` (qualquer escopo) ou `billing.cashpoints.manage`.\
        \ Inexistente: 404 `CASH_POINT_NOT_FOUND`."
      operationId: getCashPoint
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPointResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um ponto de caixa
      tags:
      - billing
    put:
      description: "Troca o nome e o fechamento cego (vale para os turnos abertos\
        \ depois). Exige `billing.cashpoints.manage` e o `If-Match` (ausente: 428;\
        \ versão diferente: 412). Nome repetido: 409 `CASH_POINT_NAME_ALREADY_IN_USE`."
      operationId: updateCashPoint
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPointRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPointResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um ponto de caixa
      tags:
      - billing
  /api/v1/cash-points/{id}/deactivate:
    post:
      description: Exige `billing.cashpoints.manage`. Os turnos abertos seguem até
        o fechamento; abrir um turno novo no ponto é recusado (422 `CASH_POINT_INACTIVE`).
      operationId: deactivateCashPoint
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPointResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Desativar um ponto de caixa
      tags:
      - billing
  /api/v1/cash-points/{id}/reactivate:
    post:
      description: Exige `billing.cashpoints.manage`.
      operationId: reactivateCashPoint
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPointResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reativar um ponto de caixa
      tags:
      - billing
  /api/v1/cashier-shifts:
    get:
      description: "Do mais novo para o mais antigo. Exige `billing.shifts.read`;\
        \ com `OWN`, só os turnos do próprio usuário. Sem o esperado (veja o turno)."
      operationId: listCashierShifts
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - in: query
        name: cashPointId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: operatorId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageCashierShiftListItem"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar os turnos de caixa
      tags:
      - billing
    post:
      description: "Com o fundo de troco, na data operacional, com número `CX-<ano>-<sequê\
        ncia>`. Exige `billing.cashier.operate`. O usuário já tem um turno aberto\
        \ (em qualquer ponto): 409 `CASHIER_SHIFT_ALREADY_OPEN`; ponto inexistente:\
        \ 400 `UNKNOWN_CASH_POINT`; desativado: 422 `CASH_POINT_INACTIVE`; fundo fora\
        \ de 0,00 a 1.000.000,00: 400 `CASHIER_SHIFT_INVALID`. Fechamento cego: num\
        \ turno cego aberto, `expected` sai nulo (e `expectedVisible` falso) a quem\
        \ não tem `billing.shifts.review`; depois do fechamento, sai a todos que leem\
        \ o turno."
      operationId: openCashierShift
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashierShiftOpenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: Turno aberto.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Abrir o próprio turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/current:
    get:
      description: "Exige `billing.cashier.operate`. Sem turno aberto: 404 `CASHIER_SHIFT_NOT_FOUND`.\
        \ Fechamento cego: num turno cego aberto, `expected` sai nulo (e `expectedVisible`\
        \ falso) a quem não tem `billing.shifts.review`; depois do fechamento, sai\
        \ a todos que leem o turno."
      operationId: getCurrentCashierShift
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o próprio turno aberto
      tags:
      - billing
  /api/v1/cashier-shifts/{id}:
    get:
      description: "Com os movimentos; o `ETag` muda a cada movimento. Exige `billing.shifts.read`;\
        \ com `OWN`, o turno de outro usuário responde 404 `CASHIER_SHIFT_NOT_FOUND`.\
        \ Fechamento cego: num turno cego aberto, `expected` sai nulo (e `expectedVisible`\
        \ falso) a quem não tem `billing.shifts.review`; depois do fechamento, sai\
        \ a todos que leem o turno."
      operationId: getCashierShift
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar um turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/close:
    post:
      description: "Com a contagem declarada por forma de pagamento (a omitida vale\
        \ zero); devolve o relatório de fechamento, com o esperado e a diferença por\
        \ forma (declarado − esperado). Exige `billing.cashier.operate`, e só o operador\
        \ fecha (403 `CASHIER_SHIFT_OPERATOR_REQUIRED`). Já fechado: 409 `CASHIER_SHIFT_CLOSED`;\
        \ forma repetida ou valor fora de 0,00 a 1.000.000,00: 400 `CASHIER_COUNT_INVALID`.\
        \ Com alguma diferença, quem tem `billing.shifts.review` (menos o operador)\
        \ recebe a notificação `billing.cashier-shift-difference`."
      operationId: closeCashierShift
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashierShiftCloseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftReportResponse"
          description: OK
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Fechar o próprio turno de caixa
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/movements:
    post:
      description: "Em dinheiro, com motivo; imutável. Exige `billing.cashier.operate`,\
        \ e só o operador do turno registra (403 `CASHIER_SHIFT_OPERATOR_REQUIRED`).\
        \ Turno fechado: 409 `CASHIER_SHIFT_CLOSED`; valor fora de 0,01 a 1.000.000,00\
        \ ou motivo vazio: 400 `CASHIER_SHIFT_INVALID`. A sangria não é conferida\
        \ contra o dinheiro esperado (o fechamento cego não o revela); a falta aparece\
        \ como diferença."
      operationId: recordCashMovement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashMovementRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovementResponse"
          description: Movimento registrado.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_IN_USE`: a requisição com esta chave ainda\
            \ está em andamento."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`IDEMPOTENCY_KEY_REUSED`: a chave já foi usada com outra requisiç\
            ão."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Registrar uma sangria ou um suprimento
      tags:
      - billing
  /api/v1/cashier-shifts/{id}/report:
    get:
      description: "Em JSON (o PDF é do M5). Exige `billing.shifts.read`; com `OWN`,\
        \ só o dos próprios turnos (o de outro: 404 `CASHIER_SHIFT_NOT_FOUND`). Turno\
        \ aberto: 409 `CASHIER_SHIFT_NOT_CLOSED`."
      operationId: getCashierShiftReport
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashierShiftReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar o relatório de fechamento de um turno
      tags:
      - billing
  /api/v1/checklist-executions:
    get:
      description: "Da mais nova para a mais antiga, sem as respostas. Exige `checklists.executions.read`.\
        \ Com o escopo `OWN`, só as execuções de que o usuário é executor ou candidato\
        \ (rotina, H14)."
      operationId: listChecklistExecutions
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
      - in: query
        name: context
        required: false
        schema:
          type: string
          enum:
          - HOUSEKEEPING
          - INSPECTION
          - MAINTENANCE
          - COMMON_AREA
          - RESTAURANT
          - EVENT
          - OTHER
      - description: Só as geradas por esta rotina.
        in: query
        name: routineId
        required: false
        schema:
          type: string
          format: uuid
      - description: Só as de rotina desta data operacional.
        in: query
        name: businessDate
        required: false
        schema:
          type: string
          format: date
      - description: "Só as deste tipo de sujeito (com `subjectId`, deste sujeito)."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
      - in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Quantidade máxima de itens na página.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageChecklistExecutionSummaryResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Listar execuções de checklist
      tags:
      - checklists
    post:
      description: "Com a última versão publicada do modelo (`templateId`, ativo)\
        \ ou do modelo que vale para o sujeito no contexto (`context` e `attributes`,\
        \ RF-CHK-04); o executor é o usuário e o início, agora. Exige `checklists.executions.execute`.\
        \ Nem um nem outro, ou os dois: 400 `CHECKLIST_EXECUTION_INVALID`; nenhum\
        \ modelo que valha: 422 `CHECKLIST_NO_APPLICABLE_TEMPLATE`; modelo desativado\
        \ ou nunca publicado: 422 `CHECKLIST_TEMPLATE_INACTIVE` ou `CHECKLIST_TEMPLATE_NOT_PUBLISHED`."
      operationId: startChecklistExecution
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartChecklistExecutionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: Execução iniciada.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Iniciar uma execução avulsa
      tags:
      - checklists
  /api/v1/checklist-executions/{id}:
    get:
      description: "Com as respostas e o conteúdo da versão usada. Exige `checklists.executions.read`.\
        \ Com o escopo `OWN`, só as execuções de que o usuário é executor ou candidato\
        \ (rotina, H14). Inexistente ou fora do escopo: 404 `CHECKLIST_EXECUTION_NOT_FOUND`."
      operationId: getChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar uma execução
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/answers:
    put:
      description: "A lista substitui as respostas gravadas; uma resposta que não\
        \ mudou mantém o horário. As fotos novas são conferidas e vinculadas à execuç\
        ão; as que saem, desvinculadas. Exige `checklists.executions.execute` e o\
        \ `If-Match` (ausente: 428; versão diferente: 412). Só o executor responde\
        \ e conclui (403 `CHECKLIST_EXECUTOR_REQUIRED`); pendente: 409 `CHECKLIST_EXECUTION_NOT_STARTED`;\
        \ concluída: 409 `CHECKLIST_EXECUTION_ALREADY_COMPLETED`. Recusas das respostas,\
        \ `400` com o campo em `errors[]`: `CHECKLIST_ANSWER_UNKNOWN_ITEM`, `CHECKLIST_ANSWER_DUPLICATED`\
        \ e `CHECKLIST_ANSWER_INVALID`. Foto inexistente: 422 `CHECKLIST_PHOTO_NOT_FOUND`;\
        \ de outra finalidade, de outro usuário ou de outro registro: 422 `CHECKLIST_PHOTO_INVALID`."
      operationId: replaceChecklistAnswers
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceChecklistAnswersRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Responder (trocar todas as respostas)
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/complete:
    post:
      description: "Confere os obrigatórios visíveis (o item oculto pela condição\
        \ não é exigido; a resposta dele sai), conclui e publica `ChecklistCompleted`\
        \ com as respostas que disparam ações (RF-CHK-05), uma vez. Exige `checklists.executions.execute`.\
        \ Obrigatório visível sem resposta: 422 `CHECKLIST_REQUIRED_ITEMS_MISSING`,\
        \ com as chaves em `missingItems`. Só o executor responde e conclui (403 `CHECKLIST_EXECUTOR_REQUIRED`);\
        \ pendente: 409 `CHECKLIST_EXECUTION_NOT_STARTED`; concluída: 409 `CHECKLIST_EXECUTION_ALREADY_COMPLETED`."
      operationId: completeChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Concluir uma execução
      tags:
      - checklists
  /api/v1/checklist-executions/{id}/start:
    post:
      description: "O primeiro candidato que inicia assume a execução (H14), com a\
        \ última versão publicada do modelo. Exige `checklists.executions.execute`\
        \ (com `OWN`, ser candidato: 403 `RESOURCE_OUT_OF_SCOPE`). Já iniciada: 409\
        \ `CHECKLIST_EXECUTION_ALREADY_STARTED`."
      operationId: startScheduledChecklistExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistExecutionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Assumir a execução pendente de uma rotina
      tags:
      - checklists
  /api/v1/checklist-reports/compliance:
    get:
      description: "Por modelo, as execuções concluídas no período (pela conclusã\
        o) e as respostas de marcação por resultado, com a taxa de conformidade (OK\
        \ sobre os avaliados; nula sem nada avaliado). Em ordem de nome do modelo.\
        \ Só os itens de marcação têm resultado: OK conta como conforme, NÃO OK como\
        \ não conforme, e \"não se aplica\" fica fora do denominador (`evaluatedCount`\
        \ = OK + NÃO OK). Período em datas no fuso do hotel, inclusive nas duas pontas\
        \ (`from` e `to`, opcionais); fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`.\
        \ Exige `checklists.reports.read`."
      operationId: getChecklistComplianceReport
      parameters:
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Só os sujeitos deste tipo (o local: `rooms.room`, `rooms.area`…\
          )."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
          maxLength: 60
          minLength: 0
      - description: Só este sujeito (o local).
        in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistComplianceReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Conformidade por modelo
      tags:
      - checklists
  /api/v1/checklist-reports/failed-items:
    get:
      description: "Os itens de marcação com ao menos uma reprovação (NÃO OK) em execuç\
        ões concluídas no período (pela conclusão), do mais reprovado ao menos (desempate\
        \ pela taxa de reprovação), até `limit`. O rótulo é o da versão mais nova\
        \ entre as execuções do filtro (a chave do item é estável entre as versões).\
        \ Só os itens de marcação têm resultado: OK conta como conforme, NÃO OK como\
        \ não conforme, e \"não se aplica\" fica fora do denominador (`evaluatedCount`\
        \ = OK + NÃO OK). Período em datas no fuso do hotel, inclusive nas duas pontas\
        \ (`from` e `to`, opcionais); fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`.\
        \ Exige `checklists.reports.read`."
      operationId: getChecklistFailedItemsReport
      parameters:
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Só os sujeitos deste tipo (o local: `rooms.room`, `rooms.area`…\
          )."
        in: query
        name: subjectType
        required: false
        schema:
          type: string
          maxLength: 60
          minLength: 0
      - description: Só este sujeito (o local).
        in: query
        name: subjectId
        required: false
        schema:
          type: string
          format: uuid
      - description: "Quantos itens, no máximo (de 1 a 200)."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistFailedItemsReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Itens mais reprovados
      tags:
      - checklists
  /api/v1/checklist-reports/location-history:
    get:
      description: "As execuções de um local (sujeito), em qualquer situação — inclusive\
        \ a pendente de rotina que ninguém fez —, da mais recente para a mais antiga\
        \ pela referência (`referenceAt`: a conclusão, senão o início, senão o prazo\
        \ da rotina), com as respostas de marcação por resultado (parciais enquanto\
        \ em andamento). O período filtra pela referência. Só os itens de marcaçã\
        o têm resultado: OK conta como conforme, NÃO OK como não conforme, e \"nã\
        o se aplica\" fica fora do denominador (`evaluatedCount` = OK + NÃO OK). Perí\
        odo em datas no fuso do hotel, inclusive nas duas pontas (`from` e `to`, opcionais);\
        \ fim antes do início: 400 `CHECKLIST_REPORT_PERIOD_INVALID`. Exige `checklists.reports.read`."
      operationId: getChecklistLocationHistory
      parameters:
      - description: "O tipo do sujeito (o local: `rooms.room`, `rooms.area`…)."
        in: query
        name: subjectType
        required: true
        schema:
          type: string
          maxLength: 60
          minLength: 1
      - description: O sujeito (o local).
        in: query
        name: subjectId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Primeira data (YYYY-MM-DD), no fuso do hotel."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Última data (YYYY-MM-DD), inclusive, no fuso do hotel."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: templateId
        required: false
        schema:
          type: string
          format: uuid
      - description: Cursor opaco devolvido em `nextCursor` pela página anterior;
          omita na primeira página.
        in: query
        name: cursor
        required: false
