      - departmentId
      - end
      - name
      - start
    CreateUserRequest:
      type: object
      properties:
        login:
          type: string
          description: "Login ou e-mail: 3 a 100 caracteres (letras, dígitos e . _\
            \ @ + -); não diferencia maiúsculas."
          example: maria.silva
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
