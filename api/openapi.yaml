          example: "123.45"
          nullable: true
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        email:
          type: string
          nullable: true
        id:
          type: string
          format: uuid
        legalName:
          type: string
        municipalRegistration:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        stateRegistration:
