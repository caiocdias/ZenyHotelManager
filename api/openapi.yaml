      summary: Consultar as taxas
      tags:
      - hotel
    put:
      description: Exige `hotel.settings.manage` e o `If-Match`. Taxa de serviço padrão
        de 0% a 100% (400 `SERVICE_CHARGE_RATE_INVALID`); ISS de 0% a 5% (400 `ISS_RATE_INVALID`);
        taxa de turismo nula (não cobrada) ou positiva (400 `TOURISM_FEE_INVALID`).
      operationId: updateHotelTaxSettings
      parameters:
      - in: header
