  /api/v1/folios/{id}/reopen:
    post:
      description: "RF-CTA-11: ação **sensível** (`billing.folios.reopen`, sem limite\
        \ de valor): sem a permissão, 403 `APPROVAL_REQUIRED` (com `action` `billing.folio.reopen`,\
        \ `permission` e `resourceRef` `billing.folio:<id>`); repita com o `X-Approval-Token`\
        \ de `POST /api/v1/auth/approvals`. Exige antes `billing.folios.read` (sem\
        \ ela, 403 `PERMISSION_DENIED`) e o motivo (até 500; fica na reabertura, visí\
        vel no extrato interno, fora da trilha). Conta aberta: 409 `FOLIO_NOT_CLOSED`,\
        \ conferido antes da aprovação."
      operationId: reopenFolio
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/ApprovalToken"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolioReopenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolioResponse"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Ação sensível (RF-ACS-08). `APPROVAL_REQUIRED`: sem a permissã\
            o (ou acima do limite); o problema traz `action`, `permission`, `resourceRef`\
            \ e, se houver, `limit`, para `POST /api/v1/auth/approvals`. Com `X-Approval-Token`:\
            \ `APPROVAL_TOKEN_INVALID`, `APPROVAL_TOKEN_EXPIRED`, `APPROVAL_TOKEN_USED`,\
            \ `APPROVAL_TOKEN_MISMATCH` ou `APPROVER_NOT_ALLOWED`. Também `PERMISSION_DENIED`\
            \ e os códigos da operação."
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Reabrir uma conta encerrada
      tags:
      - billing
  /api/v1/folios/{id}/statement:
    get:
      description: "RF-CTA-12 (dados; o PDF vem no M5): lançamentos (inclusive estornos,\
        \ ajustes, transferências e taxa de serviço) e pagamentos (recebimentos, depó\
        sitos, capturas de caução e reembolsos) agrupados por data operacional, com\
        \ os totais do dia, o saldo acumulado e as cauções. A soma de `amount` das\
        \ linhas é exatamente o saldo. `audience=GUEST`: a prévia para o hóspede,\
        \ sem usuários, motivos, aprovações, NSU, autorização nem outros dados internos\
        \ (`internal` nulo, sem reaberturas). Exige `billing.folios.read`."
      operationId: getFolioStatement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: '`INTERNAL` (padrão) ou `GUEST`.'
        in: query
        name: audience
        required: false
        schema:
          type: string
          default: INTERNAL
          enum:
          - INTERNAL
          - GUEST
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolioStatementResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Extrato da conta
      tags:
      - billing
  /api/v1/guarantee-policies:
    get:
      description: Em ordem de nome. Exige `rates.plans.read`.
      operationId: listGuaranteePolicies
      parameters:
