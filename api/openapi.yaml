        \ antes (RN-11)."
      nullable: true
      properties:
        fee:
          type: string
          format: decimal
          description: Valor em reais (BRL) como decimal com até 2 casas.
          example: "123.45"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
