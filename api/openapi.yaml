    put:
      description: "Exige `hotel.settings.manage` e o `If-Match`. Valor fora da faixa:\
        \ 400 `OPERATIONAL_SETTING_INVALID` com o campo em `errors[]`; horário com\
        \ segundos: 400 `TIME_NOT_WHOLE_MINUTE`."
      operationId: updateHotelOperationalSettings
      parameters:
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationalSettingsDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalSettingsDto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar os parâmetros operacionais
      tags:
      - hotel
  /api/v1/hotel/policies:
    get:
      description: Exige `hotel.settings.read`. O `ETag` vai no `If-Match` da edição.
      operationId: getHotelPolicies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySettingsDto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar as políticas operacionais
      tags:
      - hotel
    put:
      description: "Troca a política inteira. Exige `hotel.settings.manage` e o `If-Match`.\
        \ Pela Portaria MTur 28/2025 (RN-11): check-out antes do check-in, no mesmo\
        \ dia (400 `CHECK_TIMES_INCOHERENT`); no máximo 3 horas entre eles e de janela\
        \ de arrumação (400 `CLEANING_WINDOW_TOO_LONG`); janela que cabe entre eles\
        \ (400 `CLEANING_WINDOW_INVALID`); early check-in antes do check-in e late\
        \ check-out depois do check-out, com preço informado (400 `EARLY_CHECK_IN_INVALID`/`LATE_CHECK_OUT_INVALID`);\
        \ faixas etárias contíguas de 0 à idade limite (400 `CHILD_AGES_INVALID`);\
        \ texto das confirmações obrigatório; horários em horas e minutos, sem segundos\
        \ (400 `TIME_NOT_WHOLE_MINUTE`)."
      operationId: updateHotelPolicies
      parameters:
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySettingsDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySettingsDto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar as políticas operacionais
      tags:
      - hotel
  /api/v1/hotel/tax-settings:
    get:
      description: Exige `hotel.settings.read`. O `ETag` vai no `If-Match` da edição.
      operationId: getHotelTaxSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSettingsDto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar as taxas
      tags:
      - hotel
