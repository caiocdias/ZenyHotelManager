    Problem:
      type: object
      description: Problema RFC 9457 (application/problem+json).
      properties:
        action:
          type: string
          description: "Em `APPROVAL_REQUIRED`: a operação sensível pedida."
          example: iam.user.deactivate
        code:
          type: string
          description: "Código estável do erro, para o cliente traduzir. Comuns: VALIDATION_FAILED,\
            \ MALFORMED_REQUEST, INVALID_CURSOR, UNAUTHENTICATED, ACCESS_DENIED, PASSWORD_CHANGE_REQUIRED,\
            \ APPROVAL_REQUIRED, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE, CONFLICT,\
            \ PRECONDITION_FAILED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, BUSINESS_RULE_VIOLATED,\
            \ PRECONDITION_REQUIRED, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID,\
            \ IDEMPOTENCY_KEY_IN_USE, IDEMPOTENCY_KEY_REUSED, REQUEST_REJECTED, INTERNAL_ERROR,\
            \ SERVICE_UNAVAILABLE. Cada módulo acrescenta os seus."
          example: VALIDATION_FAILED
          pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
        detail:
          type: string
          description: "Explicação em pt-BR, para o usuário."
        errors:
          type: array
          description: Erros por campo; presente nos erros de validação.
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: Caminho da requisição.
        limit:
          type: object
          description: "Em `APPROVAL_REQUIRED` de uma ação acima do limite: a chave\
            \ do limite e o valor pedido (texto decimal), que o aprovador precisa\
            \ cobrir."
          properties:
            amount:
              type: string
              format: decimal
              example: "15"
            key:
              type: string
              example: maxPercent
          required:
          - amount
          - key
        permission:
          type: string
          description: "Em `APPROVAL_REQUIRED`: a permissão que o aprovador precisa\
            \ ter."
          example: iam.users.manage
        resourceRef:
          type: string
          description: "Em `APPROVAL_REQUIRED`: o registro sobre o qual a operaçã\
            o age."
          example: iam.user:0199d6b8-1f2e-7a3b-8c4d-5e6f7a8b9c0d
        status:
          type: integer
          format: int32
          description: Status HTTP.
          example: 400
        title:
          type: string
          description: "Frase do status HTTP, em pt-BR."
          example: Requisição inválida
        type:
          type: string
          format: uri
          description: Tipo do problema; ausente equivale a about:blank.
          example: about:blank
      required:
      - code
      - status
      - title
