          type: string
          description: "O teto, como decimal em string, na unidade do limite."
          example: "10.5"
          nullable: true
          pattern: "\\d{1,14}(\\.\\d{1,4})?"
        unlimited:
          type: boolean
          description: Sem teto.
      required:
      - key
      - unlimited
    LimitValueResponse:
      type: object
      description: "O limite efetivo de uma chave: sem teto ou o teto."
      properties:
        key:
          type: string
          example: maxPercent
        max:
          type: string
          description: "O teto, como decimal em string; nulo quando unlimited."
          example: "10.5"
          nullable: true
        unlimited:
          type: boolean
          description: Sem teto.
      required:
      - key
      - unlimited
