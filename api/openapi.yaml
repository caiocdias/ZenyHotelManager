  /api/v1/rate-plans/{id}/restrictions:
    get:
      description: "Um período de até 366 dias, inclusive o passado (fim antes do\
        \ início: 400 `RESTRICTION_PERIOD_INVALID`; mais: 400 `RESTRICTION_PERIOD_TOO_LONG`).\
        \ Por data com alguma restrição gravada: a geral do plano e, por tipo de UH,\
        \ a do tipo e a efetiva (com os campos que vieram do tipo em `fromRoomType`).\
        \ Semântica (avaliada na cotação e na reserva): `closed` fecha a venda de\
        \ **qualquer noite** da estadia; `closedToArrival` (CTA) impede **chegar**\
        \ nesta data e `closedToDeparture` (CTD) impede **sair** nesta data (só a\
        \ data exata; as noites do meio não importam); `minStay`/`maxStay` (noites)\
        \ e `minAdvanceDays`/`maxAdvanceDays` (dias da data operacional até a chegada)\
        \ valem os da **data de chegada**. Precedência: a restrição do tipo de UH\
        \ substitui a geral do plano **campo a campo** (o campo não informado herda\
        \ o da geral; `false` num booleano do tipo abre uma exceção sobre a geral\
        \ `true`). Exige `rates.plans.read`."
      operationId: listRatePlanRestrictions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      - description: Só este tipo de UH.
        in: query
        name: roomTypeId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Consultar as restrições de um plano num período
      tags:
      - rates
  /api/v1/rate-plans/{id}/restrictions/bulk-update:
    post:
      description: "As linhas são a restrição geral do plano (`roomTypeIds` vazio)\
        \ ou as dos tipos de UH pedidos (do plano; senão 422 `ROOM_TYPE_NOT_IN_PLAN`)\
        \ × as datas do período (`from` e `to`, até 366 dias, a partir da data operacional)\
        \ **ou** da temporada (`seasonId`, cortada na data operacional), só nos `weekdays`\
        \ (vazio = todos). Os campos de `set` passam a valer, os de `clear` voltam\
        \ a não informado, os demais ficam. Período e temporada juntos, ou nenhum:\
        \ 400 `RESTRICTION_SELECTION_INVALID`; fim antes do início ou nenhuma data\
        \ nos dias da semana: 400 `RESTRICTION_PERIOD_INVALID`; mais de 366 dias:\
        \ 400 `RESTRICTION_PERIOD_TOO_LONG`; começo antes da data operacional: 422\
        \ `RESTRICTION_PERIOD_IN_PAST`; temporada inexistente 400 `UNKNOWN_SEASON`,\
        \ desativada 422 `SEASON_INACTIVE`. Valor fora da faixa (inclusive negativo),\
        \ campo em `set` e `clear` ou nada a mudar: 400 `RESTRICTION_INVALID`; mí\
        nimo maior que o máximo no pedido: 400 `RESTRICTION_RANGE_INVALID`; com o\
        \ que já está gravado (na mesma linha ou na efetiva de um tipo): 422 `RESTRICTION_RANGE_CONFLICT`.\
        \ Semântica (avaliada na cotação e na reserva): `closed` fecha a venda de\
        \ **qualquer noite** da estadia; `closedToArrival` (CTA) impede **chegar**\
        \ nesta data e `closedToDeparture` (CTD) impede **sair** nesta data (só a\
        \ data exata; as noites do meio não importam); `minStay`/`maxStay` (noites)\
        \ e `minAdvanceDays`/`maxAdvanceDays` (dias da data operacional até a chegada)\
        \ valem os da **data de chegada**. Precedência: a restrição do tipo de UH\
        \ substitui a geral do plano **campo a campo** (o campo não informado herda\
        \ o da geral; `false` num booleano do tipo abre uma exceção sobre a geral\
        \ `true`). Exige `rates.restrictions.manage`; publica `RestrictionsChanged`."
      operationId: updateRatePlanRestrictions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictionUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionChangeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Gravar restrições em massa
      tags:
      - rates
