      summary: Consultar um colaborador
      tags:
      - staff
    put:
      description: "Troca os dados e o usuário vinculado (nulo: sem vínculo). Exige\
        \ `staff.employees.manage` e o `If-Match` (ausente: 428; versão diferente:\
        \ 412). Um usuário novo no vínculo segue as regras do cadastro (`UNKNOWN_USER`,\
        \ `USER_INACTIVE`, `USER_ALREADY_LINKED`)."
      operationId: updateEmployee
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Erro no formato RFC 9457, com `code` estável."
      summary: Editar um colaborador
      tags:
      - staff
  /api/v1/employees/{id}/deactivate:
    post:
      description: "Exige `staff.employees.manage`. Nada é apagado: o cadastro, o\
        \ vínculo e o histórico ficam; as entradas de trabalho (turno e troca) a partir\
        \ da data operacional saem da escala, e a geração deixa de escalá-lo. Desativar\
        \ de novo não muda nada."
      operationId: deactivateEmployee
      parameters:
      - in: path
        name: id
