          format: uuid
      - in: path
        name: postingId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingResponse"
          description: Taxa removida.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "409":
          content:
            application/problem+json:
              schema:
