# Configuração base. Profiles: `local` (desenvolvimento) e `prod` (implantação).
# Segredos nunca entram aqui: vêm de variáveis de ambiente (ARCHITECTURE §15.1).
spring:
  application:
    name: zeny-hotel-manager

  # Segurança mínima até o M1 (shared/web/SecurityConfiguration): sem o usuário em memória com
  # senha gerada que o Boot criaria; ninguém autentica até chegar o JWT.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # API (ARCHITECTURE §7): datas em ISO-8601, instantes em UTC com `Z` (use `Instant` nos DTOs)
  # e datas de negócio `YYYY-MM-DD` (`LocalDate`). Money/Percent saem como string pelos tipos.
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false

  # Mensagens em pt-BR (RNF-13), inclusive as de validação, qualquer que seja o Accept-Language;
  # os clientes traduzem pelo `code` dos erros.
  web:
    locale: pt_BR
    locale-resolver: fixed

  # Banco (ARCHITECTURE §11). Sem valor padrão: em `prod` a aplicação não sobe sem as variáveis.
  datasource:
    url: ${ZENY_DB_URL}
    username: ${ZENY_DB_USERNAME}
    password: ${ZENY_DB_PASSWORD}
    hikari:
      # Toda sessão em UTC, independente do fuso da JVM ou do servidor (RN-01, D16): o driver
      # do PostgreSQL abre a sessão no fuso da JVM, e casts/`::date`/`to_char` dependem dele.
      connection-init-sql: SET TIME ZONE 'UTC'
      # Espera máxima por uma conexão (padrão do Hikari: 30 s). Com o banco fora, a readiness
      # (que pede uma conexão) responde DOWN em cerca de 5 s, dentro do timeout do HEALTHCHECK (10 s).
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # O schema é do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  # Migrações: uma pasta por módulo em db/migration/<módulo>/, versão por timestamp. O schema
  # de cada módulo é o nome da pasta e o Flyway o cria (ModuleSchemasFlywayCustomizer). O
  # histórico fica em shared.flyway_schema_history. Passo a passo no CLAUDE.md.
  flyway:
    locations: classpath:db/migration
    default-schema: shared

  modulith:
    events:
      # Outbox (Event Publication Registry) em JDBC, no schema shared; a tabela vem do Flyway.
      jdbc:
        schema: shared
        schema-initialization:
          enabled: false
      # No boot, reenvia as publicações que ficaram incompletas (ARCHITECTURE §5 e §13).
      republish-outstanding-events-on-restart: true
      # Publicação parada há mais que isso (processo caiu no meio) passa a FAILED e entra no
      # reprocessamento do EventPublicationResubmissionJob.
      staleness:
        published: PT10M
        processing: PT10M
        resubmitted: PT10M

# Contrato OpenAPI (ARCHITECTURE §7, D6): gerado do código pela tarefa `generateOpenApi` e
# versionado em api/openapi.yaml. Ordenado e indentado para o diff ser estável e legível.
springdoc:
  # Ligados fora de `prod` (o profile `prod` os desliga abaixo).
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json

# Observabilidade (ARCHITECTURE §16). Do actuator, só três caminhos existem na web, todos sem
# autenticação (shared/web/SecurityConfiguration): /actuator/health/liveness,
# /actuator/health/readiness e /actuator/prometheus. Os demais endpoints nem são criados
# (acesso padrão `none`), e o /actuator/health agregado é negado pela segurança.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, prometheus
      # Sem a página /actuator que lista os endpoints.
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      # Grupos liveness e readiness também fora do Kubernetes (HEALTHCHECK da imagem, compose).
      probes:
        enabled: true
      # Só o estado agregado: nada de componentes, versões ou mensagens de erro.
      show-components: never
      show-details: never
      group:
        # Pronta para receber tráfego só com o banco respondendo. A liveness fica só com o
        # estado da aplicação: banco fora não é motivo para reiniciar o processo.
        readiness:
          include: readinessState, db
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
  # traceId/spanId em toda requisição (MDC dos logs) e propagação W3C `traceparent`. Sem
  # exportador de spans por enquanto (OpenTelemetry opcional, ARCHITECTURE §16).
  tracing:
    propagation:
      type: w3c

logging:
  level:
    # O monitor de staleness do Modulith escreve três linhas INFO por minuto ("No stale
    # publications…"); publicações paradas aparecem na métrica do outbox (OutboxMetrics).
    org.springframework.modulith.events.core.DefaultEventPublicationRegistry: WARN

zeny:
  events:
    resubmission:
      # Reprocessamento das publicações com falha (ARCHITECTURE §13: a cada minuto).
      interval: PT1M
      initial-delay: PT1M
    # Gauges do outbox (shared.event_publication) no Prometheus: o OutboxMetrics recalcula a
    # contagem e a idade da mais antiga das publicações pendentes e com falha neste intervalo,
    # para a raspagem não depender do banco.
    metrics:
      refresh-interval: PT30S
  # Idempotency-Key nos endpoints @Idempotent (ARCHITECTURE §7): a resposta fica guardada por
  # 24h em shared.idempotency_key; o corpo da requisição é lido inteiro para o hash, até o limite
  # (acima, 413). O job de expurgo apaga as chaves vencidas, sob trava do ShedLock.
  idempotency:
    retention: PT24H
    max-request-body-size: 1MB
    purge:
      interval: PT1H
      initial-delay: PT5M
  # Cifragem de campo (ARCHITECTURE §8.3). Sem valor padrão em nenhum profile: sem as
  # variáveis a aplicação não sobe. ZENY_ENCRYPTION_KEYS = "id:base64,id:base64" (32 bytes
  # cada, AES-256); ZENY_ENCRYPTION_ACTIVE_KEY_ID = id da chave que cifra os valores novos.
  encryption:
    keys: ${ZENY_ENCRYPTION_KEYS}
    active-key-id: ${ZENY_ENCRYPTION_ACTIVE_KEY_ID}

---
spring:
  config:
    activate:
      on-profile: local
  # Valores só de desenvolvimento (banco local em localhost:5432); não são segredos.
  datasource:
    url: ${ZENY_DB_URL:jdbc:postgresql://localhost:5432/zeny}
    username: ${ZENY_DB_USERNAME:zeny}
    password: ${ZENY_DB_PASSWORD:zeny}

logging:
  level:
    com.zeny.hotel: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: off

# Sem Swagger UI nem /v3/api-docs em produção (ARCHITECTURE §7): o contrato publicado é o
# api/openapi.yaml do repositório.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logs estruturados em JSON (ARCHITECTURE §16): uma linha por evento, no formato ECS (Elastic
# Common Schema), com `traceId` e `spanId` do MDC nas requisições.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
