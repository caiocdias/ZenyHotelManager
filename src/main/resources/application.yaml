# Configuração base. Profiles: `local` (desenvolvimento) e `prod` (implantação).
# Segredos nunca entram aqui: vêm de variáveis de ambiente (ARCHITECTURE §15.1).
spring:
  application:
    name: zeny-hotel-manager

  # Autenticação só por access token JWT (shared/web/SecurityConfiguration, módulo iam): sem o
  # usuário em memória com senha gerada que o Boot criaria.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # API (ARCHITECTURE §7): datas em ISO-8601, instantes em UTC com `Z` (use `Instant` nos DTOs)
  # e datas de negócio `YYYY-MM-DD` (`LocalDate`). Money/Percent saem como string pelos tipos.
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false

  # Upload de anexos (multipart, módulo files): o limite acompanha o maior tamanho aceito por uma
  # finalidade (zeny.files.max-upload-size); acima dele, 413 PAYLOAD_TOO_LARGE. O pedido inteiro
  # tem uma folga para os outros campos do formulário.
  servlet:
    multipart:
      max-file-size: ${zeny.files.max-upload-size}
      max-request-size: 21MB

  # Mensagens em pt-BR (RNF-13), inclusive as de validação, qualquer que seja o Accept-Language;
  # os clientes traduzem pelo `code` dos erros.
  web:
    locale: pt_BR
    locale-resolver: fixed

  # Banco (ARCHITECTURE §11), com dois papéis (H4 do roadmap do M1): a aplicação conecta com o
  # papel restrito (ZENY_DB_*: só DML, sem DDL e sem UPDATE/DELETE nas tabelas append-only) e o
  # Flyway com o dono dos schemas (ZENY_DB_MIGRATION_*, abaixo). Sem valor padrão: em `prod` a
  # aplicação não sobe sem as variáveis, e o DatabaseRoleGuard recusa a partida com o papel dono.
  datasource:
    url: ${ZENY_DB_URL}
    username: ${ZENY_DB_USERNAME}
    password: ${ZENY_DB_PASSWORD}
    hikari:
      # Toda sessão em UTC, independente do fuso da JVM ou do servidor (RN-01, D16): o driver
      # do PostgreSQL abre a sessão no fuso da JVM, e casts/`::date`/`to_char` dependem dele.
      connection-init-sql: SET TIME ZONE 'UTC'
      # Espera máxima por uma conexão (padrão do Hikari: 30 s). Com o banco fora, a readiness
      # (que pede uma conexão) responde DOWN em cerca de 5 s, dentro do timeout do HEALTHCHECK (10 s).
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # O schema é do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Datas e horários locais (LocalDate, LocalTime: data operacional, horários de check-in) vão
      # ao driver como java.time, sem passar por java.sql.Date/Time no fuso da JVM: sem isso, o
      # hibernate.jdbc.time_zone acima deslocaria um `time` pelo fuso da JVM (14:00 viraria 17:00
      # com a JVM em America/Sao_Paulo). Os instantes continuam em timestamptz UTC.
      hibernate.type.java_time_use_direct_jdbc: true

  # Migrações: uma pasta por módulo em db/migration/<módulo>/, versão por timestamp. O schema
  # de cada módulo é o nome da pasta e o Flyway o cria (ModuleSchemasFlywayCustomizer). O
  # histórico fica em shared.flyway_schema_history. Passo a passo no CLAUDE.md.
  flyway:
    locations: classpath:db/migration
    default-schema: shared
    # O Flyway usa o dono dos schemas, com conexão própria na mesma URL; as migrações concedem os
    # privilégios ao papel da aplicação, cujo nome chega pelo placeholder ${app_role}.
    user: ${ZENY_DB_MIGRATION_USERNAME}
    password: ${ZENY_DB_MIGRATION_PASSWORD}
    placeholders:
      "[app_role]": ${spring.datasource.username}

  modulith:
    events:
      # Outbox (Event Publication Registry) em JDBC, no schema shared; a tabela vem do Flyway.
      jdbc:
        schema: shared
        schema-initialization:
          enabled: false
      # No boot, reenvia as publicações que ficaram incompletas (ARCHITECTURE §5 e §13).
      republish-outstanding-events-on-restart: true
      # Publicação parada há mais que isso (processo caiu no meio) passa a FAILED e entra no
      # reprocessamento do EventPublicationResubmissionJob.
      staleness:
        published: PT10M
        processing: PT10M
        resubmitted: PT10M

# Contrato OpenAPI (ARCHITECTURE §7, D6): gerado do código pela tarefa `generateOpenApi` e
# versionado em api/openapi.yaml. Ordenado e indentado para o diff ser estável e legível.
springdoc:
  # Ligados fora de `prod` (o profile `prod` os desliga abaixo).
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json

# Observabilidade (ARCHITECTURE §16). Do actuator, só três caminhos existem na web, todos sem
# autenticação (shared/web/SecurityConfiguration): /actuator/health/liveness,
# /actuator/health/readiness e /actuator/prometheus. Os demais endpoints nem são criados
# (acesso padrão `none`), e o /actuator/health agregado é negado pela segurança.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, prometheus
      # Sem a página /actuator que lista os endpoints.
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      # Grupos liveness e readiness também fora do Kubernetes (HEALTHCHECK da imagem, compose).
      probes:
        enabled: true
      # Só o estado agregado: nada de componentes, versões ou mensagens de erro.
      show-components: never
      show-details: never
      group:
        # Pronta para receber tráfego só com o banco respondendo. A liveness fica só com o
        # estado da aplicação: banco fora não é motivo para reiniciar o processo.
        readiness:
          include: readinessState, db
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
  # traceId/spanId em toda requisição (MDC dos logs) e propagação W3C `traceparent`. Sem
  # exportador de spans por enquanto (OpenTelemetry opcional, ARCHITECTURE §16).
  tracing:
    propagation:
      type: w3c

logging:
  # Correlação nas linhas de log em texto (profile `local`): traceId, spanId e quem age (id do
  # usuário e da sessão de dispositivo, nunca login ou token). No `prod` os mesmos campos saem no
  # JSON (ECS) a partir do MDC.
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{userId:-},%X{deviceSessionId:-}] "
  level:
    # O monitor de staleness do Modulith escreve três linhas INFO por minuto ("No stale
    # publications…"); publicações paradas aparecem na métrica do outbox (OutboxMetrics).
    org.springframework.modulith.events.core.DefaultEventPublicationRegistry: WARN

zeny:
  events:
    resubmission:
      # Reprocessamento das publicações com falha (ARCHITECTURE §13: a cada minuto).
      interval: PT1M
      initial-delay: PT1M
    # Gauges do outbox (shared.event_publication) no Prometheus: o OutboxMetrics recalcula a
    # contagem e a idade da mais antiga das publicações pendentes e com falha neste intervalo,
    # para a raspagem não depender do banco.
    metrics:
      refresh-interval: PT30S
  # Idempotency-Key nos endpoints @Idempotent (ARCHITECTURE §7): a resposta fica guardada por
  # 24h em shared.idempotency_key; o corpo da requisição é lido inteiro para o hash, até o limite
  # (acima, 413). O job de expurgo apaga as chaves vencidas, sob trava do ShedLock.
  idempotency:
    retention: PT24H
    max-request-body-size: 1MB
    purge:
      interval: PT1H
      initial-delay: PT5M
  # Autenticação (ARCHITECTURE §8.1, módulo iam).
  iam:
    # Access token JWT assinado em RS256 com `kid` (H3).
    access-token:
      ttl: PT15M
      issuer: zeny-hotel-manager
    # Refresh token opaco, rotativo, com validade deslizante; os já trocados (detecção de reuso)
    # são expurgados depois da validade.
    refresh-token:
      ttl: P30D
      purge:
        interval: PT6H
        initial-delay: PT10M
    # Bloqueio progressivo: a partir da 5ª falha seguida, 1 min, dobrando a cada nova falha, até 1h.
    login:
      max-failures: 5
      lockout-base: PT1M
      lockout-max: PT1H
    # Aprovação de superior (step-up): o token vale 2 min (fixo). PIN errado tem bloqueio
    # próprio, separado do login: a partir da 3ª falha seguida, 1 min, dobrando até 1h.
    approval:
      pin-max-failures: 3
      pin-lockout-base: PT1M
      pin-lockout-max: PT1H
    # Argon2id para senha e PIN (OWASP: m=19 MiB, t=2, p=1).
    password-hashing:
      memory-kib: 19456
      iterations: 2
      parallelism: 1
    # Administrador inicial (H2), criado no primeiro boot só se não houver usuário, com troca de
    # senha obrigatória. Vazias, não criam nada; sem usuário e sem elas, a aplicação não sobe.
    initial-admin:
      login: ${ZENY_ADMIN_LOGIN:}
      password: ${ZENY_ADMIN_PASSWORD:}
    # Chaves RSA de assinatura, sem valor padrão em nenhum profile: sem as variáveis a aplicação
    # não sobe. ZENY_JWT_KEYS = "kid:base64,kid:base64" (chave privada RSA PKCS#8 DER em base64,
    # 2048 bits ou mais); ZENY_JWT_ACTIVE_KEY_ID = kid da chave que assina os tokens novos.
    jwt:
      keys: ${ZENY_JWT_KEYS}
      active-key-id: ${ZENY_JWT_ACTIVE_KEY_ID}
  # Anexos (ARCHITECTURE §8.3 e §14, módulo files). URLs de download assinadas de curta duração (de
  # 1 s a 15 min); o maior anexo aceito por uma finalidade (o multipart acima acompanha).
  files:
    download-url-ttl: PT5M
    max-upload-size: 20MB
    # Armazenamento compatível com S3 (D14), sem valor padrão no `prod`: sem as variáveis a
    # aplicação não sobe. A credencial é a de um usuário de serviço com política só do bucket
    # (criado pelo docker/storage/init-storage.sh), nunca a do root do MinIO.
    # ZENY_STORAGE_PUBLIC_ENDPOINT é o endereço que os clientes alcançam, usado nas URLs assinadas
    # dos anexos comuns (vazio = ZENY_STORAGE_ENDPOINT).
    storage:
      endpoint: ${ZENY_STORAGE_ENDPOINT}
      public-endpoint: ${ZENY_STORAGE_PUBLIC_ENDPOINT:}
      region: ${ZENY_STORAGE_REGION:us-east-1}
      bucket: ${ZENY_STORAGE_BUCKET}
      access-key: ${ZENY_STORAGE_ACCESS_KEY}
      secret-key: ${ZENY_STORAGE_SECRET_KEY}
  # Cifragem de campo (ARCHITECTURE §8.3). Sem valor padrão em nenhum profile: sem as
  # variáveis a aplicação não sobe. ZENY_ENCRYPTION_KEYS = "id:base64,id:base64" (32 bytes
  # cada, AES-256); ZENY_ENCRYPTION_ACTIVE_KEY_ID = id da chave que cifra os valores novos.
  encryption:
    keys: ${ZENY_ENCRYPTION_KEYS}
    active-key-id: ${ZENY_ENCRYPTION_ACTIVE_KEY_ID}

---
spring:
  config:
    activate:
      on-profile: local
  # Valores só de desenvolvimento (banco local em localhost:5432); não são segredos. O papel da
  # aplicação (zeny_app) é criado pelo script docker/postgres/initdb/ (CLAUDE.md, README.md).
  datasource:
    url: ${ZENY_DB_URL:jdbc:postgresql://localhost:5432/zeny}
    username: ${ZENY_DB_USERNAME:zeny_app}
    password: ${ZENY_DB_PASSWORD:zeny_app}
  flyway:
    user: ${ZENY_DB_MIGRATION_USERNAME:zeny}
    password: ${ZENY_DB_MIGRATION_PASSWORD:zeny}

# MinIO local em localhost:9000, com o usuário de serviço do docker/storage/init-storage.sh; valores
# só de desenvolvimento, não são segredos (README.md).
zeny:
  files:
    storage:
      endpoint: ${ZENY_STORAGE_ENDPOINT:http://localhost:9000}
      bucket: ${ZENY_STORAGE_BUCKET:zeny-files}
      access-key: ${ZENY_STORAGE_ACCESS_KEY:zeny-app}
      secret-key: ${ZENY_STORAGE_SECRET_KEY:zeny-app-dev-only}

logging:
  level:
    com.zeny.hotel: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: off

# Sem Swagger UI nem /v3/api-docs em produção (ARCHITECTURE §7): o contrato publicado é o
# api/openapi.yaml do repositório.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logs estruturados em JSON (ARCHITECTURE §16): uma linha por evento, no formato ECS (Elastic
# Common Schema), com `traceId` e `spanId` do MDC nas requisições.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
